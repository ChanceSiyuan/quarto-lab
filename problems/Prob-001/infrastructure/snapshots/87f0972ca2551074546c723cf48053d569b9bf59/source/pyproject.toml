[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoqec-zoo"
version = "0.1.0"
description = "Structured QEC Zoo builder for AutoQEC"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9"
]

[project.scripts]
autoqec-zoo = "autoqec_zoo.cli:main"
autoqec-search = "autoqec_search.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: tests that exercise cold-start dependency installation or heavy precompilation paths",
]
