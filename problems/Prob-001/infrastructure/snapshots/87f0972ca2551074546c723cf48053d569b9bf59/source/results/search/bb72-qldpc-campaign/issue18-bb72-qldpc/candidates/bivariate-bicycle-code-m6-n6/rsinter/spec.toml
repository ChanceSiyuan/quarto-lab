name = "autoqec-bb-css-memory-x-cdep-v1"
version = 1
mode = "independent"

[[runner]]
name = "rbposd-bb72-osd1-v1"
language = "rust"
impl_key = "rbposd"
[runner.params]
input_type = "css"
code_id = "bivariate-bicycle-code-m6-n6"
hx = "../artifacts/hx.sparse_rows.json"
hz = "../artifacts/hz.sparse_rows.json"
observables = "input/observables.css.json"
basis = "x"
schedule = "greedy"
rounds = [3]
p = [0.003, 0.01]
max_shots = 16
max_errors = 8
batch_size = 16
seed = 12345
bp_algorithm = "min_sum"
bp_iters = 50
early_stop = true
osd_method = "combination_sweep"
osd_order = 1

[plot]
title = "AutoQEC bb-css-memory-x-cdep-v1"
[plot.x]
field = "params.p"
scale = "log"
label = "Physical Error Rate"
[plot.series]
group_by = ["runner", "params.code_id"]
label_template = "{runner} {params.code_id}"
[[plot.panel]]
metric = "metrics.logical_error_rate"
scale = "log"
label = "Logical Error Rate"
