name = "autoqec-bb-css-memory-x-cdep-v1"
version = 1
mode = "independent"

[[runner]]
name = "rbposd-osd0-v1"
language = "rust"
impl_key = "rbposd"
[runner.params]
input_type = "css"
code_id = "bivariate-bicycle-code-m6-n6"
hx = "../artifacts/hx.sparse_rows.json"
hz = "../artifacts/hz.sparse_rows.json"
basis = "x"
schedule = "greedy"
rounds = [3]
p = [0.003]
max_shots = 64
max_errors = 32
batch_size = 64
bp_iters = 50
early_stop = true
osd_order = 0

[[runner]]
name = "predict-zero-v1"
language = "rust"
impl_key = "predict-zero"
[runner.params]
input_type = "css"
code_id = "bivariate-bicycle-code-m6-n6"
hx = "../artifacts/hx.sparse_rows.json"
hz = "../artifacts/hz.sparse_rows.json"
basis = "x"
schedule = "greedy"
rounds = [3]
p = [0.003]
max_shots = 64
max_errors = 32
batch_size = 64

[plot]
title = "AutoQEC bb-css-memory-x-cdep-v1"
[plot.x]
field = "params.p"
scale = "log"
label = "Physical Error Rate"
[plot.series]
group_by = ["runner", "params.code_id"]
label_template = "{runner} {params.code_id}"
[[plot.panel]]
metric = "metrics.logical_error_rate"
scale = "log"
label = "Logical Error Rate"
