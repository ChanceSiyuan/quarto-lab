name = "autoqec-rotated-memory-z-cdep-v1"
version = 1
mode = "independent"

[[runner]]
name = "rmatching-default-v1"
language = "rust"
impl_key = "rmatching"
[runner.params]
distance = [7]
rounds = [21]
p = [0.008, 0.009, 0.01, 0.011, 0.012]
max_shots = 100000
max_errors = 1000
batch_size = 256
input_type = "memory-z"

[plot]
title = "AutoQEC rotated-memory-z-cdep-v1"
[plot.x]
field = "params.p"
scale = "log"
label = "Physical Error Rate"
[plot.series]
group_by = ["runner", "params.distance"]
label_template = "{runner} d={params.distance}"
[[plot.panel]]
metric = "metrics.logical_error_rate"
scale = "log"
label = "Logical Error Rate"
