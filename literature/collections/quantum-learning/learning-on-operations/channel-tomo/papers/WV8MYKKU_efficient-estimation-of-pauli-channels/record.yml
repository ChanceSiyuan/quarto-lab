                log s/ϵ) measurements. Finally, we show that when the Pauli channel is given by a Markov field with at most
                k
                -local correlations, we can learn an entire
                n
                -qubit Pauli channel to relative precision ϵ with only
                
                  O
                  k
                
                (ϵ
                -2
                n
