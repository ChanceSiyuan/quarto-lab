item_type: journalArticle
title: Subspace benchmarking high-fidelity entangling operations with trapped ions
authors:
  - first: C. H.
    last: Baldwin
  - first: B. J.
    last: Bjork
  - first: J. P.
    last: Gaebler
  - first: D.
