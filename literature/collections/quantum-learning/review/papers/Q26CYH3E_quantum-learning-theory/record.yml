abstract: This dissertation treats questions from quantum learning theory, at
  the intersection point of quantum information theory and machine learning. We
  prove guarantees on how variational quantum machine learning models generalize
  from training data to unseen data. And we explore the complexity of tasks of
  learning an unknown map from quantum data. Finally, we discuss questions
  related to Markovianity in quantum evolutions and aspects of undecidability in
  learning theory.
