year: 2025
abstract: We develop a framework for learning from noisy quantum experiments,
  focusing on fault-tolerant devices accessing uncharacterized systems through
  noisy couplings. Our starting point is the complexity class $\textsf{NBQP}$
  ("noisy BQP"), modeling noisy fault-tolerant quantum computers that cannot, in
  general, error-correct the oracle systems they query. Using this class, we
  show that for natural oracle problems, noise can eliminate exponential quantum
  learning advantages of ideal noiseless learners while preserving a
  superpolynomial gap between NISQ and fault-tolerant devices. Beyond oracle
  separations, we study concrete noisy learning tasks. For purity testing, the
  exponential two-copy advantage collapses under a single application of local
  depolarizing noise. Nevertheless, we identify a setting motivated by AdS/CFT
  in which noise-resilient structure restores a quantum learning advantage in a
  noisy regime. We then analyze noisy Pauli shadow tomography, deriving lower
  bounds that characterize how instance size, quantum memory, and noise control
  sample complexity, and design algorithms with parametrically similar scalings.
  Together, our results show that the Bell-basis and SWAP-test primitives
  underlying most exponential quantum learning advantages are fundamentally
  fragile to noise unless the experimental system has latent noise-robust
  structure. Thus, realizing meaningful quantum advantages in future experiments
  will require understanding how noise-robust physical properties interface with
  available algorithmic techniques.
