year: 2022
abstract: By virtue of photonic systems, we experimentally realized eﬃcient
  veriﬁcation of a cnot gate and a Toﬀoli gate with local state preparations and
  measurements. The experimental results clearly show that the veriﬁcation
  protocols can achieve nearly optimal performance without relying on entangling
  operations, and are substantially more eﬃcient than QPT. Moreover, they are
  scalable and robust to the imperfections of the actual quantum gates. Notably,
  only 2600 tests are required to verify the Toﬀoli gate with ﬁdelity 97% and
  conﬁdence level 95%. Our work demonstrates that QGV is a powerful tool for the
  veriﬁcation of quantum gates and quantum devices, and may play a key role in
  the development of quantum technologies.
