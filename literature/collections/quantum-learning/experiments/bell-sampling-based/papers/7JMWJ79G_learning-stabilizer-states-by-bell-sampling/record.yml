title: Learning stabilizer states by Bell sampling
authors:
  - first: Ashley
    last: Montanaro
year: 2017
abstract: We show that measuring pairs of qubits in the Bell basis can be used
  to obtain a simple quantum algorithm for efficiently identifying an unknown
  stabilizer state of n qubits. The algorithm uses O(n) copies of the input
  state and fails with exponentially small probability.
