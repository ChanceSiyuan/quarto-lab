abstract: Machine learning is a branch of artiﬁcial intelligence, and it has
  been widely used in many science and engineering areas, such as data mining,
  natural language processing, computer vision, biological analysis and so on.
  Quantum computer is considered as one of the most promising technologies of
  human beings in the near future. With the development of machine learning and
  quantum computing, researchers consider to combine these two aspects to gain
  more beneﬁts. As a result, a novel interdisciplinary subject has
  emerged—quantum machine learning. This paper reviews the state-of-the-art
  research of algorithms of quantum machine learning and shows a path of the
  research from the basic quantum information to quantum machine learning
  algorithms from the perspective of people in the ﬁeld of computer science.
