title: "Estimating the unseen: an n/log(n)-sample estimator for entropy and
  support size, shown optimal via new CLTs"
authors:
  - first: Gregory
    last: Valiant
  - first: Paul
    last: Valiant
year: 2011
abstract: We introduce a new approach to characterizing the unobserved portion
  of a distribution, which provides sublinear–sample estimators achieving
  arbitrarily small additive constant error for a class of properties that
  includes entropy and distribution support size. Additionally, we show new
  matching lower bounds. Together, this settles the longstanding question of the
  sample complexities of these estimation problems, up to constant factors.
