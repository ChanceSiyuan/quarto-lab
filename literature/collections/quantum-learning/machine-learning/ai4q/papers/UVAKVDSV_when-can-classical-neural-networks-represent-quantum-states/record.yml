item_type: preprint
title: When can classical neural networks represent quantum states?
authors:
  - first: Tai-Hsuan
    last: Yang
  - first: Mehdi
    last: Soleimanifar
  - first: Thiago
    last: Bergamaschi
  - first: John
    last: Preskill
year: 2024
abstract: A naive classical representation of an n-qubit state requires
  specifying exponentially many amplitudes in the computational basis. Past
  works have demonstrated that classical neural networks can succinctly express
  these amplitudes for many physically relevant states, leading to
  computationally powerful representations known as neural quantum states. What
  underpins the efficacy of such representations? We show that conditional
  correlations present in the measurement distribution of quantum states control
  the performance of their neural representations. Such conditional correlations
  are basis dependent, arise due to measurement-induced entanglement, and reveal
  features not accessible through conventional few-body correlations often
  examined in studies of phases of matter. By combining theoretical and
  numerical analysis, we demonstrate how the state's entanglement and sign
  structure, along with the choice of measurement basis, give rise to distinct
  patterns of short- or long-range conditional correlations. Our findings
  provide a rigorous framework for exploring the expressive power of neural
  quantum states.
