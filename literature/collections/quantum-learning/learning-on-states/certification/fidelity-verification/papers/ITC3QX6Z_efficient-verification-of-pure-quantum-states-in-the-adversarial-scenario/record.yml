item_type: journalArticle
title: Efficient Verification of Pure Quantum States in the Adversarial Scenario
authors:
  - first: Huangjun
    last: Zhu
  - first: Masahito
    last: Hayashi
year: 2019
abstract: Efficient verification of pure quantum states in the adversarial
  scenario is crucial to many applications in quantum information processing,
  such as blind measurement-based quantum computation and quantum networks.
  However, little is known about this topic so far. Here we establish a general
  framework for verifying pure quantum states in the adversarial scenario and
  clarify the resource cost. Moreover, we propose a simple and general recipe to
  constructing efficient verification protocols for the adversarial scenario
  from protocols for the nonadversarial scenario. With this recipe, arbitrary
  pure states can be verified in the adversarial scenario with almost the same
  efficiency as in the nonadversarial scenario. Many important quantum states
  can be verified in the adversarial scenario using local projective
  measurements with unprecedented high efficiencies.
