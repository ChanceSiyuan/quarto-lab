title: Universally Optimal Verification of Entangled States with Nondemolition
  Measurements
authors:
  - first: Ye-Chao
    last: Liu
  - first: Jiangwei
    last: Shang
  - first: Rui
    last: Han
  - first: Xiangdong
    last: Zhang
year: 2021
abstract: The efficient and reliable characterization of quantum states plays a
  vital role in most, if not all, quantum information processing tasks. In this
  work, we present a universally optimal protocol for verifying entangled states
  by employing the so-called quantum nondemolition measurements, such that the
  verification efficiency is equivalent to that of the optimal global strategy.
  Instead of being probabilistic as the standard verification strategies, our
  protocol is constructed sequentially, which is thus more favorable for
  experimental realizations. In addition, the target states are preserved in the
  protocol after each measurement, so can be reused in any subsequent tasks. We
  demonstrate the power of our protocol for the optimal verification of Bell
  states, arbitrary two-qubit pure states, and stabilizer states. We also prove
  that our protocol is able to perform tasks including fidelity estimation and
  state preparation.
