year: 2025
abstract: >-
  We consider the quantum memory assisted quantum state verification task, where
  an adversary prepares independent multipartite entangled states and sends them
  to the local verifiers, who then store several copies in the quantum memory
  and measure them collectively to make a decision. We establish an exact
  analytic formula for optimizing two-copy state verification, where the
  verifiers store two copies, and give a globally optimal two-copy strategy for
  multiqubit graph states involving only Bell measurements. When the verifiers
  can store arbitrarily many copies, we present a dimension expansion technique
  that designs efficient verification strategies for this case, showcasing its
  application to efficiently verifying Greenberger-Horne-Zeilinger (GHZ)-like
  states. These strategies become increasingly advantageous with growing memory
  resources, ultimately approaching the theoretical limit of efficiency. Our
  findings demonstrate that quantum memories enhance state verification
  efficiency, shedding light on error-resistant strategies and practical
  applications of large-scale quantum memory assisted verification.
              
                
                
                  
