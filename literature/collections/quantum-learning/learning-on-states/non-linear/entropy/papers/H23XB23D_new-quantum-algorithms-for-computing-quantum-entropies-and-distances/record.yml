abstract: We propose a series of quantum algorithms for computing a wide range
  of quantum entropies and distances, including the von Neumann entropy, quantum
  Rényi entropy, trace distance, and fidelity. The proposed algorithms
  significantly outperform the prior best (and even quantum) ones in the
  low-rank case, some of which achieve exponential speedups. In particular, for
  N -dimensional quantum states of rank r, our proposed quantum algorithms for
  computing the von Neumann entropy, trace distance and fidelity within additive
  error ε have time complexity of O˜(r/ε2), O˜(r5/ε6) and O˜(r6.5/ε7.5),
  respectively. By contrast, prior quantum algorithms for the von Neumann
  entropy and trace distance usually have time complexity Ω(N ), and the prior
  best one for fidelity has time complexity O˜(r12.5/ε13.5). The key idea of our
  quantum algorithms is to extend block-encoding from unitary operators in
  previous work to quantum states (i.e., density operators). It is realized by
  developing several convenient techniques to manipulate quantum states and
  extract information from them. The advantage of our techniques over the
  existing methods is that no restrictions on density operators are required; in
  sharp contrast, the previous methods usually require a lower bound on the
  minimal non-zero eigenvalue of density operators.
