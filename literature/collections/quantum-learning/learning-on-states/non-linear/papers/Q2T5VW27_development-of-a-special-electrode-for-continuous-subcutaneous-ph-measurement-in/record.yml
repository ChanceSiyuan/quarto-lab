item_type: journalArticle
title: Development of a special electrode for continuous subcutaneous pH
  measurement in the infant scalp
authors:
  - first: O.
    last: Stamm
  - first: U.
    last: Latscha
  - first: P.
    last: Janecek
  - first: A.
    last: Campana
year: 1976
abstract: Using a combined special glass electrode it is possible to monitor pH
  ratios and pH variation in the subcutaneous tissue of the infant scalp
  continuously. Tests on a normal sample of newborn babies immediately after
  birth showed a significant correlation between tissue pH and capillary blood
  pH, with the trend of pH variation being broadly similar in both measurement
  media.
