item_type: journalArticle
title: Single-copies estimation of entanglement negativity
authors:
  - first: You
    last: Zhou
  - first: Pei
    last: Zeng
  - first: Zhenhuan
    last: Liu
year: 2020
abstract: Entanglement plays a central role in quantum information processing,
  indicating the non-local correlation of quantum matters. However, few
  effective ways are known to detect the amount of entanglement of an unknown
  quantum state. In this work, we propose a scheme to estimate the entanglement
  negativity of any bi-partition of a composite system. The proposed scheme is
  based on the random unitary evolution and local measurements on the
  single-copy quantum states, which is more practical compared with former
  methods based on collective measurements on many copies of the identical
  state. Meanwhile, we generalize the scheme to quantify the total multi-partite
  correlation. We demonstrate the efficiency of the scheme with theoretical
  statistical analysis and numerical simulations. The proposed scheme is quite
  suitable for state-of-the-art quantum platforms, which can serve as not only a
  useful benchmarking tool to advance the quantum technology, but also a probe
  to study fundamental quantum physics, such as the entanglement dynamics.
