item_type: journalArticle
title: Quantum state estimation and large deviations
authors:
  - first: M.
    last: Keyl
year: 2006
abstract: In this paper we propose a method to estimate the density matrix \rho
  of a d-level quantum system by measurements on the N-fold system. The scheme
  is based on covariant observables and representation theory of unitary groups
  and it extends previous results concerning the estimation of the spectrum of
  \rho. We show that it is consistent (i.e. the original input state \rho is
  recovered with certainty if N \to \infty), analyze its large deviation
  behavior, and calculate explicitly the corresponding rate function which
  describes the exponential decrease of error probabilities in the limit N \to
  \infty. Finally we discuss the question whether the proposed scheme provides
  the fastest possible decay of error probabilities.
