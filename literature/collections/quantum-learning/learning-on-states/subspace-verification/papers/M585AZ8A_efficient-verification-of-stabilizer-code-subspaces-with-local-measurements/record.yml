year: 2024
abstract: We address the task of verifying whether a quantum computer, designed
  to be protected by a specific stabilizer code, correctly encodes the
  corresponding logical qubits. To achieve this, we develop a general framework
  for subspace verification and explore several stabilizer code subspaces of
  practical significance. First, we present two efficient verification
  strategies for general stabilizer code subspaces, utilizing measurements of
  their stabilizer generators and stabilizer groups, respectively. Then,
  building on the observation that certain tests can be conducted in parallel
  when the subspace exhibits specific structural properties, we propose a
  coloring strategy tailored to graph code subspaces and an XZ strategy tailored
  to Calderbank-Shor-Steane (CSS) code subspaces. Compared to stabilizer-based
  strategies, these new strategies require significantly fewer measurement
  settings and consume fewer state copies, approaching near-global optimality.
  Notably, all the strategies employ a limited number of Pauli measurements, are
  non-adaptive, and work on mixed states, enabling efficient experimental
  certification of both logical qubits and logical operations in noisy quantum
  computers. This work contributes to the first systematic study of efficient
  verification of stabilizer code subspaces with local measurements.
