item_type: journalArticle
title: "Introduction to Haar Measure Tools in Quantum Information: A Beginner's
  Tutorial"
authors:
  - first: Antonio Anna
    last: Mele
year: 2024
abstract: The Haar measure plays a vital role in quantum information, but its
  study often requires a deep understanding of representation theory, posing a
  challenge for beginners. This tutorial aims to provide a basic introduction to
  Haar measure tools in quantum information, utilizing only basic knowledge of
  linear algebra and thus aiming to make this topic more accessible. The
  tutorial begins by introducing the Haar measure with a specific emphasis on
  characterizing the moment operator, an essential element for computing
  integrals over the Haar measure. It also covers properties of the symmetric
  subspace and introduces helpful tools like tensor network diagrammatic
  notation, which aid in visualizing and simplifying calculations. Next, the
  tutorial explores the concept of unitary designs, providing equivalent
  definitions, and subsequently explores approximate notions of unitary designs,
  shedding light on the relationships between these different notions. Practical
  examples of Haar measure calculations are illustrated, including the
  derivation of well-known formulas such as the twirling of a quantum channel.
  Lastly, the tutorial showcases the applications of Haar measure calculations
  in quantum machine learning and classical shadow tomography.
