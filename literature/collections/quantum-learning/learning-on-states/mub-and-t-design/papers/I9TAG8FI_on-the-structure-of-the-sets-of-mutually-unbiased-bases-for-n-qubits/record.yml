title: On the structure of the sets of mutually unbiased bases for N qubits
authors:
  - first: J. L.
    last: Romero
  - first: G.
    last: Bjork
  - first: A. B.
    last: Klimov
  - first: L. L.
    last: Sanchez-Soto
year: 2005
abstract: For a system of N qubits, spanning a Hilbert space of dimension d = 2N
  , it is known that there exists d + 1 mutually unbiased bases. Diﬀerent
  construction algorithms exist, and it is remarkable that diﬀerent methods lead
  to sets of bases with diﬀerent properties as far as separability is concerned.
  Here we derive the four sets of nine bases for three qubits, and show how they
  are unitarily related. We also brieﬂy discuss the four-qubit case, give the
  entanglement structure of sixteen sets of bases,and show some of them, and
  their interrelations, as examples. The extension of the method to the general
  case of N qubits is outlined.
