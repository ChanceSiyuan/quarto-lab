year: 2024
abstract: >-
  We present a technique for enhancing the estimation of quantum state
  properties by incorporating approximate prior knowledge about the quantum
  state. This consists in performing randomized measurements on a quantum
  processor and comparing the results with those obtained from a classical
  computer that stores an approximation of the quantum state. We provide
  unbiased estimators for expectation values of multicopy observables and
  present performance guarantees in terms of variance bounds that depend on the
  prior knowledge accuracy. We demonstrate the effectiveness of our approach
  through experimental and numerical examples detecting mixed-state
  entanglement, and estimating polynomial approximations of the von Neumann
  entropy and state fidelities.
              
                
                
                  
                    Published by the American Physical Society
