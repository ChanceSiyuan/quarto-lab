item_type: preprint
title: Adaptive Pauli Shadows for Energy Estimation
authors:
  - first: Charles
    last: Hadfield
year: 2021
abstract: Locally-biased classical shadows allow rapid estimation of energies of
  quantum Hamiltonians. Recently, derandomised classical shadows have emerged
  claiming to be even more accurate. This accuracy comes at a cost of
  introducing classical computing resources into the energy estimation
  procedure. This present note shows, by adding a fraction of this classical
  computing resource to the locally-biased classical shadows setting, that the
  modified algorithm, termed Adaptive Pauli Shadows is state-of-the-art for
  energy estimation.
