item_type: preprint
title: Optimal Stabilizer Testing and Learning with Limited Quantum Memory
authors:
  - first: Srinivasan
    last: Arunachalam
  - first: Louis
    last: Schatzki
year: 2026
abstract: We study stabilizer state testing and learning with limited coherent
  quantum memory. Here an algorithm sequentially receives copies of an unknown
  $n$-qubit state, but may keep only $k$ qubits of coherent quantum memory
  between measurements. With unrestricted memory, seminal work of Gross, Nezami
  and Walter showed how to test $n$-qubit stabilizer states using $6$ copies,
  which is dimension independent, unlike the learning complexity of $Θ(n)$. We
  show that this testing-vs-learning separation is lost under memory
  constraints. More concretely we show that (1) The sample complexity of testing
  stabilizer states in the $k$-qubit memory framework is $Θ(n-k)$. Our upper
  bound goes via a novel connection to the hidden shift problem and the lower
  bound is proven using a novel approach to average case bounds on likelihood
  ratios via combinatorics of the stochastic orthogonal group. (2) The sample
  complexity of learning stabilizer states with $k$ qubits of memory, in the
  non-adaptive framework, is $Θ(n^2/k)$. As a further application of our
  techniques, we prove an exponential lower bound for purity testing even when
  the memory may be left coherent throughout the protocol. Our main results
  identify coherent quantum memory as the resource enabling the usual separation
  between stabilizer testing and learning. In particular, even with $k=0.99n$
  qubits of memory, there is no constant-copy stabilizer tester; furthermore for
  $k=cn$ qubits of memory (for $0< c < 1$), stabilizer testing is as hard as
  learning, with both requiring $Θ(n)$ copies.
