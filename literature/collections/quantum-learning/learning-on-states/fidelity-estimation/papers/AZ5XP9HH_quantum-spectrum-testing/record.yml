title: Quantum Spectrum Testing
authors:
  - first: Ryan
    last: O'Donnell
  - first: John
    last: Wright
year: 2015
abstract: In this work, we study the problem of testing properties of the
  spectrum of a mixed quantum C state. Here one is given n copies of a mixed
  state ρ ∈ d×d and the goal is to distinguish (with high probability) whether
  ρ’s spectrum satisﬁes some property P or whether it is at least -far in
  1-distance from satisfying P. This problem was promoted in the survey of
  Montanaro and de Wolf [MdW13] under the name of testing unitarily invariant
  properties of mixed states. It is the natural quantum analogue of the
  classical problem of testing symmetric properties of probability
  distributions.
