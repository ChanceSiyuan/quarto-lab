item_type: preprint
title: Quantum state certification
authors:
  - first: Costin
    last: Bădescu
  - first: Ryan
    last: O'Donnell
  - first: John
    last: Wright
year: 2017
abstract: "We consider the problem of quantum state certiﬁcation, where one is
  given n copies of an unknown d-dimensional quantum mixed state ρ, and one
  wants to test whether ρ is equal to some known mixed state σ or else is ǫ-far
  from σ. The goal is to use notably fewer copies than the Ω(d2) needed for full
  tomography on ρ (i.e., density estimation). We give two robust state
  certiﬁcation algorithms: one with respect to ﬁdelity using n = O(d/ǫ) copies,
  and one with respect to trace distance using n = O(d/ǫ2) copies. The latter
  algorithm also applies when σ is unknown as well. These copy complexities are
  optimal up to constant factors."
