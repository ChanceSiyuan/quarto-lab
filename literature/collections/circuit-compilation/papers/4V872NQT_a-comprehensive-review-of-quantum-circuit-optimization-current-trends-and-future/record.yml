year: 2025
abstract: Optimizing quantum circuits is critical for enhancing computational
  speed and mitigating errors caused by quantum noise. Effective optimization
  must be achieved without compromising the correctness of the computations.
  This survey explores recent advancements in quantum circuit optimization,
  encompassing both hardware-independent and hardware-dependent techniques. It
  reviews state-of-the-art approaches, including analytical algorithms,
  heuristic strategies, machine learning-based methods, and hybrid
  quantum-classical frameworks. The paper highlights the strengths and
  limitations of each method, along with the challenges they pose. Furthermore,
  it identifies potential research opportunities in this evolving field,
  offering insights into the future directions of quantum circuit optimization.
