abstract: Quantum computing is a new type of computing mode that follows the
  laws of quantum mechanics to process information, its application covers
  multiple fields such as cryptography, combinatorial optimization, and quantum
  simulation. The power of quantum computing relies on quantum algorithms, while
  the quantum algorithms must first be compiled into quantum circuits to
  execute. Reversible circuit is an important type of quantum circuits, and the
  synthesis and optimization of reversible circuits is one of the main research
  topics in quantum compilation. Some important progress in the synthesis and
  optimization of reversible circuits are summarized. Firstly, the synthesis and
  optimization of linear reversible circuits is introduced, and the optimization
  results in terms of the number of controlled-NOT (CNOT) gates and the depth of
  circuits are discussed. Then, the size and depth optimization of general
  reversible circuits are introduced, the upper and lower bounds that the
  current algorithms can achieve are analyzed. Finally, the extensions of
  reversible circuit synthesis and optimization are discussed.
