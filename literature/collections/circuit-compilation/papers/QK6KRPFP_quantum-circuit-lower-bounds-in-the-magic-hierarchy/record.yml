item_type: preprint
title: Quantum circuit lower bounds in the magic hierarchy
authors:
  - first: Natalie
    last: Parham
year: 2025
abstract: "We introduce the magic hierarchy, a quantum circuit model that
  alternates between arbitrary-sized Clifford circuits and constant-depth
  circuits with two-qubit gates ($\\textsf{QNC}^0$). This model unifies existing
  circuit models, such as $\\textsf{QAC}^0_f$ and models with adaptive
  intermediate measurements. Despite its generality, we are able to prove
  nontrivial lower bounds. We prove new lower bounds in the first level of the
  hierarchy, showing that certain explicit quantum states cannot be
  approximately prepared by circuits consisting of a Clifford circuit followed
  by $\\textsf{QNC}^0$. These states include ground states of some topologically
  ordered Hamiltonians and nonstabilizer quantum codes. Our techniques exploit
  the rigid structure of stabilizer codes and introduce an infectiousness
  property: if even a single state in a high distance code can be approximately
  prepared by one of these circuits, then the entire subspace must lie close to
  a perturbed stabilizer code. We also show that proving state preparation lower
  bounds beyond a certain level of the hierarchy would imply classical circuit
  lower bounds beyond the reach of current techniques in complexity theory. More
  broadly, our techniques go beyond lightcone-based methods and highlight how
  the magic hierarchy provides a natural framework for connecting circuit
  complexity, condensed matter, and Hamiltonian complexity."
