year: 2025
abstract: "A zoned neutral atom architecture achieves exceptional fidelity by
  segregating the execution spaces of 1- and 2-qubit gates, being a promising
  candidate for high-accuracy quantum systems. Unfortunately, naïvely applying
  programs designed for static qubit topologies to zoned architectures may
  result in most execution time being consumed by intra-zone travels of atoms.
  To address this, we introduce Mantra (Minimizing trAp movemeNts for aTom aRray
  Architectures), which rewrites quantum programs to reduce the interleaving of
  single- and two-qubit gates. Mantra incorporates three strategies: (i) a
  fountain-shaped controlled-Z (CZ) chain, (ii) ZZ-interaction protocol without
  a 1-qubit gate, and (iii) preemptive gate scheduling. Mantra reduces
  inter-zone movements by 68%, physical gate counts by 35%, and improves circuit
  fidelities by 17% compared to the standard executions."
