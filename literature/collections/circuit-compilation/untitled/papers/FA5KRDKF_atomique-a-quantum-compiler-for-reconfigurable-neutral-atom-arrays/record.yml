year: 2024
abstract: The neutral atom array has gained prominence in quantum computing for
  its scalability and operation fidelity. Previous works focus on fixed atom
  arrays (FAAs) that require extensive SWAP operations for long-range
  interactions. This work explores a novel architecture reconfigurable atom
  arrays (RAAs), also known as field programmable qubit arrays (FPQAs), which
  allows for coherent atom movements during circuit execution under some
  constraints. Such atom movements, which are unique to this architecture, could
  reduce the cost of longrange interactions significantly if the atom movements
  could be scheduled strategically.
