year: 2023
abstract: The Shor’s algorithm can ﬁnd solutions to the discrete logarithm
  problem on binary elliptic curves in polynomial time. A major challenge in
  implementing Shor’s algorithm is the overhead of representing and performing
  arithmetic on binary elliptic curves using quantum circuits. Multiplication of
  binary ﬁelds is one of the critical operations in the context of elliptic
  curve arithmetic, and it is especially costly in the quantum setting. Our goal
  in this paper is to optimize quantum multiplication in the binary ﬁeld. In the
  past, efforts to optimize quantum multiplication have centred on reducing the
  Toffoli gate count or qubits required. However, despite the fact that circuit
  depth is an important metric for indicating the performance of a quantum
  circuit, previous studies have lacked sufﬁcient consideration for reducing
  circuit depth. Our approach to optimizing quantum multiplication differs from
  previous work in that we aim at reducing the Toffoli depth and full depth. To
  optimize quantum multiplication, we adopt the Karatsuba multiplication method
  which is based on the divide-and-conquer approach. In summary, we present an
  optimized quantum multiplication that has a Toffoli depth of one.
  Additionally, the full depth of the quantum circuit is also reduced thanks to
  our Toffoli depth optimization strategy. To demonstrate the effectiveness of
  our proposed method, we evaluate its performance using various metrics such as
  the qubit count, quantum gates, and circuit depth, as well as the qubits-depth
  product. These metrics provide insight into the resource requirements and
  complexity of the method. Our work achieves the lowest Toffoli depth, full
  depth, and the best trade-off performance for quantum multiplication. Further,
  our multiplication is more effective when not used in stand-alone cases. We
  show this effectiveness by using our multiplication to the Itoh–Tsujii
  algorithm-based inversion of F(x8 + x4 + x3 + x + 1).
