year: 2025
abstract: This paper improves upon the quantum circuits required for the Shor’s
  attack on binary elliptic curves. We present two types of quantum point
  addition, taking both qubit count and circuit depth into consideration. In
  summary, we propose an in-place point addition that improves upon the work of
  Banegas et al. from CHES’21, reducing the qubit count – depth product by more
  than 73% – 81% depending on the variant. Furthermore, we develop an
  out-of-place point addition by using additional qubits. This method achieves
  the lowest circuit depth and offers an improvement of over 92% in the qubit
  count – quantum depth product (for a single step).
