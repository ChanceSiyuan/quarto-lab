item_type: preprint
title: End-to-end compilable implementation of quantum elliptic curve logarithm
  in Qrisp
authors:
  - first: Diego
    last: Polimeni
  - first: Raphael
    last: Seidel
year: 2025
abstract: Elliptic curve cryptography (ECC) is a widely established
  cryptographic technique, recognized for its effectiveness and reliability
  across a broad range of applications such as securing telecommunications or
  safeguarding cryptocurrency wallets. Although being more robust than RSA, ECC
  is, nevertheless, also threatened by attacks based on Shor's algorithm, which
  made it a popular field of study in quantum information science. A variety of
  techniques have been proposed to perform EC arithmetic in quantum devices;
  however, software support for compiling these algorithms into executables is
  extremely limited. Within this work, we leverage the Qrisp programming
  language to realize one of the first fully compilable implementations of EC
  arithmetic and verify its correctness using Qrisp's built-in sparse matrix
  simulator.
