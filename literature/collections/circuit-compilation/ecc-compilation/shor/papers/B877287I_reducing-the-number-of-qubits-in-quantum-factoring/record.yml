abstract: Abstract. This paper focuses on the optimization of the number of
  logical qubits in quantum algorithms for factoring and computing discrete
  logarithms in Z∗ N . These algorithms contain an exponentiation circuit modulo
  N , which is responsible for most of their cost, both in qubits and
  operations. In this paper, we show that using only o(log N ) work qubits, one
  can obtain the least signiﬁcant bits of the modular exponentiation output. We
  combine this result with May and Schlieper’s truncation technique (ToSC 2022)
  and the Eker˚a-H˚astad variant of Shor’s algorithm (PQCrypto 2017) to solve
  the discrete logarithm problem in Z∗ N using only d + o(log N ) qubits, where
  d is the bit-size of the logarithm. Consequently we can factor n-bit RSA
  moduli using n/2 + o(n) qubits, while current envisioned implementations
  require about 2n qubits. Our algorithm uses a Residue Number System and
  succeeds with a parametrizable probability. Being completely classical, we
  have implemented and tested it. For RSA factorization, we can reach a gate
  count O(n3) for a depth O(n2 log3 n), which then has to be multiplied by O(log
  n) (the number of measurement results required by Eker˚a-H˚astad). To factor
  an RSA-2048 instance, we estimate that 1730 logical qubits and 236 Toﬀoli
  gates will suﬃce for a single run, and the algorithm needs on average 40 runs.
  To solve a discrete logarithm instance of 224 bits (112bit classical security)
  in a safe-prime group of 2048 bits, we estimate that 684 logical qubits would
  suﬃce, and 20 runs with 232 Toﬀoli gates each.
