item_type: journalArticle
title: Quantum Period Finding is Compression Robust
authors:
  - first: Alexander
    last: May
  - first: Lars
    last: Schlieper
year: 2022
abstract: "We study quantum period finding algorithms such as Simon and Shor
  (and its variant Ekerå-Håstad). For a periodic function f these algorithms
  produce – via some quantum embedding of f – a quantum superposition ∑x |x〉
  |f(x)〉, which requires a certain amount of output qubits that represent
  |f(x)〉. We show that one can lower this amount to a single output qubit by
  hashing f down to a single bit in an oracle setting.Namely, we replace the
  embedding of f in quantum period finding circuits by oracle access to several
  embeddings of hashed versions of f. We show that on expectation this
  modification only doubles the required amount of quantum measurements, while
  significantly reducing the total number of qubits. For example, for Simon’s
  algorithm that finds periods in f : Fn2 → Fn2 our hashing technique reduces
  the required output qubits from n down to 1, and therefore the total amount of
  qubits from 2n to n + 1. We also show that Simon’s algorithm admits real world
  applications with only n + 1 qubits by giving a concrete realization of a
  hashed version of the cryptographic Even-Mansour construction. Moreover, for a
  variant of Simon’s algorithm on Even-Mansour that requires only classical
  queries to Even-Mansour we save a factor of (roughly) 4 in the qubits.Our
  oracle-based hashed version of the Ekerå-Håstad algorithm for factoring n-bit
  RSA reduces the required qubits from (3/2 + o(1))n down to (1/2+ o(1))n."
