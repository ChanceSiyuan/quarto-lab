item_type: preprint
title: Symmetry protected topological order as a requirement for
  measurement-based quantum gate teleportation
authors:
  - first: Zhuohao
    last: Liu
  - first: Emma C.
    last: Johnson
  - first: David L.
    last: Feder
year: 2023
abstract: All known resource states for measurement-based quantum teleportation
  in correlation space possess symmetry protected topological order, but is this
  a sufficient or even necessary condition? This work considers two families of
  one-dimensional qubit states to answer this question in the negative. The
  first is a family of matrix-product states with bond dimension two that
  includes the cluster state as a special case, protected by a global non-onsite
  symmetry, which is unable to deterministically teleport gates and which is
  characterized by a non-degenerate entanglement spectrum. The second are states
  with bond dimension four that are a resource for deterministic universal
  teleportation of finite single-qubit gates, but which possess no symmetry.
