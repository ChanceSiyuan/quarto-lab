item_type: preprint
title: Post-measurement Nonlocal Gates
authors:
  - first: Daegene
    last: Song
year: 2003
abstract: Several proposed quantum computer models include measurement
  processes, in order to implement nonlocal gates and create necessary
  entanglement resources during the computation. We introduce a scheme in which
  the measurements can be delayed for two- and three-qubit nonlocal gates. We
  also discuss implementing arbitrary nonlocal gates when measurements are
  included during the process.
