title: Efficient Implementation of Controlled-Rotations by Using Entanglement
authors:
  - first: Ming-Yong
    last: Ye
  - first: Yong-Sheng
    last: Zhang
  - first: Guang-Can
    last: Guo
year: 2006
abstract: Implementation of controlled-rotations using entanglement is
  considered. We show that the successful probability is closely related to the
  entanglement and the rotation angle. The successful probability will increase
  if we increase the entanglement we use or decrease the controlled-rotation
  angle and the probability will trend to unit when the entangled state trends
  to a Bell state or the controlled-rotation angle trends to zero.
