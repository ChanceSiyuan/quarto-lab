year: 2004
abstract: Teleportation of quantum gates is a critical step for implementation
  of quantum networking and teleportation-based models of quantum computation.
  We report an experimental demonstration of teleportation of the prototypical
  quantum controlled-NOT (CNOT) gate. Assisted with linear optical
  manipulations, photon entanglement produced from parametric down conversion,
  and coincidence measurements, we teleport the quantum CNOT gate from acting on
  local qubits to acting on remote qubits. The quality of the quantum gate
  teleportation is characterized through the method of quantum process
  tomography, with an average fidelity of 0.84 demonstrated for the teleported
  gate.
