title: Review on novel methods for lattice gauge theories
authors:
  - first: Mari Carmen
    last: Bañuls
  - first: Krzysztof
    last: Cichy
year: 2020
abstract: Formulating gauge theories on a lattice offers a genuinely
  non-perturbative way of studying quantum field theories, and has led to
  impressive achievements. In particular, it significantly deepened our
  understanding of quantum chromodynamics. Yet, some very relevant problems
  remain inherently challenging, such as real time evolution, or the presence of
  a chemical potential, cases in which Monte Carlo simulations are hindered by a
  sign problem. In the last few years, a number of possible alternatives have
  been put forward, based on quantum information ideas, which could potentially
  open the access to areas of research that have so far eluded more standard
  methods. They include tensor network calculations, quantum simulations with
  different physical platforms and quantum computations, and constitute nowadays
  a vibrant research area. Experts from different fields, including experimental
  and theoretical high energy physics, condensed matter, and quantum
  information, are turning their attention to these interdisciplinary
  possibilities, and driving the progress of the field. The aim of this article
  is to review the status and perspectives of these new avenues for the
  exploration of lattice gauge theories.
