item_type: journalArticle
title: Quantum dimer models with Rydberg gadgets
authors:
  - first: Zhongda
    last: Zeng
  - first: Giuliano
    last: Giudici
  - first: Hannes
    last: Pichler
year: 2025
abstract: The Rydberg blockade mechanism is an important ingredient in quantum
  simulators based on neutral atom arrays. It enables the emergence of a rich
  variety of quantum phases of matter, such as topological spin liquids. The
  typically isotropic nature of the blockade effect, however, restricts the
  range of natively accessible models and quantum states. In this work, we
  propose a method to systematically overcome this limitation, by developing
  gadgets, i.e., specific arrangements of atoms, that transform the underlying
  Rydberg blockade into more general constraints. We apply this technique to
  realize dimer models on square and triangular geometries. In these setups, we
  study the role of the quantum fluctuations induced by a coherent drive of the
  atoms and find signatures of $U(1)$ and $\mathbb{Z}_2$ quantum spin liquid
  states in the respective ground states. Finally, we show that these states can
  be dynamically prepared with high fidelity, paving the way for the quantum
  simulation of a broader class of constrained models and topological matter in
  experiments with Rydberg atom arrays.
