item_type: preprint
title: A Unified Local Light-shifts Encoding For Solving Optimization Problems
  on a Rydberg Annealer
authors:
  - first: Kapil
    last: Goswami
  - first: Peter
    last: Schmelcher
year: 2026
abstract: "Combinatorial optimization problems play a central role in computer
  science with many real world applications. A number of relevant problems
  remain computationally difficult to solve as they lie in the NP-hard
  complexity class. We present a unified framework for solving such optimization
  problems represented in the quadratic unconstrained binary optimization (QUBO)
  formalism, namely two-SAT, XOR-SAT, mixed-two-XOR-SAT, set packing, quadratic
  assignment, binary clustering, and protein folding, by expanding the domain of
  applications of \\textit{PRR, 6(2), 023031}. A direct mapping from the QUBO
  form of these problems onto the Rydberg quantum platform is demonstrated as
  our first step. This mapping to the Rydberg system depends on
  distance-dependent long-range interactions and configurable local detuning,
  thus reducing resource overhead and improving scalability. Following-up on the
  encoding, the solution is reached by steering the system toward the ground
  state of the target Hamiltonian using an optimized quantum annealing protocol
  that controls the time-dependent detuning and Rabi frequency profiles. The
  framework can handle a variety of problems, each with different complexity. To
  quantify the complexity of any problem, a generalized hardness parameter is
  introduced that compares different problems based on the structure of their
  optimization landscapes. This is a proceedings contribution to the Athens
  Workshop in Theoretical Physics: 10th Anniversary, held at the National and
  Kapodistrian University of Athens on December 17-19 2025."
