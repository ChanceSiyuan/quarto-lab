title: Industry applications of neutral-atom quantum computing solving
  independent set problems
authors:
  - first: Jonathan
    last: Wurtz
  - first: Pedro L. S.
    last: Lopes
  - first: Christoph
    last: Gorgulla
  - first: Nathan
    last: Gemelke
