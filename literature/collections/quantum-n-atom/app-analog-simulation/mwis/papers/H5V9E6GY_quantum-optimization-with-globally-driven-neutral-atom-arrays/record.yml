year: 2024
abstract: We propose a scalable encoding of combinatorial optimization problems
  with arbitrary connectivity, including higher-order terms, on arrays of
  trapped neutral atoms requiring only a global laser drive. Our approach relies
  on modular arrangements of a small number of problem-independent gadgets.
  These gadgets represent maximum-weight independent set (MWIS) problems on
  unit-disk graphs, which are native to such devices. Instead of programming
  MWIS weights with site-dependent laser detunings, the scheme relies on
  systematic placements of auxiliary atoms. We show, that these auxiliary atoms
  can be simultaneously used for both problem-specific programming and the
  mitigation of unwanted effects originating from the tails of long-range
  interactions.
