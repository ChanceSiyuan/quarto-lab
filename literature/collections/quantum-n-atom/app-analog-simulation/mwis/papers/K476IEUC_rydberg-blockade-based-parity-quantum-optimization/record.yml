year: 2023
abstract: We present a scalable architecture for solving higher-order
  constrained binary optimization problems on current neutral-atom hardware
  operating in the Rydberg blockade regime. In particular, we formulate the
  recently developed parity encoding of arbitrary connected higher-order
  optimization problems as a maximum-weight independent set (\textsf{MWIS})
  problem on disk graphs, that are directly encodable on such devices. Our
  architecture builds from small \textsf{MWIS} modules in a problem-independent
  way, crucial for practical scalability.
