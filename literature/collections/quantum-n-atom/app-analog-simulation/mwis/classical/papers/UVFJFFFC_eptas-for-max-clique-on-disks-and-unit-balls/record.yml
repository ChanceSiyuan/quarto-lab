year: 2018
abstract: We propose a polynomial-time algorithm which takes as input a ﬁnite
  set of points of R3 and computes, up to arbitrary precision, a maximum subset
  with diameter at most 1. More precisely, we give the ﬁrst randomized EPTAS and
  deterministic PTAS for MAXIMUM CLIQUE in unit ball graphs. Our approximation
  algorithm also works on disk graphs with arbitrary radii, in the plane.
