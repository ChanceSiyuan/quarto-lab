item_type: journalArticle
title: Prediction of Toric Code Topological Order from Rydberg Blockade
authors:
  - first: Ruben
    last: Verresen
  - first: Mikhail D.
    last: Lukin
  - first: Ashvin
    last: Vishwanath
year: 2021
abstract: The physical realization of $\mathbb Z_2$ topological order as
  encountered in the paradigmatic toric code has proven to be an elusive goal.
  We predict that this phase of matter can be realized in a two-dimensional
  array of Rydberg atoms placed on the ruby lattice, at specific values of the
  Rydberg blockade radius. First, we show that the blockade model -- also known
  as a `PXP' model -- realizes a monomer-dimer model on the kagome lattice with
  a single-site kinetic term. This can be interpreted as a $\mathbb Z_2$ gauge
  theory whose dynamics is generated by monomer fluctuations. We obtain its
  phase diagram using the numerical density matrix renormalization group method
  and find a topological quantum liquid (TQL) as evidenced by multiple measures
  including (i) a continuous transition between two featureless phases, (ii) a
  topological entanglement entropy of $\ln 2$ as measured in various geometries,
  (iii) degenerate topological ground states and (iv) the expected modular
  matrix from ground state overlap. Next, we show that the TQL persists upon
  including realistic, algebraically-decaying van der Waals interactions $V(r)
  \sim 1/r^6$ for a choice of lattice parameters. Moreover, we can directly
  access topological loop operators, including the Fredenhagen-Marcu order
  parameter. We show how these can be measured experimentally using a dynamic
  protocol, providing a ``smoking gun'' experimental signature of the TQL phase.
  Finally, we show how to trap an emergent anyon and realize different
  topological boundary conditions, and we discuss the implications for exploring
  fault-tolerant quantum memories.
