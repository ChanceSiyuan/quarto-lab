item_type: preprint
title: Quantum simulation of generic spin exchange models in Floquet-engineered
  Rydberg atom arrays
authors:
  - first: Naveen
    last: Nishad
  - first: Anna
    last: Keselman
  - first: Thierry
    last: Lahaye
  - first: Antoine
    last: Browaeys
  - first: Shai
    last: Tsesses
year: 2023
abstract: Although quantum simulation can give insight into elusive or
  intractable physical phenomena, many quantum simulators are unavoidably
  limited in the models they mimic. Such is also the case for atom arrays
  interacting via Rydberg states - a platform potentially capable of simulating
  any kind of spin exchange model, albeit with currently unattainable
  experimental capabilities. Here, we propose a new route towards simulating
  generic spin exchange Hamiltonians in atom arrays, using Floquet engineering
  with both global and local control. To demonstrate the versatility and
  applicability of our approach, we numerically investigate the generation of
  several spin exchange models which have yet to be realized in atom arrays,
  using only previously-demonstrated experimental capabilities. Our proposed
  scheme can be readily explored in many existing setups, providing a path to
  investigate a large class of exotic quantum spin models.
