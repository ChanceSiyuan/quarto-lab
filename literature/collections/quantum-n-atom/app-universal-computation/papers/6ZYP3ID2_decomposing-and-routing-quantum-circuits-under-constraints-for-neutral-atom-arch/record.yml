year: 2023
abstract: Quantum computing is in an era defined by rapidly evolving quantum
  hardware technologies, combined with persisting high gate error rates, large
  amounts of noise, and short coherence times. Overcoming these limitations
  requires systems-level approaches that account for the strengths and
  weaknesses of the underlying hardware technology. Yet few hardware-aware
  compiler techniques exist for neutral atom devices, with no prior work on
  compiling to the neutral atom native gate set. In particular, current neutral
  atom hardware does not support certain single-qubit rotations via local
  addressing, which often requires the circuit to be decomposed into a large
  number of gates, leading to long circuit durations and low overall fidelities.
