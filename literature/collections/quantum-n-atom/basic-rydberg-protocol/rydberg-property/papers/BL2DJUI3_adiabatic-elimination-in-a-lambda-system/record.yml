item_type: journalArticle
title: Adiabatic Elimination in a Lambda System
authors:
  - first: E.
    last: Brion
  - first: L. H.
    last: Pedersen
  - first: K.
    last: Molmer
year: 2007
abstract: "This paper deals with diﬀerent ways to extract the eﬀective
  two-dimensional lower level dynamics of a lambda system excited by oﬀ-resonant
  laser beams. We present a commonly used procedure for elimination of the upper
  level, and we show that it may lead to ambiguous results. To overcome this
  problem and better understand the applicability conditions of this scheme, we
  review two rigorous methods which allow us both to derive an unambiguous
  eﬀective two-level Hamiltonian of the system and to quantify the accuracy of
  the approximation achieved: the ﬁrst one relies on the exact solution of the
  Schro¨dinger equation, while the second one resorts to the Green’s function
  formalism and the Feshbach projection operator technique."
