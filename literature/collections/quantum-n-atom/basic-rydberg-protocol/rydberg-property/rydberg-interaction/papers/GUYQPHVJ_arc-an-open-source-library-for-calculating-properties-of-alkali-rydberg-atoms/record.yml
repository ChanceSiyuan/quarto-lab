item_type: journalArticle
title: "ARC: An open-source library for calculating properties of alkali Rydberg
  atoms"
authors:
  - first: N.
    last: Šibalić
  - first: J. D.
    last: Pritchard
  - first: C. S.
    last: Adams
  - first: K. J.
    last: Weatherill
year: 2017
abstract: We present an object-oriented Python library for computation of
  properties of highly-excited Rydberg states of alkali atoms. These include
  single-body eﬀects such as dipole matrix elements, excited-state lifetimes
  (radiative and black-body limited) and Stark maps of atoms in external
  electric ﬁelds, as well as two-atom interaction potentials accounting for
  dipole and quadrupole coupling eﬀects valid at both long and short range for
  arbitrary placement of the atomic dipoles. The package is cross-referenced to
  precise measurements of atomic energy levels and features extensive
  documentation to facilitate rapid upgrade or expansion by users. This library
  has direct application in the ﬁeld of quantum information and quantum optics
  which exploit the strong Rydberg dipolar interactions for two-qubit gates,
  robust atom-light interfaces and simulating quantum many-body physics, as well
  as the ﬁeld of metrology using Rydberg atoms as precise microwave
  electrometers.
