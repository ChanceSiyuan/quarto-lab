item_type: journalArticle
title: Time-Optimal Two- and Three-Qubit Gates for Rydberg Atoms
authors:
  - first: Sven
    last: Jandura
  - first: Guido
    last: Pupillo
year: 2022
abstract: We identify time-optimal laser pulses to implement the controlled-Z
  gate and its three qubit generalization, the C$_2$Z gate, for Rydberg atoms in
  the blockade regime. Pulses are optimized using a combination of numerical and
  semi-analytical quantum optimal control techniques that result in smooth
  Ans\"atze with just a few variational parameters. For the CZ gate, the
  time-optimal implementation corresponds to a global laser pulse that does not
  require single site addressability of the atoms, simplifying experimental
  implementation of the gate. We employ quantum optimal control techniques to
  mitigate errors arising due to the finite lifetime of Rydberg states and
  finite blockade strengths, while several other types of errors affecting the
  gates are directly mitigated by the short gate duration. For the considered
  error sources, we achieve theoretical gate fidelities compatible with error
  correction using reasonable experimental parameters for CZ and C$_2$Z gates.
