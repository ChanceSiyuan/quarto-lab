year: 2019
abstract: We present a new open-source Python package, krotov, implementing the
  quantum optimal control method of that name. It allows to determine
  time-dependent external ﬁelds for a wide range of quantum control problems,
  including state-to-state transfer, quantum gate implementation and
  optimization towards an arbitrary perfect entangler. Krotov’s method compares
  to other gradient-based optimization methods such as gradientascent and
  guarantees monotonic convergence for approximately time-continuous control
  ﬁelds. The user-friendly interface allows for combination with other Python
  packages, and thus high-level customization.
