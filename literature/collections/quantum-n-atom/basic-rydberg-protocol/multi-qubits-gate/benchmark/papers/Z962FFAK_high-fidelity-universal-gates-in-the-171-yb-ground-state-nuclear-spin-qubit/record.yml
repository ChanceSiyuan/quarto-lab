year: 2025
abstract: >-
  Arrays of optically trapped neutral atoms are a promising architecture for the
  realization of quantum computers. In order to run increasingly complex
  algorithms, it is advantageous to demonstrate high-fidelity and flexible gates
  between long-lived and highly coherent qubit states. In this work, we
  demonstrate a universal high-fidelity gate set with individually controlled
  and parallel application of single-qubit gates and two-qubit gates operating
  on the ground-state nuclear-spin qubit in arrays of tweezer-trapped
                
                  
                    
                    171
                  
                
                
                  Yb
                
                atoms. We utilize the long lifetime, flexible control, and high gate fidelity of our system to characterize native gates using single- and two-qubit Clifford and symmetric subspace randomized-benchmarking circuits with more than 200 controlled-
                
                  Z
                
                () gates applied to one or two pairs of atoms. We measure our two-qubit entangling gate fidelity to be 99.72(3)% (99.40(3)%) with (without) postselection. In addition, we introduce a simple and optimized method for calibration of multiparameter quantum gates. These results represent important milestones toward executing complex and general quantum computation with neutral atoms.
