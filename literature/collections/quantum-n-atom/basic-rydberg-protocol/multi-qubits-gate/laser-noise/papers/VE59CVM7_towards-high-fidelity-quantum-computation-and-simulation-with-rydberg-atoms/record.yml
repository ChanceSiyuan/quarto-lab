title: Towards High Fidelity Quantum Computation and Simulation with Rydberg Atoms
authors:
  - first: Anant
    last: Kale
year: null
abstract: Individually trapped neutral atoms are a promising candidate for use
  in quantum computing and simulation applications. They are highly scalable,
  have long coherence times and can be entangled via strong dipole-dipole
  interactions by driving to highly excited Rydberg states. However, the ﬁdelity
  of single atom operations as well as two-atom entangling operations is limited
  by intrinsic sources of decoherence such as atomic motion, as well as
  technical sources of noise such as laser intensity ﬂuctuations and
  phase/frequency ﬂuctuations. We study the eﬀect of these factors on single
  atom Rabi oscillations and two-atom Rydberg blockaded Rabi oscillations, using
  perturbation theory and numerical simulation. We develop a window function
  approach which helps us qualitatively understand the signiﬁcance of the
  diﬀerent spectral components of the noise as well as quantitatively understand
  the dependence of the Rabi oscillation ﬁdelity on Rabi frequency. This allows
  us to predict the maximum experimentally achievable ﬁdelities using
  independent measurements of experimental parameters such as noise spectra and
  atomic temperature. Turning to the question of near-term scalability of the
  experimental system, we prototype and test a method of generating a ’ladder’
  conﬁguration of optical tweezers utilizing two independent lasers. Our setup
  allows us to fully tune the geometry of the ladder, namely the separation
  between the two rows, the angle between them, and their relative position
  along the axis of the ladder. This pseudo-2D conﬁguration enables us to reach
  larger system sizes in the near future and allows us to access beyond 1D
  physics.
