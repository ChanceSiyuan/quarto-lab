item_type: preprint
title: Three-body interactions in Rydberg lattices
authors:
  - first: Rhine
    last: Samajdar
  - first: Mikhail D.
    last: Lukin
  - first: Valentin
    last: Walther
year: 2026
abstract: "Programmable arrays of neutral Rydberg atoms are one of the leading
  platforms today for scalable quantum simulation and computation. In these
  systems, the dipole-dipole interactions between the individual atoms, or
  qubits, typically result in binary -- i.e., two-body -- couplings. In this
  work, we develop an experimentally accessible scheme for engineering
  three-body interactions in Rydberg lattices. Such strong three-body couplings
  can fundamentally modify the underlying physics compared to systems with only
  two-body interactions: we demonstrate this, in particular, by systematically
  investigating the effective many-body Hamiltonian and its emergent quantum
  phases. This capability paves the way for the quantum simulation of a broader
  class of correlated models of condensed matter and high-energy physics."
