title: Multibit C k NOT quantum gates via Rydberg blockade
authors:
  - first: L.
    last: Isenhower
  - first: M.
    last: Saffman
  - first: K.
    last: Mølmer
year: 2011
abstract: Long range Rydberg blockade interactions have the potential for
  efﬁcient implementation of quantum gates between multiple atoms. Here we
  present and analyze a protocol for implementation of a k-atom controlled NOT
  (CkNOT) neutral atom gate. This gate can be implemented using sequential or
  simultaneous addressing of the control atoms which requires only 2k + 3 or 5
  Rydberg π pulses respectively. A detailed error analysis relevant for
  implementations based on alkali atom Rydberg states is provided which shows
  that gate errors less than 10% are possible for k = 35.
