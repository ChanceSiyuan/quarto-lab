year: 2024
abstract: Assembling increasingly larger-scale defect-free optical
  tweezer-trapped atom arrays is essential for quantum computation and quantum
  simulations based on atoms. Here, we propose an AI-enabled, rapid,
  constant-time-overhead rearrangement protocol, and we experimentally assemble
  defect-free 2D and 3D atom arrays with up to 2024 atoms with a constant time
  cost of 60 ms. The AI model calculates the holograms for real-time atom
  rearrangement. With precise controls over both position and phase, a
  high-speed spatial light modulator moves all the atoms simultaneously. This
  protocol can be readily used to generate defect-free arrays of tens of
  thousands of atoms with current technologies, and become a useful toolbox for
  quantum error correction.
