abstract: Principles of laser cooling and trapping of atoms with regard to the
  magneto-optical trap (MOT) are described. Some details of the MOT and the
  accompanying measuring system, both constructed at the Institute of Physics,
  PAS in Warsaw, are given. Two examples of experimental results are shown.
