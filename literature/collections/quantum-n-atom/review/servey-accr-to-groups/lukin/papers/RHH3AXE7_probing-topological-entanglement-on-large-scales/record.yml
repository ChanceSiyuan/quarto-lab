year: 2024
abstract: Topologically ordered quantum matter exhibits intriguing long-range
  patterns of entanglement, which reveal themselves in subsystem entropies.
  However, measuring such entropies, which can be used to certify topological
  order, on large partitions is challenging and becomes practically unfeasible
  for large systems. We propose a protocol based on local adiabatic deformations
  of the Hamiltonian which extracts the universal features of long-range
  topological entanglement from measurements on small subsystems of finite size,
  trading an exponential number of measurements against a polynomial-time
  evolution. Our protocol is general and readily applicable to various quantum
  simulation architectures. We apply our method to various string-net models
  representing both abelian and non-abelian topologically ordered phases, and
  illustrate its application to neutral atom tweezer arrays with numerical
  simulations.
