title: Quantum simulation and computation with two-dimensional arrays of neutral atoms
authors:
  - name: Ebadi
year: null
abstract: Programmable quantum systems provide insights into many-body quantum
  phenomena and enable new methods for computation and metrology. The frontier
  challenge for these systems is scaling up in the number of quantum particles
  while retaining a high degree of quantum control. In recent years arrays of
  neutral atoms have emerged as a scalable and powerful platform for tackling
  these challenges, thanks to their large number of qubits, flexible geometry,
  and a well-established toolbox for preparation, detection, coherent control.
  At the forefront of quantum science and engineering, these systems have been
  used for quantum simulation of various spin models and have also demonstrated
  building blocks of quantum computation. In this thesis I will present advances
  in development of large two-dimensional atom arrays, where hundreds of
  individual atoms are trapped, rearranged, and initialized in various
  defect-free arrangements in one or two dimensions. Afterwards, interactions
  between atoms is controlled via coherent excitation to highly excited Rydberg
  states, resulting in strong long-range van der Waals forces. We utilize these
  interaction for quantum simulation of many-body spin Hamiltonians by
  demonstrating preparation of several exotic phases of matter, study phase
  transitions, and probe non-equilibrium dynamics. Further, we study the quantum
  speedup in solving a hard combinatorial optimization problem via efficiently
  mapping the problem onto the Rydberg atom array. We also utilize Rydberg
  interactions to demonstrate high-fidelity two-qubit gate operations in a
  reconfigurable atom array architecture. Lastly I will demonstrate recent
  technical improvements that have enabled larger system sizes, higher fidelity
  rydberg excitations, and local control of individual atoms, paving the way for
  novel approaches for studying quantum many-body phenomena.
