title: 中性原子高保真度两比特纠缠
authors:
  - name: 付卓
year: null
abstract: 近些年来,量子计算领域涌现出许多重要的研究成果,多种量子处理器的性能不断刷新记录,量子编程和量子线路逐渐向应用发展,“量子优越性”已得到演示,这些都意味着量子计算领域正处在全面发展的时期。其中中性原子体系是极具潜力的量子计算机候选者,因其具有以下几点优势:一、量子比特能够规模化地扩展为二维或三维任意构型的阵列;二、量子比特间的里德堡强相互作用可进行灵活的调节和开关;三、量子比特编码在中性原子基态钟跃迁能级,对外部环境噪声不敏感,具备较长的相干时间。未来要实现通用的量子计算,必须使两比特门操控的保真度达到0.99以上。而目前只有超导线路体系、囚禁离子体系和金刚石中氮-空位体系达到了该指标,因此本文的主要研究目的是提高中性原子体系两比特门操控的保真度。我们首先分析和测量了一般两比特受控位相门方案中的脉冲过程,得出结论两比特门操控的保真度受限于控制比特基态到里德堡态的相干性。然后结合理论方面的进展,本文提出了单个非共振调制脉冲实现受控位相门的新方案,并且基于新的受控位相门方案实现了两原子高保真纠缠,修正误差后纠缠保真度达到0.980(7),是目前中性原子体系通过两比特门操控实现两原子纠缠的最高保真度。本文的主要研究成果和内容包括:1.搭建中性原子里德堡激发平台,实现基态原子的相干操控和里德堡态相干激发过程我们设计并搭建一体化可移动磁光阱系统,以偶极阱位置为参考移动MOT,避免移动强聚焦透镜,以此提高光路指向稳定性。经过优化态制备过程,我们利用微波实现了高保真度基态相干操控,基态拉比振荡条纹对比度达到0.99,并且构建了魔幻强度光阱,使原子基态相干时间延长到300
  ms左右。我们搭建完成了里德堡激发光超腔过滤后注入锁定再放大的光路,并对激发条件进行优化后实现了里德堡相干激发,激发效率达到98.5%,基态到里德堡态相干时间约为10
  μs,里德堡拉比振荡条纹退相时间长达60μs。并进一步利用集体激发实现了两原子和三原子纠缠。2.利用单个非共振调制脉冲受控位相门实现高保真度两比特纠缠我们经过分析和测试发现了π-gap-π受控位相门方案的限制因素,然后提出了基于里德堡集体激发的单个非共振调制脉冲实现两比特受控位相门的新方案。该方案本质上是通过集体激发时不同初态位相演化的速度差异达到受控位相门的约束条件,演化过程中原子不会布居到里德堡态,避免了里德堡态退相的影响。通过对调制脉冲的优化和激发条件的控制,我们成功实现了基于单个非共振调制脉冲的受控位相门,并进一步实现了保真度为0.980(7)的两原子纠缠。3.构建魔幻强度光阱并实现保真度为0.99的原子相干转移,提出阵列中远距离两原子纠缠方案和多个原子GHZ态的制备方案我们通过构建魔幻强度光阱,使原子感受到偶极光引起的差分光位移对阱深的一阶偏导为零,极大地抑制了差分光位移引起的非均匀退相,原子基态的相干时间由原来的10
  ms提高到现在的300
  ms左右。在魔幻光强条件下,我们利用声光偏转器实现了原子的相干转移,转移过程的保真度达到0.99。结合前面的高保真度两比特门操控方案,我们提出了阵列中远距离两个原子纠缠的方案,并基于纠缠后的相干转移提出了多个原子GHZ态制备方案。该方案并不需要所有原子处在里德堡阻塞区域内,以一个原子为基础实现多个原子的纠缠和互联,可极大提高阵列中量子比特的连接性。
