item_type: thesis
title: Quantum Information Processing and Quantum Simulation with Programmable
  Rydberg Atom Arrays
authors:
  - first: Jay Levine
    last: Harry
year: null
abstract: A frontier challenge in quantum science and technology is the
  construction of scalable quantum systems which can operate in regimes beyond
  classical simulatability. Such systems can be used as tools for simulating and
  exploring complex phenomena in quantum physics; they can also be used to
  benchmark and test quantum algorithms. Several experimental platforms, based
  on a variety of quantum mechanical building blocks, are currently being
  pursued with these goals in mind, with state-of-the-art systems capable of
  controlling up to around fifty particles. In this thesis, we present the
  development of a new platform based on individually controlled neutral atoms.
  In this approach, hundreds of individual atoms are trapped in an array of
  optical tweezers, and they are sorted in real-time into programmable
  geometries in one and two dimensions. After initialization of an array, atom
  interactions are switched on by coherent excitation to highly excited Rydberg
  states, resulting in a rich spin Hamiltonian. We experimentally advance
  several key aspects of this platform, developing new tools for controlling
  strongly interacting atom arrays and probing novel quantum phases and
  non-equilibrium dynamics. We additionally utilize Rydberg interactions to
  entangle atoms, demonstrating high fidelity universal quantum logic gates as
  well as the preparation of fully entangled Schrödinger cat states. This work
  highlights the prospects for scalable quantum simulation and quantum
  information processing beyond the limit of classical computation using neutral
  atom arrays.
