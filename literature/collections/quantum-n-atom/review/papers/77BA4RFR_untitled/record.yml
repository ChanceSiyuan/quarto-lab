title: 微型光阱阵列中异核原子量子比特相干性研究
authors:
  - name: 郭瑞军
  - name: 詹明生
year: null
abstract: 紧密排列的微型光学偶极阱阵列中的中性原子体现出了极好的扩展性,因此在量子模拟和量子计算中有广阔的应用前景。最近,研究者已经证实了无缺陷的原子阵列,可以确定地将50个量子比特存储在一维、两维空间,或者将更多的量子比特存储在相对紧凑的三维空间中。51个原子的量子模拟器也已经被演示。当中性原子量子比特的数量扩展以后,不完全隔离的逻辑操作和单个量子比特的初始化和状态读出,会导致串扰问题。将相同种类的量子比特扩展到混合种类的量子比特(一个用于数据量子比特,另一个用于辅助量子比特)是在初始化、逻辑和测量操作期间避免串扰问题的有效方法之一。然而,迄今为止混合种类量子比特叠加态的相干时间极不平衡,使得辅助量子比特叠加态的强退相干成为了混合量子比特逻辑门测量误差的主要来源。本学位论文构造了一个偏振协调的异核体系魔幻光强偶极阱阵列,有效地消除了光频移导致的异核原子量子比特叠加态的退相干,使阵列中异核原子量子比特叠加态的相干时间均提升到约1
  s。论文取得的创新性研究工作包括以下三个方面:1.将铷-87原子量子比特在魔幻光强偶极阱中的相干时间提升到1
  s。磁场噪声引入的均匀退相干因素限制了铷-87原子量子比特...更多
