title: 用于中性原子量子计算的单量子比特操控
authors:
  - name: 尉石
year: null
abstract: 我们详细研究了用于中性原子量子计算的单量子比特操控.实现量子计算的基本要素包括：可扩展量子寄存器的制备和读取,单量子比特操作,多量子比特操作.基于“碰撞阻塞”效应,可以在微型光学偶极阱中囚禁单原子.为了实现量子寄存器的初始化,我们在环形光晶格中制备单原子阵列.对于碱金属原子,量子比特被编码在基态超精细结构能级上.我们采用双光子受激Raman跃迁,进行单原子内态的各种操控.本论文中,主要的创新点和结果展示如下：1、我们采用Carr-Purcell-Meiboom-Gill(CPMG)脉冲时序有效抑制单原子量子比特的退相干.CPMG时序被视为是多组spin
  echo脉冲的叠加,已经应用于多种体系,可以有效改善量子比特的相干性.我们将这种技术扩展到单原子体系中,通过采用π脉冲个数n=6的CPMG时序,均匀退相干时间比采用spin
  echo脉冲时延长了3倍.2、利用辅助的可移动的光阱,我们在光晶格中转移单原子量子比特,并详细研究了转移过程对量子比特保真度的影响.如果辅助光阱的势深较大,将其从静止阱上掠过时,囚禁的单原子会跟随着移动阱一起运动,实现转移.原子的转移效率可以达到95%.因为不会影响光晶格中其他位置囚禁的原子,这种方案适用于可扩展的量子寄存器.在单原子转移过程中,本征态的保真度保持不变,为F=0.94.叠加态的保真度会受到影响,在T=20
  ms时测量,未进行转移时保真度为F=0.74,经过转移后减小到F=0.66.研究表明,单原子转移过程中叠加态保真度的损失,主要来自于该过程引起的加热效应和偶极阱激光的指向涨落.与单离子转移相比较,单原子转移的研究存在着很多共性的需求和挑战,进一步可以将我们的转移过程与其他手段相结合.3、我们研究了自由空间和偶极阱中单原子物质波干涉.采用一系列对射Raman光脉冲,可以实现冷原子干涉仪,在精密测量领域有着广泛的应用.我们实现了自由空间中的单原子Mach-Zehnder型干涉仪,并测量了单原子物质波相干长度.同时在偶极阱中,观察到干涉条纹对比度随着测量时间的延长而迅速衰减,这正是由于原子在阱中做简谐运动造成的.由此,我们提出了偶极阱中包含两脉冲的单原子干涉仪方案.4、我们优化激光冷却时序,将囚禁在双色阱中的单原子冷却到Lamb-Dicke区.为了在红失谐光学偶极阱中实现强囚禁,一束蓝失谐的中空光束与之叠加.优化偏振梯度冷却后,采用释放再抓捕的方法测量单原子温度.通过计算得到,阱中单原子满足Lamb-Dicke条件,有助于进一步采用Raman边带冷却制备单原子到简谐运动基态.5、我们采用压缩感知技术初步提高了单原子阵列荧光成像的分辨率.当信号满足特定的稀疏条件时,压缩感知提供了一种恢复重建信号的求解算法.实验中,我们收集单原子荧光,成像到电子倍增相机上,对整个单原子阵列进行实时监测和控制.应用压缩感知技术处理后,初步提高了两个单原子成像的分辨率.总之,我们在可扩展的量子寄存器中展示了单原子量子比特的各种操控.这些工作为采用中性原子进行量子计算提供了基础.
