abstract: Quantum information processing based on Rydberg atoms emerged as a
  promising direction two decades ago. Recent experimental and theoretical
  progresses have shined exciting light on this avenue. In this concise review,
  we will brieﬂy introduce the basics of Rydberg atoms and their recent
  applications in associated areas of neutral atom quantum computation and
  simulation. We shall also include related discussions on quantum optics with
  Rydberg atomic ensembles, which are increasingly used to explore quantum
  computation and quantum simulation with photons.
