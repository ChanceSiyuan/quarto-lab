title: Entangling, controlling, and detecting individual strontium atoms in
  optical tweezer arrays
authors:
  - first: Ivaylo Sashkov
    last: Madjarov
year: null
abstract: "We present a novel experimental platform for quantum and precision
  science: single strontium atoms trapped in arrays of optical tweezers. We
  demonstrate development of this platform along three important fronts:
  single-atom trapping, imaging, and cooling; coherent control of the
  ultra-narrow clock transition; and inter-atom entanglement via Rydberg
  interactions."
