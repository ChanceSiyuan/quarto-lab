year: 2024
abstract: Optical tweezer arrays have had a transformative impact on atomic and
  molecular physics over the past years, and they now form the backbone for a
  wide range of leading experiments in quantum computing, simulation, and
  metrology. Underlying this development is the simplicity of single particle
  control and detection inherent to the technique. Typical experiments trap tens
  to hundreds of atomic qubits, and very recently systems with around one
  thousand atoms were realized without defining qubits or demonstrating coherent
  control. However, scaling to thousands of atomic qubits with long coherence
  times and low-loss, high-fidelity imaging is an outstanding challenge and
  critical for progress in quantum computing, simulation, and metrology, in
  particular, towards applications with quantum error correction. Here, we
  experimentally realize an array of optical tweezers trapping over 6,100
  neutral atoms in around 12,000 sites while simultaneously surpassing
  state-of-the-art performance for several key metrics associated with
  fundamental limitations of the platform. Specifically, while scaling to such a
  large number of atoms, we also demonstrate a coherence time of 12.6(1)
  seconds, a record for hyperfine qubits in an optical tweezer array. Further,
  we show trapping lifetimes close to 23 minutes in a room-temperature
  apparatus, enabling record-high imaging survival of 99.98952(1)% in
  combination with an imaging fidelity of over 99.99%. Our results, together
  with other recent developments, indicate that universal quantum computing with
  ten thousand atomic qubits could be a near-term prospect. Furthermore, our
  work could pave the way for quantum simulation and metrology experiments with
  inherent single particle readout and positioning capabilities at a similar
  scale.
