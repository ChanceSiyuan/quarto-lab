title: Manipulating Single Atoms
authors:
  - first: Dieter
    last: Meschede
  - first: Arno
    last: Rauschenbeutel
year: 2006
abstract: Neutral atoms are interesting candidates for experimentally
  investigating the transition from well-understood quantum objects to many
  particle and macroscopic physics. Furthermore, the ability to control neutral
  atoms at the single atom level opens new routes to applications such as
  quantum information processing and metrology. We summarize experimental
  methods and ﬁndings in the preparation, detection, and manipulation of trapped
  individual neutral atoms. The high efﬁciency and the observed long coherence
  times of the presented methods are favorable for future applications in
  quantum information processing.
