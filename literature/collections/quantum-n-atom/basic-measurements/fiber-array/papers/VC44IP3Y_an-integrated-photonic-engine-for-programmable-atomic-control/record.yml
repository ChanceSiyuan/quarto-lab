year: 2022
abstract: Solutions for scalable, high-performance optical control are important
  for the development of scaled atom-based quantum technologies. Modulation of
  many individual optical beams is central to the application of arbitrary gate
  and control sequences on arrays of atoms or atom-like systems. At telecom
  wavelengths, miniaturization of optical components via photonic integration
  has pushed the scale and performance of classical and quantum optics far
  beyond the limitations of bulk devices [1–3]. However, these material
  platforms for high-speed telecom integrated photonics [4, 5] are not
  transparent at the short wavelengths required by leading atomic systems [6–8].
  Here, we propose and implement a scalable and reconﬁgurable photonic
  architecture for multi-channel quantum control using integrated, visible-light
  modulators based on thin-ﬁlm lithium niobate [9, 10]. Our approach combines
  techniques in free-space optics, holography, and control theory together with
  a sixteenchannel integrated photonic device to stabilize temporal and
  cross-channel power deviations and enable precise and uniform control.
  Applying this device to a homogeneous constellation of siliconvacancy
  artiﬁcial atoms in diamond, we present techniques to spatially and spectrally
  address a dynamically-selectable set of these stochastically-positioned point
  emitters. We anticipate that this scalable and reconﬁgurable optical
  architecture will lead to systems that could enable parallel individual
  programmability of large many-body atomic systems, which is a critical step
  towards universal quantum computation on such hardware.
