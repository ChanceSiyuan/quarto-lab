abstract: Monolithic integration of control technologies for atomic systems is a
  promising route to the development of quantum computers and portable quantum
  sensors [1–4]. Trapped atomic ions form the basis of high-ﬁdelity quantum
  information processors [5, 6] and high-accuracy optical clocks [7]. However,
  current implementations rely on free-space optics for ion control, which
  limits their portability and scalability. Here we demonstrate a
  surface-electrode ion-trap chip [8, 9] using integrated waveguides and grating
  couplers, which delivers all the wavelengths of light required for ionization,
  cooling, coherent operations, and quantum-state preparation and detection of
  Sr+ qubits. Laser light from violet to infrared is coupled onto the chip via
  an optical-ﬁber array, creating an inherently stable optical path, which we
  use to demonstrate qubit coherence that is resilient to platform vibrations.
  This demonstration of CMOS-compatible integrated-photonic surface-trap
  fabrication, robust packaging, and enhanced qubit coherence is a key advance
  in the development of portable trapped-ion quantum sensors and clocks,
  providing a way toward the complete, individual control of larger numbers of
  ions in quantum information processing systems.
