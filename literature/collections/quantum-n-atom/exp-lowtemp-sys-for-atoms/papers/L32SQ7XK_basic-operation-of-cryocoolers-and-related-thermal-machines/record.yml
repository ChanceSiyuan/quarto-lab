item_type: journalArticle
title: Basic Operation of Cryocoolers and Related Thermal Machines
authors:
  - first: A. T. A. M.
    last: De Waele
year: 2011
abstract: "This paper deals with the basics of cryocoolers and related
  thermodynamic systems. The treatment is based on the ﬁrst and second law of
  thermodynamics for inhomogeneous, open systems using enthalpy ﬂow, entropy
  ﬂow, and entropy production. Various types of machines, which use an
  oscillating gas ﬂow, are discussed such as: Stirling refrigerators, GM
  coolers, pulse-tube refrigerators, and thermoacoustic coolers and engines.
  Furthermore the paper deals with Joule-Thomson and dilution refrigerators
  which use a constant ﬂow of the working medium."
