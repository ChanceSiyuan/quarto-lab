item_type: preprint
title: The composition rule for quantum systems is not the only possible one
authors:
  - first: Marco
    last: Erba
  - first: Paolo
    last: Perinotti
year: 2024
abstract: "Quantum theory provides a significant example of two intermingling
  hallmarks of science: the ability to consistently combine physical systems and
  study them compositely; and the power to extract predictions in the form of
  correlations. A striking consequence of this facet is the violation of
  $\\textit{local realism}$, which has been experimentally demonstrated via
  so-called $\\textit{Bell tests}$. The prediction of this phenomenon originates
  as quantum systems are prescribed to combine according to the
  $\\textit{composition postulate}$, i.e. the tensor-product rule. This rule has
  also an operationally sound formulation -- rather than just a purely
  mathematical one -- given in terms of discriminability of states via local
  measurements. Yet, both the theoretical and the empirical status of such
  postulate has been constantly challenged over the decades: is it possible to
  deduce it from the remaining postulates? Here, we solve this long-standing
  problem by answering in the negative. We formulate a family of operational
  theories that are solely distinguished from quantum theory by their
  system-composition rule, while, at the same time, they cannot be told apart by
  Bell-like experiments. Quantum theory is thus established to genuinely embody
  more content than quantum correlations. As a result, foundational programs
  only based on single-system principles, or on bare correlations, are
  operationally incomplete. On the experimental side, ascertaining the
  independence of postulates is a fundamental step to adjudicate between quantum
  theory and alternative physical theories: hence, the composition postulate
  deserves to be experimentally scrutinised independently of the other features
  of quantum theory."
