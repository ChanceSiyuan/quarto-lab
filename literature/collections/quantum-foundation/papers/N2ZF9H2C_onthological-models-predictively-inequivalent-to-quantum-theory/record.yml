item_type: journalArticle
title: Onthological models predictively inequivalent to quantum theory
authors:
  - first: GianCarlo
    last: Ghirardi
  - first: Raffaele
    last: Romano
year: 2013
abstract: Recently, it has been argued that no extension of quantum theory can
  have improved predictive power under a strong assumption of free choice of the
  experimental settings and validity of quantum mechanics. Here, under a
  different free choice assumption, we describe a model which violates this
  statement for almost all states of a bipartite two-level system, in a possibly
  experimentally testable way. From consistency with quantum mechanics and the
  nonsignaling principle, we derive a bound on the local averages for the family
  of deterministic ontological theories that our model belongs to.
