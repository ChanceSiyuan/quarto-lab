item_type: preprint
title: Scalable Ground-State Certification of Quantum Spin Systems via
  Structured Noncommutative Polynomial Optimization
authors:
  - first: Jie
    last: Wang
  - first: David
    last: Jansen
  - first: Irénée
    last: Frerot
  - first: Marc-Olivier
