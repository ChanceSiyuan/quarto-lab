item_type: journalArticle
title: The Complexity of Approximating complex-valued Ising and Tutte partition
  functions
authors:
  - first: Leslie Ann
    last: Goldberg
  - first: Heng
    last: Guo
year: 2017
abstract: We study the complexity of approximately evaluating the Ising and
  Tutte partition functions with complex parameters. Our results are partly
  motivated by the study of the quantum complexity classes BQP and IQP. Recent
  results show how to encode quantum computations as evaluations of classical
  partition functions. These results rely on interesting and deep results about
  quantum computation in order to obtain hardness results about the diﬃculty of
  (classically) evaluating the partition functions for certain ﬁxed parameters.
