item_type: journalArticle
title: Quantum Commuting Circuits and Complexity of Ising Partition Functions
authors:
  - first: Keisuke
    last: Fujii
  - first: Tomoyuki
    last: Morimae
year: 2017
abstract: "Instantaneous quantum polynomial-time (IQP) computation is a class of
  quantum computation consisting only of commuting two-qubit gates and is not
  universal. Nevertheless, it has been shown that if there is a classical
  algorithm that can simulate IQP eﬃciently, the polynomial hierarchy (PH)
  collapses to the third level, which is highly implausible. However, the origin
  of the classical intractability is still less understood. Here we establish a
  relationship between IQP and computational complexity of calculating the
  partition functions of Ising models. We apply the established relationship in
  two opposite directions. One direction is to ﬁnd subclasses of IQP that are
  classically eﬃciently simulatable by using exact solvability of certain types
  of Ising models. Another direction is applying quantum computational
  complexity of IQP to investigate (im)possibility of eﬃcient classical
  approximations of Ising partition functions with imaginary coupling constants.
  Speciﬁcally, we show that a multiplicative approximation of Ising partition
  functions is #P-hard for almost all imaginary coupling constants even on
  planar lattices of a bounded degree."
