item_type: preprint
title: Leveraging Secondary Storage to Simulate Deep 54-qubit Sycamore Circuits
authors:
  - first: Edwin
    last: Pednault
  - first: John A.
    last: Gunnels
  - first: Giacomo
    last: Nannicini
  - first: Lior
    last: Horesh
  - first: Robert
    last: Wisnieff
year: 2019
abstract: In a recent paper, we showed that secondary storage can extend the
  range of quantum circuits that can be practically simulated with classical
  algorithms. Here we refine those techniques and apply them to the simulation
  of Sycamore circuits with 53 and 54 qubits, with the entanglement pattern
  ABCDCDAB that has proven difficult to classically simulate with other
  approaches. Our analysis shows that on the Summit supercomputer at Oak Ridge
  National Laboratories, such circuits can be simulated with high fidelity to
  arbitrary depth in a matter of days, outputting all the amplitudes.
