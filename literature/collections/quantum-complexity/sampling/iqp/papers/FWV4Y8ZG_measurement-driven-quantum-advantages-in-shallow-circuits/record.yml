title: Measurement-driven quantum advantages in shallow circuits
authors:
  - first: Chenfeng
    last: Cao
  - first: Jens
    last: Eisert
year: 2025
abstract: Quantum advantage schemes probe the boundary between classically
  simulatable quantum systems and those that computationally go beyond this
  realm. Here, we introduce a constant-depth measurement-driven approach for
  efficiently sampling from a broad class of dense instantaneous quantum
  polynomial-time circuits and associated Hamiltonian phase states, previously
  requiring polynomial-depth unitary circuits. Leveraging measurement-adaptive
  fan-out staircases, our "dynamical circuits" circumvent light-cone
  constraints, enabling global entanglement with flexible auxiliary qubit usage
  on bounded-degree lattices. Generated Hamiltonian phase states exhibit
  statistical metrics indistinguishable from those of fully random
  architectures. Additionally, we demonstrate measurement-driven globally
  entangled feature maps capable of distinguishing phases of an extended SSH
  model from random eigenstates using a quantum reservoir-computing benchmark.
  Technologically, our results harness the power of mid-circuit measurements for
  realizing quantum advantages on hardware with a favorable topology.
  Conceptually, we highlight their power in achieving rigorous computational
  speedups.
