item_type: preprint
title: "IQP Sampling and Verifiable Quantum Advantage: Stabilizer Scheme and
  Classical Security"
authors:
  - first: Michael J.
    last: Bremner
  - first: Bin
    last: Cheng
  - first: Zhengfeng
    last: Ji
year: 2023
abstract: Sampling problems demonstrating beyond classical computing power with
  noisy intermediate scale quantum (NISQ) devices have been experimentally
  realized. In those realizations, however, our trust that the quantum devices
  faithfully solve the claimed sampling problems is usually limited to
  simulations of smaller-scale instances and is, therefore, indirect. The
  problem of verifiable quantum advantage aims to resolve this critical issue
  and provides us with greater confidence in a claimed advantage. Instantaneous
  quantum polynomial-time (IQP) sampling has been proposed to achieve beyond
  classical capabilities with a verifiable scheme based on quadratic-residue
  codes (QRC). Unfortunately, this verification scheme was recently broken by an
  attack proposed by Kahanamoku-Meyer.
