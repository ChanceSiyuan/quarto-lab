year: 2020
abstract: >-
  Abstract
              
                As research on building scalable quantum computers advances, it is important to be able to certify their correctness. Due to the exponential hardness of classically simulating quantum computation, straight-forward verification through classical simulation fails. However, we
                can
                classically simulate small scale quantum computations and hence we
                are
                able to test that devices behave as expected in this domain. This constitutes the first step towards obtaining confidence in the anticipated quantum-advantage when we extend to scales that can no longer be simulated. Realistic devices have restrictions due to their architecture and limitations due to physical imperfections and noise. Here we extend the usual ideal simulations by considering those effects. We provide a general methodology for constructing realistic simulations emulating the physical system which will both provide a benchmark for realistic devices, and guide experimental research in the quest for quantum-advantage. We exemplify our methodology by simulating a networked architecture and corresponding noise-model; in particular that of the device developed in the Networked Quantum Information Technologies Hub (NQIT) (Networked Quantum Information Technologies Hub 2018
                https://nqit.ox.ac.uk/
                ; 2016 private communication. The error model was based on communication with Chris Balance and Tom Harty, mediated through Niel de Beaudrap, early on the NQIT project. Continued collaboration and communication with experimentalists could lead in refinement of the error model, which could be subject for future work.). For our simulations we use, with suitable modification, the classical simulator of Bravyi and Gosset 2016 (
                Phys. Rev. Lett.
                116
                250501). The specific problems considered belong to the class of instantaneous quantum polynomial-time (
                IQP
                ) problems (Shepherd and Bremner 2009
                Proc. R. Soc.
                A
                465
                141339), a class believed to be hard for classical computing devices, and to be a promising candidate for the first demonstration of quantum-advantage. We first consider a subclass of
                IQP
                , defined in Bermejo-Vega
                et al
                2018 (
                Phys. Rev.
                X
                8
                021010), involving two-dimensional dynamical quantum simulators, before moving to more general instances of
                IQP
                , but which are still restricted to the architecture of NQIT.
