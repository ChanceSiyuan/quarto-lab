title: Design and Comparative Analysis of Quantum Hashing Algorithms using Qiskit
authors:
  - first: Prodipto
    last: Das
year: 2023
abstract: This research explores the quantum implementation of three crucial
  hashing algorithms, namely Secure Hash Algorithm 1 (SHA-1), Message Digest 5
  (MD5), and Secure Hash Algorithm 256 (SHA-256), within the context of network
  security for future networks. Quantum Cryptography, an emerging field,
  combines Cryptology and Cryptanalysis, presenting exciting prospects for
  secure communication. Our study focuses on the design and implementation of
  SHA-1, MD5, and SHA-256 algorithms specifically tailored for Quantum
  Computers. The primary objective is to investigate the time required to
  construct a hash and the bit rate at which a hash value can be transmitted. A
  comprehensive analysis of these three quantum algorithms is performed, with a
  particular emphasis on their performance in comparison to their classical
  counterparts. Experimental comparisons reveal that the execution time for
  qSHA1, qMD5 and qSHA-256 significantly exceeds that of classical parts.
  Notably, our findings indicate a dependency of the implemented algorithms’
  execution time on the processor’s speed. This research sheds light on the
  potential capabilities of quantum algorithms in the realm of network security
  and contributes valuable insights to the ongoing discussions surrounding
  quantum cryptography. An intriguing discovery arising from this study is the
  observation that quantum MD5 exhibits quicker execution times than quantum
  SHA-1 and quantum SHA-256. However, contrasting the classical scenario, where
  cSHA-1 demonstrates quicker execution than cMD5 and cSHA-256, it becomes
  evident that classical and quantum performance across these algorithms
  diverges markedly. This highlights a notable contrast in the behavior of these
  algorithms, thereby underscoring the potential dissimilarity rather than
  similarity between classical and quantum performances. The results underscore
  the need for further exploration to optimize the performance of quantum
  hashing algorithms, ensuring their viability in practical applications for
  future networks.
