year: 2016
abstract: We investigate the cost of Grover’s quantum search algorithm when used
  in the context of pre-image attacks on the SHA-2 and SHA-3 families of hash
  functions. Our cost model assumes that the attack is run on a surface code
  based fault-tolerant quantum computer. Our estimates rely on a time-area
  metric that costs the number of logical qubits times the depth of the circuit
  in units of surface code cycles. As a surface code cycle involves a signiﬁcant
  classical processing stage, our cost estimates allow for crude, but direct,
  comparisons of classical and quantum algorithms.
