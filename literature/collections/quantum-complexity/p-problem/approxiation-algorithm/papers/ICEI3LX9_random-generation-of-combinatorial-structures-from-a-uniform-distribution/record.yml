title: Random generation of combinatorial structures from a uniform distribution
authors:
  - first: Mark R.
    last: Jerrum
  - first: Leslie G.
    last: Valiant
  - first: Vijay V.
    last: Vazirani
year: 1986
abstract: The class of problems involving the random generation of combinatorial
  structures from a uniform distribution is considered. Uniform generation
  problems are, in computational difficulty, intermediate between classical
  existence and counting problems. It is shown that exactly uniform generation
  of 'efficiently verifiable' combinatorial structures is reducible to
  approximate counting (and hence, is within the third level of the polynomial
  hierarchy). Natural combinatorial problems are presented which exhibit
  complexity gaps between their existence and generation, and between their
  generation and counting versions. It is further shown that for self-reducible
  problems, almost uniform generation and randomized approximate counting are
  inter-reducible, and hence, of similar complexity.
