item_type: journalArticle
title: "A linear-optical proof that the permanent is # <b>P</b> -hard"
authors:
  - first: Scott
    last: Aaronson
year: 2011
abstract: "One of the crown jewels of complexity theory is Valiant’s 1979
  theorem that computing the permanent of an n × n matrix is #P-hard. Here we
  show that, by using the model of linearoptical quantum computing—and in
  particular, a universality theorem due to Knill, Laﬂamme, and Milburn—one can
  give a diﬀerent and arguably more intuitive proof of this theorem."
