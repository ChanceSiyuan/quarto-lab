item_type: preprint
title: Permutation gates in the third level of the Clifford hierarchy
authors:
  - first: Zhiyang
    last: He
  - first: Luke
    last: Robitaille
  - first: Xinyu
    last: Tan
year: 2024
abstract: "The Cliﬀord hierarchy is a fundamental structure in quantum
  computation, classifying unitary operators based on their commutation
  relations with the Pauli group. Despite its significance, the mathematical
  structure of the hierarchy is not well understood at the third level and
  higher. In this work, we study permutations in the hierarchy: gates which
  permute the 2n basis states. We fully characterize all the semi-Cliﬀord
  permutation gates. Moreover, we prove that any permutation gate in the third
  level, not necessarily semi-Cliﬀord, must be a product of Toﬀoli gates in what
  we deﬁne as staircase form, up to left and right multiplications of Cliﬀord
  permutations. Finally, we show that the smallest number of qubits for which
  there exists a non–semi-Cliﬀord permutation in the third level is 7."
