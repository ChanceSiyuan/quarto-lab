item_type: preprint
title: The Clifford group forms a unitary 3-design
authors:
  - first: Zak
    last: Webb
year: 2016
abstract: Unitary $k$-designs are finite ensembles of unitary matrices that
  approximate the Haar distribution over unitary matrices. Several ensembles are
  known to be 2-designs, including the uniform distribution over the Clifford
  group, but no family of ensembles was previously known to form a 3-design. We
  prove that the Clifford group is a 3-design, showing that it is a better
  approximation to Haar-random unitaries than previously expected. Our proof
  strategy works for any distribution of unitaries satisfying a property we call
  Pauli 2-mixing and proceeds without the use of heavy mathematical machinery.
  We also show that the Clifford group does not form a 4-design, thus
  characterizing how well random Clifford elements approximate Haar-random
  unitaries. Additionally, we show that the generalized Clifford group for
  qudits is not a 3-design unless the dimension of the qudit is a power of 2.
