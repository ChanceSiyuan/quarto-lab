title: A Non-Commuting Stabilizer Formalism
authors:
  - first: Xiaotong
    last: Ni
  - first: Oliver
    last: Buerschaper
  - first: Maarten Van den
    last: Nest
year: 2015
abstract: We propose a non-commutative extension of the Pauli stabilizer
  formalism. The aim is to describe a class of many-body quantum states which is
  richer than the standard Pauli stabilizer states. In our framework, stabilizer
  operators are tensor products of single-qubit operators drawn from the group
  $\langle \alpha I, X,S\rangle$, where $\alpha=e^{i\pi/4}$ and
  $S=\operatorname{diag}(1,i)$. We provide techniques to efficiently compute
  various properties related to bipartite entanglement, expectation values of
  local observables, preparation by means of quantum circuits, parent
  Hamiltonians etc. We also highlight significant differences compared to the
  Pauli stabilizer formalism. In particular, we give examples of states in our
  formalism which cannot arise in the Pauli stabilizer formalism, such as
  topological models that support non-Abelian anyons.
