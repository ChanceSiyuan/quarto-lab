title: New techniques for bounding stabilizer rank
authors:
  - first: Benjamin
    last: Lovitz
  - first: Vincent
    last: Steffan
year: 2022
abstract: In this work, we present number-theoretic and algebraic-geometric
  techniques for bounding the stabilizer rank of quantum states. First, we
  refine a number-theoretic theorem of Moulton to exhibit an explicit sequence
  of product states with exponential stabilizer rank but constant approximate
  stabilizer rank, and to provide alternate (and simplified) proofs of the
  best-known asymptotic lower bounds on stabilizer rank and approximate
  stabilizer rank, up to a log factor. Second, we find the first non-trivial
  examples of quantum states with multiplicative stabilizer rank under the
  tensor product. Third, we introduce and study the generic stabilizer rank
  using algebraic-geometric techniques.
