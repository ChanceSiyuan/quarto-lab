abstract: >-
  Quantum magic is a necessary resource for quantum computers to be not
  efficiently simulable by classical computers. Previous results have linked
  the  of quantum magic, characterized by the number of
                
                  T
                
                gates or the stabilizer rank, to classical simulability. However, the effect of the  of quantum magic on the hardness of simulating a quantum circuit remains open. In this work, we investigate the classical simulability of quantum circuits with alternating Clifford and
                
                  T
                
                layers across three tasks: amplitude estimation, sampling, and evaluating Pauli observables. In the case in which all
                
                  T
                
                gates are distributed in a single layer, performing amplitude estimation and sampling to multiplicative error are already classically intractable under reasonable assumptions, but Pauli observables are easy to evaluate. Surprisingly, with the addition of just one
                
                  T
                
