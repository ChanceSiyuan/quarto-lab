year: 2024
abstract: Tensor networks capture large classes of ground states of phases of
  quantum matter faithfully and efficiently. Their manipulation and contraction
  has remained a challenge over the years, however. For most of the history,
  ground state simulations of twodimensional quantum lattice systems using
  (infinite) projected entangled pair states have relied on what is called a
  time-evolving block decimation. In recent years, multiple proposals for the
  variational optimization of the quantum state have been put forward,
  overcoming accuracy and convergence problems of previously known methods. The
  incorporation of automatic differentiation in tensor networks algorithms has
  ultimately enabled a new, flexible way for variational simulation of ground
  states and excited states. In this work we review the state-of-the-art of the
  variational iPEPS framework, providing a detailed introduction to automatic
  differentiation, a description of a general foundation into which various
  two-dimensional lattices can be conveniently incorporated, and demonstrative
  benchmarking results.
