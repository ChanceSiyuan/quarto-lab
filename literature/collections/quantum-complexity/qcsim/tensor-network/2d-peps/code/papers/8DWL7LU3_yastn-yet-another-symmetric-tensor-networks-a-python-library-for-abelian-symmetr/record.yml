  - first: Juraj
    last: Hasik
year: 2025
abstract: We present an open-source tensor network Python library for quantum
  many-body simulations. At its core is an Abelian-symmetric tensor, implemented
  as a sparse block structure managed by a logical layer on top of a dense
  multidimensional array backend. This serves as the basis for higher-level
  tensor network algorithms operating on matrix product states and projected
  entangled pair states. An appropriate backend, such as PyTorch, gives direct
  access to automatic differentiation (AD) for cost-function gradient
  calculations and execution on GPU and other supported accelerators. We show
  the library performance in simulations with infinite projected entangled-pair
  states, such as finding the ground states with AD and simulating thermal
  states of the Hubbard model via imaginary time evolution. For these
  challenging examples, we identify and quantify sources of the numerical
  advantage exploited by the symmetric-tensor implementation.
