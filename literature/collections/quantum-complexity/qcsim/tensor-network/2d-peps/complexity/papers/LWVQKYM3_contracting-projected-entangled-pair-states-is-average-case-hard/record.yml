title: Contracting projected entangled pair states is average-case hard
authors:
  - first: Jonas
    last: Haferkamp
  - first: Dominik
    last: Hangleiter
  - first: Jens
    last: Eisert
  - first: Marek
    last: Gluza
year: 2020
abstract: "An accurate calculation of the properties of quantum many-body
  systems is one of the most important yet intricate challenges of modern
  physics and computer science. In recent years, the tensor network ansatz has
  established itself as one of the most promising approaches enabling striking
  efficiency of simulating static properties of one-dimensional systems and
  abounding numerical applications in condensed matter theory. In higher
  dimensions, however, a connection to the field of computational complexity
  theory has shown that the accurate normalization of the two-dimensional tensor
  networks called projected entangled pair states (PEPS) is #P-complete.
  Therefore, an efficient algorithm for PEPS contraction would allow to solve
  exceedingly difficult combinatorial counting problems, which is considered
  highly unlikely. Due to the importance of understanding two- and
  three-dimensional systems the question currently remains: Are the known
  constructions typical of states relevant for quantum many-body systems? In
  this work, we show that an accurate evaluation of normalization or expectation
  values of PEPS is as hard to compute for typical instances as for special
  configurations of highest computational hardness. We discuss the structural
  property of average-case hardness in relation to the current research on
  efficient algorithms attempting tensor network contraction, hinting at a
  wealth of possible further insights into the average-case hardness of
  important problems in quantum many-body theory."
