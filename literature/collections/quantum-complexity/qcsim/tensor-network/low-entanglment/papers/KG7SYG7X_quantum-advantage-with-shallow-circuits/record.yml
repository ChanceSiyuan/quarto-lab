item_type: journalArticle
title: Quantum advantage with shallow circuits
authors:
  - first: Sergey
    last: Bravyi
  - first: David
    last: Gosset
  - first: Robert
    last: Koenig
year: 2018
abstract: We prove that constant-depth quantum circuits are more powerful than
  their classical counterparts. To this end we introduce a non-oracular version
  of the Bernstein-Vazirani problem which we call the 2D Hidden Linear Function
  problem. An instance of the problem is specified by a quadratic form q that
  maps n-bit strings to integers modulo four. The goal is to identify a linear
  boolean function which describes the action of q on a certain subset of n-bit
  strings. We prove that any classical probabilistic circuit composed of bounded
  fan-in gates that solves the 2D Hidden Linear Function problem with high
  probability must have depth logarithmic in n. In contrast, we show that this
  problem can be solved with certainty by a constant-depth quantum circuit
  composed of one- and two-qubit gates acting locally on a two-dimensional grid.
