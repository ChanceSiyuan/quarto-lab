year: 2025
abstract: Simulating the dynamics of neutral atom arrays is a challenging
  problem. To address this, we introduce two emulators, emu-sv and emu-mps, as
  computational backends for Pasqal's pulser package. Emu-sv is designed for
  high-precision state-vector simulations, giving the possibility to emulate
  systems of up to $\thicksim 27$ qubits on an A100 40GB GPU, making it perfect
  for cases where numerically exact results are needed. In contrast, emu-mps
  uses a Matrix Product State representation and other controlled approximations
  to efficiently simulate much larger arrays of atoms with manageable errors. We
  show through benchmark comparisons that both emulators provide significant
  speed-ups over generic solvers such as QuTiP. In addition, we provide
  practical guidance on choosing between the two emulators. These quantum
  software tools are designed to support researchers and developers aiming to
  simulate quantum systems either as a precursor to full hardware implementation
  or as a means of benchmarking hardware performance.
