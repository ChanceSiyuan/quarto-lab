item_type: journalArticle
title: "A Practical Introduction to Tensor Networks: Matrix Product States and
  Projected Entangled Pair States"
authors:
  - first: Roman
    last: Orus
year: 2014
abstract: This is a partly non-technical introduction to selected topics on
  tensor network methods, based on several lectures and introductory seminars
  given on the subject. It should be a good place for newcomers to get
  familiarized with some of the key ideas in the ﬁeld, specially regarding the
  numerics. After a very general introduction we motivate the concept of tensor
  network and provide several examples. We then move on to explain some basics
  about Matrix Product States (MPS) and Projected Entangled Pair States (PEPS).
  Selected details on some of the associated numerical methods for 1d and 2d
  quantum lattice systems are also discussed.
