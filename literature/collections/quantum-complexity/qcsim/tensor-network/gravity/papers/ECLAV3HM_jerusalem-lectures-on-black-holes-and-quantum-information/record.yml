title: Jerusalem Lectures on Black Holes and Quantum Information
authors:
  - first: Daniel
    last: Harlow
year: 2016
abstract: In these lectures I give an introduction to the quantum physics of
  black holes, including recent developments based on quantum information theory
  such as the firewall paradox and its various cousins. I also give an
  introduction to holography and the AdS/CFT correspondence, focusing on those
  aspects which are relevant for the black hole information problem.
