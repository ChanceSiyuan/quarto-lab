item_type: journalArticle
title: Diffeomorphism invariant tensor networks for 3d gravity
authors:
  - first: Vijay
    last: Balasubramanian
  - first: Charlie
    last: Cummings
year: 2026
abstract: Tensor networks prepare states which share many features of states in
  quantum gravity. However, standard constructions are not diffeomorphism
  invariant and do not support an algebra of non-commuting area operators.
  Recently, analogues of both problems were addressed in a tensor network
  discretization of topological field theories (TFT) with finite or compact
  gauge groups. Here, we extend this work towards gravity by generalizing to
  gauge groups that are discrete or continuous, compact or non-compact. Applied
  to SL(2, ℝ) × SL(2, ℝ) Chern-Simons theory, our construction can be
  interpreted as building states of three dimensional gravity with a negative
  cosmological constant. Our tensor networks prepare states which satisfy the
  constraints of Chern-Simons theory. In metric variables, this implies that the
  states we construct satisfy the Wheeler-DeWitt equation and momentum
  constraints, and so are diffeomorphism invariant.
