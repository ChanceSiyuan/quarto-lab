title: Bulk locality and quantum error correction in AdS/CFT
authors:
  - first: Ahmed
    last: Almheiri
  - first: Xi
    last: Dong
  - first: Daniel
    last: Harlow
year: 2015
abstract: We point out a connection between the emergence of bulk locality in
  AdS/CFT and the theory of quantum error correction. Bulk notions such as
  Bogoliubov transformations, location in the radial direction, and the
  holographic entropy bound all have natural CFT interpretations in the language
  of quantum error correction. We also show that the question of whether bulk
  operator reconstruction works only in the causal wedge or all the way to the
  extremal surface is related to the question of whether or not the quantum
  error correcting code realized by AdS/CFT is also a “quantum secret sharing
  scheme”, and suggest a tensor network calculation that may settle the issue.
  Interestingly, the version of quantum error correction which is best suited to
  our analysis is the somewhat nonstandard “operator algebra quantum error
  correction” of Beny, Kempf, and Kribs. Our proposal gives a precise
  formulation of the idea of “subregion-subregion” duality in AdS/CFT, and
  clariﬁes the limits of its validity.
