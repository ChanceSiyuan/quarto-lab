item_type: preprint
title: Tensor Networks for Simulating Quantum Circuits on FPGAs
authors:
  - first: Maksim
    last: Levental
year: 2021
abstract: Most research in quantum computing today is performed against
  simulations of quantum computers rather than true quantum computers.
  Simulating a quantum computer entails implementing all of the unitary
  operators corresponding to the quantum gates as tensors. For high numbers of
  qubits, performing tensor multiplications for these simulations becomes quite
  expensive, since N -qubit gates correspond to 2N -dimensional tensors. One way
  to accelerate such a simulation is to use ﬁeld programmable gate array (FPGA)
  hardware to eﬃciently compute the matrix multiplications. Though FPGAs can
  eﬃciently perform tensor multiplications, they are memory bound, having
  relatively small block random access memory. One way to potentially reduce the
  memory footprint of a quantum computing system is to represent it as a tensor
  network; tensor networks are a formalism for representing compositions of
  tensors wherein economical tensor contractions are readily identiﬁed. Thus we
  explore tensor networks as a means to reducing the memory footprint of quantum
  computing systems and broadly accelerating simulations of such systems.
