year: 2019
abstract: We present a general procedure for constructing tensor networks that
  accurately reproduce holographic states in conformal ﬁeld theories (CFTs).
  Given a state in a large-N CFT with a static, semiclassical gravitational
  dual, we build a tensor network by an iterative series of approximations that
  eliminate redundant degrees of freedom and minimize the bond dimensions of the
  resulting network. We argue that the bond dimensions of the tensor network
  will match the areas of the corresponding bulk surfaces. For “tree” tensor
  networks (i.e., those that are constructed by discretizing spacetime with
  nonintersecting Ryu-Takayanagi surfaces), our arguments can be made rigorous
  using a version of one-shot entanglement distillation in the CFT. Using the
  known quantum error correcting properties of AdS/CFT, we show that bulk legs
  can be added to the tensor networks to create holographic quantum error
  correcting codes. These codes behave similarly to previous holographic tensor
  network toy models, but describe actual bulk excitations in continuum AdS/CFT.
