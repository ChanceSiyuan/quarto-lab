year: 2023
abstract: Once developed for quantum theory, tensor networks have been
  established as a successful machine learning paradigm. Now, they have been
  ported back to the quantum realm in the emerging ﬁeld of quantum machine
  learning to assess problems that classical computers are unable to solve
  efﬁciently. Their nature at the interface between physics and machine learning
  makes tensor networks easily deployable on quantum computers. In this review
  article, we shed light on one of the major architectures considered to be
  predestined for variational quantum machine learning. In particular, we
  discuss how layouts like MPS, PEPS, TTNs and MERA can be mapped to a quantum
  computer, how they can be used for machine learning and data encoding and
  which implementation techniques improve their performance.
