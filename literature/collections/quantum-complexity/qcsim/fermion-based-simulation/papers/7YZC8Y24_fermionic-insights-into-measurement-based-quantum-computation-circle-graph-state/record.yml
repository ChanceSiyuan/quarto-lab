item_type: preprint
title: "Fermionic Insights into Measurement-Based Quantum Computation: Circle
  Graph States Are Not Universal Resources"
authors:
  - first: Brent
    last: Harrison
  - first: Vishnu
    last: Iyer
  - first: Ojas
