  - first: Kevin
    last: Thompson
  - first: Andrew
    last: Zhao
year: 2025
abstract: Measurement-based quantum computation (MBQC) is a strong contender for
  realizing quantum computers. A critical question for MBQC is the
  identification of resource graph states that can enable universal quantum
  computation. Any such universal family must have unbounded entanglement width,
  which is known to be equivalent to the ability to produce any circle graph
  state from the states in the family using only local Clifford operations,
  local Pauli measurements, and classical communication. Yet, it was not
  previously known whether or not circle graph states themselves are a universal
  resource. We show that, in spite of their expressivity, circle graph states
  are not efficiently universal for MBQC (i.e., assuming BQP ̸= BPP). We prove
  this by articulating a precise graph-theoretic correspondence between circle
  graph states and a certain subset of fermionic Gaussian states. This is
  accomplished by synthesizing a variety of techniques that allow us to handle
  both stabilizer states and fermionic Gaussian states at the same time. As
  such, we anticipate that our developments may have broader applications beyond
  the domain of MBQC as well.
