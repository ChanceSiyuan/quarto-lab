title: Kirkwood-Dirac Nonpositivity is a Necessary Resource for Quantum Computing
authors:
  - first: Jonathan J.
    last: Thio
  - first: Songqinghao
    last: Yang
  - first: Stephan De
    last: Bièvre
  - first: Crispin H. W.
