year: null
abstract: We deﬁne rank-width of graphs to investigate clique-width. Rank-width
  is a complexity measure of decomposing a graph in a kind of tree-structure,
  called a rankdecomposition. We show that graphs have bounded rank-width if and
  only if they have bounded clique-width.
