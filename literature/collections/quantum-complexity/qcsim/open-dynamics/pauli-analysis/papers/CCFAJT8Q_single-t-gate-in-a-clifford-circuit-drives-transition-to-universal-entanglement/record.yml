item_type: journalArticle
title: Single T gate in a Clifford circuit drives transition to universal
  entanglement spectrum statistics
authors:
  - first: Shiyu
    last: Zhou
  - first: Zhi-Cheng
    last: Yang
  - first: Alioscia
    last: Hamma
  - first: Claudio
    last: Chamon
year: 2020
abstract: "Cliﬀord circuits are insuﬃcient for universal quantum computation or
  creating t-designs with t ≥ 4. While the entanglement entropy is not a
  telltale of this insuﬃciency, the entanglement spectrum of a time evolved
  random product state is: the entanglement levels are Poisson-distributed for
  circuits restricted to the Cliﬀord gate-set, while the levels follow
  Wigner-Dyson statistics when universal gates are used. In this paper we show,
  using ﬁnite-size scaling analysis of diﬀerent measures of level spacing
  statistics, that in the thermodynamic limit, inserting a single T (π/8) gate
  in the middle of a random Cliﬀord circuit is suﬃcient to alter the
  entanglement spectrum from a Poisson to a Wigner-Dyson distribution."
