item_type: preprint
title: Quantum circuits and low-degree polynomials over F_2
authors:
  - first: Ashley
    last: Montanaro
year: 2016
abstract: In this work we explore a correspondence between quantum circuits and
  low-degree polynomials over the ﬁnite ﬁeld F2. Any quantum circuit made up of
  Hadamard, Z, controlled-Z and controlled-controlled-Z gates gives rise to a
  degree-3 polynomial over F2 such that calculating quantum circuit amplitudes
  is equivalent to counting zeroes of the corresponding polynomial. We exploit
  this connection, which is especially clean and simple for this particular gate
  set, in two directions. First, we give proofs of classical hardness results
  based on quantum circuit concepts. Second, we ﬁnd eﬃcient classical simulation
  algorithms for certain classes of quantum circuits based on eﬃcient algorithms
  for classes of polynomials.
