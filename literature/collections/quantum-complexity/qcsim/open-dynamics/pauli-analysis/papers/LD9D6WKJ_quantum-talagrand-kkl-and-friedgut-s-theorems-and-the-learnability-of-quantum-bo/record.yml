item_type: preprint
title: Quantum Talagrand, KKL and Friedgut's theorems and the learnability of
  quantum Boolean functions
authors:
  - first: Cambyse
    last: Rouzé
  - first: Melchior
    last: Wirth
  - first: Haonan
    last: Zhang
year: 2024
abstract: We extend three related results from the analysis of influences of
  Boolean functions to the quantum setting, namely the KKL Theorem, Friedgut's
  Junta Theorem and Talagrand's variance inequality for geometric influences.
  Our results are derived by a joint use of recently studied hypercontractivity
  and gradient estimates. These generic tools also allow us to derive
  generalizations of these results in a general von Neumann algebraic setting
  beyond the case of the quantum hypercube, including examples in infinite
  dimensions relevant to quantum information theory such as continuous variables
  quantum systems. Finally, we comment on the implications of our results as
  regards to noncommutative extensions of isoperimetric type inequalities,
  quantum circuit complexity lower bounds and the learnability of quantum
  observables.
