year: 2023
abstract: Noise detrimentally affects quantum computations so that they not only
  become less accurate but also easier to simulate classically as systems scale
  up. We construct a classical simulation algorithm, LOWESA (low weight
  efficient simulation algorithm), for estimating expectation values of noisy
  parameterised quantum circuits. It combines previous results on spectral
  analysis of parameterised circuits with Pauli back-propagation and recent
  ideas for simulations of noisy random circuits. We show, under some conditions
  on the circuits and mild assumptions on the noise, that LOWESA gives an
  efficient, polynomial algorithm in the number of qubits (and depth), with
  approximation error that vanishes exponentially in the physical error rate and
  a controllable cut-off parameter. We also discuss the practical limitations of
  the method for circuit classes with correlated parameters and its scaling with
  decreasing error rates.
