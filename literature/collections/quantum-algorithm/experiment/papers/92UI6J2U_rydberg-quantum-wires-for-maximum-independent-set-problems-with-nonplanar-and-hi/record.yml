title: Rydberg Quantum Wires for Maximum Independent Set Problems with Nonplanar
  and High-Degree Graphs
authors:
  - first: Minhyuk
    last: Kim
  - first: Kangheun
    last: Kim
  - first: Jaeyong
    last: Hwang
