year: 2025
abstract: The Maximum Independent Set (MIS) problem is a fundamental
  combinatorial optimization task that can be naturally mapped onto the Ising
  Hamiltonian of neutral atom quantum processors. Given its connection to
  NP-hard problems and real-world applications, there has been significant
  experimental interest in exploring quantum advantage for MIS. Pioneering
  experiments on King's Lattice graphs suggested a quadratic speed-up over
  simulated annealing, but recent benchmarks using state-of-the-art methods
  found no clear advantage, likely due to the structured nature of the tested
  instances. In this work, we generate hard instances of unit-disk graphs by
  leveraging complexity theory results and varying key hardness parameters such
  as density and treewidth. For a fixed graph size, we show that increasing
  these parameters can lead to prohibitive classical runtime increases of
  several orders of magnitude. We then compare classical and quantum approaches
  on small instances and find that, at this scale, quantum solutions are slower
  than classical ones for finding exact solutions. Based on extended classical
  benchmarks at larger problem sizes, we estimate that scaling up to a thousand
  atoms with a 1 kHz repetition rate is a necessary step toward demonstrating a
  computational advantage with quantum methods.
