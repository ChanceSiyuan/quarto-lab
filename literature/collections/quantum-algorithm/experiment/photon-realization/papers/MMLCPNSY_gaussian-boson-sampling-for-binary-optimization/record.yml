abstract: In this study, we consider a Gaussian Boson Sampler for solving a
  Flight Gate Assignment problem. We employ a Variational Quantum Eigensolver
  approach using the Conditional Value-at-risk cost function. We provide proof
  of principle by carrying out numerical simulations on randomly generated
  instances.
