title: Quantum Algorithms for Lattice Problems
authors:
  - first: Yilei
    last: Chen
year: null
abstract: We show a polynomial time quantum algorithm for solving the learning
  with errors problem (LWE) with certain polynomial modulus-noise ratios.
  Combining with the reductions from lattice problems to LWE shown by Regev
  [J.ACM 2009], we obtain polynomial time quantum algorithms for solving the
  decisional shortest vector problem (GapSVP) and the shortest independent
  vector problem (SIVP) for all n-dimensional lattices within approximation
  factors of Ω˜ (n4.5). Previously, no polynomial or even subexponential time
  quantum algorithms were known for solving GapSVP or SIVP for all lattices
  within any polynomial approximation factors.
