abstract: "Many quantum algorithms, including Shor’s celebrated factoring and
  discrete log algorithms, proceed by reduction to a hidden subgroup problem, in
  which a unknown subgroup H of a group G must be determined from a quantum
  state ψ over G that is uniformly supported on a left coset of H. These hidden
  subgroup problems are typically solved by Fourier sampling: the quantum
  Fourier transform of ψ is computed and measured. When the underlying group is
  nonabelian, two important variants of the Fourier sampling paradigm have been
  identiﬁed: the weak standard method, where only representation names are
  measured, and the strong standard method, where full measurement (i.e., the
  row and column of the representation as well as its name) occurs. It has
  remained open whether the strong method is indeed stronger, that is, whether
  there are hidden subgroups that can be reconstructed via the strong method but
  not by the weak, or any other known, method."
