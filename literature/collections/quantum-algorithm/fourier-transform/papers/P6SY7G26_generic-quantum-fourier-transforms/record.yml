title: Generic Quantum Fourier Transforms
authors:
  - first: Cristopher
    last: Moore
  - first: Daniel
    last: Rockmore
  - first: Alexander
    last: Russell
year: 2003
abstract: The quantum Fourier transform (QFT) is the principal algorithmic tool
  underlying most efficient quantum algorithms. We present a generic framework
  for the construction of efficient quantum circuits for the QFT by
  ``quantizing'' the separation of variables technique that has been so
  successful in the study of classical Fourier transform computations.
  Specifically, this framework applies the existence of computable Bratteli
  diagrams, adapted factorizations, and Gel'fand-Tsetlin bases to offer
  efficient quantum circuits for the QFT over a wide variety a finite Abelian
  and non-Abelian groups, including all group families for which efficient QFTs
  are currently known and many new group families. Moreover, the method gives
  rise to the first subexponential-size quantum circuits for the QFT over the
  linear groups GL_k(q), SL_k(q), and the finite groups of Lie type, for any
  fixed prime power q.
