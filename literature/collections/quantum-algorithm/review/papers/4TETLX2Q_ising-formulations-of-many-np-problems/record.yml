item_type: journalArticle
title: Ising formulations of many NP problems
authors:
  - first: Andrew
    last: Lucas
year: 2014
abstract: We provide Ising formulations for many NP-complete and NP-hard
  problems, including all of Karp's 21 NP-complete problems. This collects and
  extends mappings to the Ising model from partitioning, covering and
  satisfiability. In each case, the required number of spins is at most cubic in
  the size of the problem. This work may be useful in designing adiabatic
  quantum optimization algorithms.
