abstract: Product formulas were the original proposal for simulating Hamiltonian
  evolution on a quantum computer. Despite extensive progress in quantum
  simulation, product formulas remain competitive in practice due to their
  minimal resource requirements and better empirical performance. Here we
  introduce Corrected Product Formulas (CPFs), which significantly enhance the
  accuracy of standard product formulas, leading to a significantly reduced cost
  for Hamiltonian simulations. Our extensive numerical simulations and
  implementations on real quantum hardware demonstrate that CPFs consistently
  outperform standard product formulas across various models. These results
  highlight CPFs as a promising tool for early fault-tolerant quantum computers
  with limited resources.
