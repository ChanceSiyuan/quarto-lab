year: 2024
abstract: "A large spectrum of problems in classical physics and engineering,
  such as turbulence, is governed by nonlinear differential equations, which
  typically require high-performance computing to be solved. Over the past
  decade, however, the growth of classical computing power has slowed down
  because the miniaturisation of chips has been approaching the atomic scale.
  This is marking an end to Moore's law, which calls for a new computing
  paradigm: Quantum computing is a prime candidate. In this paper, we offer a
  perspective on the current challenges that need to be overcome in order to use
  quantum computing for the simulation of nonlinear dynamics. We review and
  discuss progress in the development of both quantum algorithms for nonlinear
  equations and quantum hardware. We propose pairings between quantum algorithms
  for nonlinear equations and quantum hardware concepts. These avenues open new
  opportunities for the simulation of nonlinear systems and turbulence."
