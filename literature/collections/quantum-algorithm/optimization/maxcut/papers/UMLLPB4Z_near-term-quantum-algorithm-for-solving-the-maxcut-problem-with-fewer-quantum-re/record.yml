year: 2024
abstract: MaxCut is an NP-hard combinatorial optimization problem in graph
  theory. The quantum approximate optimization algorithms (QAOAs) offer new
  methods for solving such problems, which are potentially better than classical
  schemes. However, the requirement of 𝑁 qubits for solving graphs with
  𝑁-vertex in QAOA, coupled with the large-𝑁 trainability issue due to barren
  plateaus, poses a substantial challenge for noisy intermediate-scale quantum
  (NISQ) devices. Recently, a hybrid quantum–classical algorithm has been
  proposed for solving semidefinite programs (SDPs), named NISQ SDP Solver
  (NSS). In this paper, we study the performance of the NSS for solving MaxCut
  problem via the introduction of a near-term quantum algorithm and execution of
  experimental simulations. Since the MaxCut problem admits a relaxation into an
  SDP formulation, the SDP can be solved using NSS, with a subsequent classical
  post-processing step converting the hybrid density matrix into a MaxCut
  solution. After performing these steps, the near-term quantum algorithm will
  also inherit the advantages of NSS. We analyze the algorithm as compared to
  QAOAs and find that the depth of the quantum circuit is independent of the
  number of edges on the graph. Our algorithm requires log 𝑁 qubits and has
  𝑂(1) circuit depth. This implies that it uses exponentially fewer qubits
  compared to QAOAs while also requiring a significantly reduced circuit depth
  to solve the MaxCut problem. To demonstrate the effectiveness of the NSS, we
  focused on 3-regular graphs, 9-regular graphs, and ER graphs. Numerical
  results indicate that the quantum algorithm achieves a comparable
  approximation ratio with classical methods by solving the original high
  dimensional problem within a lower dimensional ansatz space. Analysis under
  various initial states shows that the algorithm exhibits a remarkably stable
  performance.
