abstract: In this paper we show a reduction from the Unique Games problem to the
  problem of approximating MAX-CUT to within a factor of αGW + , for all > 0;
  here αGW ≈ .878567 denotes the approximation ratio achieved by the
  Goemans-Williamson algorithm [25]. This implies that if the Unique Games
  Conjecture of Khot [36] holds then the Goemans-Williamson approximation
  algorithm is optimal. Our result indicates that the geometric nature of the
  Goemans-Williamson algorithm might be intrinsic to the MAX-CUT problem.
