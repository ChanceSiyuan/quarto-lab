year: 2025
abstract: Whether quantum computers can achieve exponential speedups in
  optimization has been a major open question in quantum algorithms since the
  field began. Here we introduce a quantum algorithm called Decoded Quantum
  Interferometry (DQI), which uses the quantum Fourier transform to reduce
  optimization problems to decoding problems. For approximating optimal
  polynomial fits to data over finite fields, DQI efficiently achieves a better
  approximation ratio than any polynomial time classical algorithm known to us,
  thus suggesting exponential quantum speedup. We also extend this to
  multivariate polynomials. These optimization problems are solved approximately
  by quantum reduction to decoding of Reed-Solomon and Reed-Muller codes,
  respectively. Sparse unstructured optimization problems such as max-k-XORSAT
  are reduced to decoding of LDPC codes. Although we have not identified quantum
  advantage for the sparse unstructured case, we prove a theorem which allows
  the performance of DQI to be calculated instance-by-instance based on the
  empirical performance of classical LDPC decoders such as belief propagation.
  We demonstrate this by benchmarking on an instance with over 30,000 variables.
