item_type: journalArticle
title: On solving the densest <i>k</i> -subgraph problem on large graphs
authors:
  - first: Renata
    last: Sotirov
year: 2020
abstract: The densest k-subgraph problem is the problem of finding a k-vertex
  subgraph of a graph with the maximum number of edges. In order to solve large
  instances of the densest k-subgraph problem, we introduce two algorithms that
  are based on the random coordinate descent approach. Although it is common use
  to update at most two random coordinates simultaneously in each iteration of
  an algorithm, our algorithms may simultaneously update many coordinates. We
  show the benefit of updating more than two coordinates simultaneously for
  solving the densest k-subgraph problem, and solve large problem instances with
  up to 215 vertices.
