abstract: Quantum information processing is the emerging ﬁeld that deﬁnes and
  realizes computing devices that make use of quantum mechanical principles,
  like the superposition principle, entanglement, and interference. Until
  recently the common notion of computing was based on classical mechanics, and
  did not take into account all the possibilities that physically-realizable
  computing devices oﬀer in principle. The ﬁeld gained momentum after Peter Shor
  developed an eﬃcient algorithm for factoring numbers, demonstrating the
  potential computing powers that quantum computing devices can unleash.
