item_type: journalArticle
title: Multiparticle entanglement purification for graph states
authors:
  - first: W.
    last: Dür
  - first: H.
    last: Aschauer
  - first: H.-J.
    last: Briegel
year: 2003
abstract: We introduce a class of multiparticle entanglement purification
  protocols that allow us to distill a large class of entangled states. These
  include cluster states, GHZ states and various error correction codes all of
  which belong to the class of two-colorable graph states. We analyze these
  schemes under realistic conditions and observe that they are scalable, i.e.
  the threshold value for imperfect local operations does not depend on the
  number of parties for many of these states. When compared to schemes based on
  bipartite entanglement purification, the protocol is more efficient and the
  achievable quality of the purified states is larger. As an application we
  discuss an experimental realization of the protocol in optical lattices which
  allows one to purify cluster states.
