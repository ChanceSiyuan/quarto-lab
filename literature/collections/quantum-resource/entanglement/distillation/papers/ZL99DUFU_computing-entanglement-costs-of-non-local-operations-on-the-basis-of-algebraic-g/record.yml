item_type: preprint
title: Computing entanglement costs of non-local operations on the basis of
  algebraic geometry
authors:
  - first: Seiseki
    last: Akibue
  - first: Jisho
    last: Miyazaki
  - first: Hiroyuki
    last: Osaka
year: 2025
abstract: In order to realize distributed quantum computations and quantify
  entanglement, it is crucial to minimize the entanglement consumption of
  implementing non-local operations by using local operations and classical
  communications (LOCC) channels. Although this optimization is generally
  NP-hard even if we relax the condition of LOCC channels to separable ones,
  many methodologies have been developed. However, each has only succeeded in
  determining the entanglement cost for speciﬁc cases.
