title: A solution to 2-copy distillability of Werner states
authors:
  - first: Jinshi
    last: Fu
  - first: Li
    last: Gao
  - first: Sang-Jun
    last: Park
year: 2026
abstract: Entanglement distillation is a fundamental task in quantum information
  theory. In this work, we prove that Werner states in arbitrary dimension are
  2-copy distillable if and only if they are 1-copy distillable. This answers
  the longstanding open question of the 2-copy distillability of Werner states.
  This is an important step on determining whether every non-positive partial
  transpose (NPT) state is distillable, which remains one of the central open
  problems in the field of entanglement distillation.
