item_type: journalArticle
title: Virtual quantum broadcasting
authors:
  - first: Arthur J.
    last: Parzygnat
  - first: James
    last: Fullwood
  - first: Francesco
    last: Buscemi
  - first: Giulio
    last: Chiribella
year: 2024
abstract: "The quantum no-broadcasting theorem states that it is impossible to
  produce perfect copies of an arbitrary quantum state, even if the copies are
  allowed to be correlated. Here we show that, although quantum broadcasting
  cannot be achieved by any physical process, it can be achieved by a virtual
  process, described by a Hermitian-preserving trace-preserving map. This
  virtual process is canonical: it is the only map that broadcasts all quantum
  states, is covariant under unitary evolution, is invariant under permutations
  of the copies, and reduces to the classical broadcasting map when subjected to
  decoherence. We show that the optimal physical approximation to the canonical
  broadcasting map is the optimal universal quantum cloning, and we also show
  that virtual broadcasting can be achieved by a virtual measure-and-prepare
  protocol, where a virtual measurement is performed, and, depending on the
  outcomes, two copies of a virtual quantum state are generated. Finally, we use
  canonical virtual broadcasting to prove a uniqueness result for quantum states
  over time."
