item_type: journalArticle
title: Estimating entanglement of unknown states
authors:
  - first: Daniel
    last: Cavalcanti
  - first: Marcelo O. Terra
    last: Cunha
year: 2006
abstract: The experimental determination of entanglement is a major goal in the
  quantum information field. In general the knowledge of the state is required
  in order to quantify its entanglement. Here we express a lower bound to the
  robustness of entanglement of a state based only on the measurement of the
  energy observable and on the calculation of a separability energy. This allows
  the estimation of entanglement dismissing the knowledge of the state in
  question.
