item_type: preprint
title: Detecting Quantum Entanglement
authors:
  - first: Barbara M.
    last: Terhal
year: 2001
abstract: We review the criteria for separability and quantum entanglement, both
  in a bipartite as well as a multipartite setting. We discuss Bell
  inequalities, entanglement witnesses, entropic inequalities, bound
  entanglement and several features of multipartite entanglement. We indicate
  how these criteria bear on the experimental detection of quantum entanglement.
