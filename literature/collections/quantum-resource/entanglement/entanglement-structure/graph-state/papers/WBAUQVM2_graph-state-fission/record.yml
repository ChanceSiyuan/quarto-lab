item_type: preprint
title: Graph State Fission
authors:
  - first: Jorge
    last: Miguel-Ramiro
  - first: Wolfgang
    last: Dür
year: 2024
abstract: Graph states are a fundamental entanglement resource for multipartite
  quantum applications which are in general challenging to transform
  efficiently. While fusion operations for merging entangled states are
  well-developed, no direct protocol exists for the reverse process, which we
  term fission. We introduce a simple, yet powerful, protocol that achieves
  this, allowing a qubit to split while preserving selective connections with
  minimum entanglement overhead. This tool offers flexible entanglement
  management with potential applications in secure communication, error
  correction and adaptive entanglement distribution.
