abstract: >-
  Abstract
              
                We propose an entanglement classification for symmetric quantum states based on their diagonal matrix-product-state (MPS) representation. The proposed classification, which preserves the stochastic local operation assisted with classical communication (SLOCC) criterion, relates entanglement families to the interaction length of Hamiltonians. In this manner, we establish a connection between entanglement classification and condensed matter models from a quantum information perspective. Moreover, we introduce a scalable nesting property for the proposed entanglement classification, in which the families for
                N
                parties carry over to the
                N
                 + 1 case. Finally, using techniques from algebraic geometry, we prove that the minimal nontrivial interaction length
