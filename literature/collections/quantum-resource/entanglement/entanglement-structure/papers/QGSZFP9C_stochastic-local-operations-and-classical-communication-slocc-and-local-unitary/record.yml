item_type: journalArticle
title: Stochastic local operations and classical communication (SLOCC) and local
  unitary operations (LU) classifications of n qubits via ranks and singular
  values of the spin-flipping matrices
authors:
  - first: Dafa
    last: Li
year: 2018
abstract: In this paper, from the coeﬃcient matrices of states of n qubits we
  construct the ℓ-spin-ﬂipping matrices and show that the ℓ-spin-ﬂipping
  matrices are congruent and unitary congruent under SLOCC and LU, respectively.
  Thus, the ranks and the singular values of the ℓ-spin-ﬂipping matrices are
  invariant under SLOCC and LU, respectively.
