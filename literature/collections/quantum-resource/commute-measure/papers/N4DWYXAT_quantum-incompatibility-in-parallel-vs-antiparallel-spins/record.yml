year: 2026
abstract: We explore the joint measurability of incompatible qubit observables
  on ensembles of parallel and antiparallel spin-1/2 pairs. In parallel
  configuration, both spins are prepared in the same state, whereas in
  antiparallel case, each spin is paired with its flipped counterpart. We show
  that the antiparallel configuration uniquely enables exact simultaneous
  prediction of three mutually orthogonal spin components -- an advantage not
  achievable with parallel states. Extending beyond three observables, we
  examine joint measurability for larger sets of spin measurements and further
  generalize our analysis to state configurations beyond the parallel and
  antiparallel cases. As we show, our results reveal a deep connection to the
  'mean King retrodiction task' proposed by Vaidman, Aharonov, and Albert, and
  have implications for a cryptographic protocol introduced by Jeffrey Bub. We
  further demonstrate how the enhanced compatibility in the antiparallel
  configuration can facilitate efficient estimation of unknown measurement
  devices. Finally, we discuss prospects for experimentally realizing the
  enhanced measurement compatibility in antiparallel configuration by analyzing
  the effect on finite sub-ensembles of states.
