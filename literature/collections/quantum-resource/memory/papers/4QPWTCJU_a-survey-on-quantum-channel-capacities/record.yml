title: A Survey on Quantum Channel Capacities
authors:
  - first: Laszlo
    last: Gyongyosi
  - first: Sandor
    last: Imre
  - first: Hung Viet
    last: Nguyen
year: 2018
abstract: Quantum information processing exploits the quantum nature of
  information. It offers fundamentally new solutions in the ﬁeld of computer
  science and extends the possibilities to a level that cannot be imagined in
  classical communication systems. For quantum communication channels, many new
  capacity deﬁnitions were developed in comparison to classical counterparts. A
  quantum channel can be used to realize classical information transmission or
  to deliver quantum information, such as quantum entanglement. Here we review
  the properties of the quantum communication channel, the various capacity
  measures and the fundamental differences between the classical and quantum
  channels.
