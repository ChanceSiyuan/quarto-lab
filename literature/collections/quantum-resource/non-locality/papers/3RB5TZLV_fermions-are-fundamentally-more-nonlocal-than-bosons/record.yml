year: 2026
abstract: "Bell's theorem shows that entangled quantum particles can exhibit
  correlations that classical particles cannot reproduce without an additional
  nonlocal resource, such as communication. In this sense, quantum particles are
  fundamentally more nonlocal than classical ones, and entanglement becomes
  unavoidable in physics. Here we prove the analogous result within quantum
  theory itself: indistinguishable fermions transmitted through a quantum
  network can generate correlations that distinguishable particles or
  indistinguishable bosons cannot reproduce without additional communication. In
  the same sense, fermions are fundamentally more nonlocal than bosons or
  distinguishable particles, motivating fermionic anticommutation and
  indistinguishability as unavoidable operational resources. Our result further
  implies that fermions can strictly surpass all qubit-based protocols for
  certain distributed computing tasks, demonstrating that a complete
  understanding of information processing requires going beyond qubits to
  fermionic information carriers - febits."
