item_type: journalArticle
title: Entanglement – nonstabilizerness separation in hybrid quantum circuits
authors:
  - first: Gerald E.
    last: Fux
  - first: Emanuele
    last: Tirrito
  - first: Marcello
    last: Dalmonte
  - first: Rosario
    last: Fazio
year: 2024
abstract: >-
  Nonstabilizerness describes the distance of a quantum state to its closest
  stabilizer state. It is—like entanglement—a necessary resource for a quantum
  advantage over classical computing. We study nonstabilizerness, quantified by
  stabilizer entropy, in a hybrid quantum circuit with projective measurements
  and a controlled injection of non-Clifford resources. We discover a phase
  transition between a power law and constant scaling of nonstabilizerness with
  system size controlled by the rate of measurements. The same circuit also
  exhibits a phase transition in entanglement that appears, however, at a
  different critical measurement rate. This mechanism shows how, from the
  viewpoint of a quantum advantage, hybrid circuits can host multiple distinct
  transitions where not only entanglement, but also other nonlinear properties
  of the density matrix come into play.
              
                
                
                  
                    Published by the American Physical Society
                    2024
