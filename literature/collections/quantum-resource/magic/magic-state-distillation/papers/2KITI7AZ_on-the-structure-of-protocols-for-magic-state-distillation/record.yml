item_type: preprint
title: On the Structure of Protocols for Magic State Distillation
authors:
  - first: Earl T.
    last: Campbell
  - first: Dan E.
    last: Browne
year: 2009
abstract: We present a theorem that shows that all useful protocols for magic
  state distillation output states with a fidelity that is upper-bounded by
  those generated by a much smaller class of protocols. This reduced class
  consists of the protocols where multiple copies of a state are projected onto
  a stabilizer codespace and the logical qubit is then decoded.
