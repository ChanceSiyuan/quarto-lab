year: 2023
abstract: "Notions of so-called magic quantify how non-classical quantum states
  are in a precise sense: low values of magic preclude quantum advantage; they
  also play a key role in quantum error correction. In this work, we introduce
  the phenomenon of 'pseudomagic' -- wherein certain ensembles of quantum states
  with low magic are computationally indistinguishable from quantum states with
  high magic. Previously, such computational indistinguishability has been
  studied with respect to entanglement, by introducing the notion of
  pseudoentanglement. However, we show that pseudomagic neither follows from
  pseudoentanglement, nor implies it. In terms of applications, pseudomagic
  sheds new light on the theory of quantum chaos: it reveals the existence of
  states that, although built from non-chaotic unitaries, cannot be
  distinguished from random chaotic states by any physical observer. Further
  applications include new lower bounds on state synthesis problems, property
  testing protocols, as well as implications for quantum cryptography. Our
  results have the conceptual implication that magic is a 'hide-able' property
  of quantum states: some states have a lot more magic than meets the
  (computationally-bounded) eye. From the physics perspective, it advocates the
  mindset that the only physical properties that can be measured in a laboratory
  are those that are efficiently computationally detectable."
