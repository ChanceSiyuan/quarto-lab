year: 2014
abstract: Recent results on the non-universality of fault-tolerant gate sets
  underline the critical role of resource states, such as magic states, to power
  scalable, universal quantum computation. Here we develop a resource theory,
  analogous to the theory of entanglement, that is relevant for fault-tolerant
  stabilizer computation. We introduce two quantitative measures—monotones—for
  the amount of non-stabilizer resource. As an application we give absolute
  bounds on the efﬁciency of magic state distillation. One of these monotones is
  the sum of the negative entries of the discrete Wigner representation of a
  quantum state, thereby resolving a long-standing open question of whether the
  degree of negativity in a quasi-probability representation is an operationally
  meaningful indicator of quantum behavior.
