item_type: preprint
title: Stabilizer entropies are monotones for magic-state resource theory
authors:
  - first: Lorenzo
    last: Leone
  - first: Lennart
    last: Bittel
year: 2024
abstract: We establish the monotonicity of stabilizer entropies for $\alpha\geq
  2$ within the context of magic-state resource theory restricted to pure
  states. Additionally, we show that linear stabilizer entropies serve as strong
  monotones. Furthermore, we provide the extension to mixed states of stabilizer
  entropies as magic monotones through convex roof constructions.
