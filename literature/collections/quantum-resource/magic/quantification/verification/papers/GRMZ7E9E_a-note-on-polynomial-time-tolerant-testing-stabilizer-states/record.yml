item_type: preprint
title: A note on polynomial-time tolerant testing stabilizer states
authors:
  - first: Srinivasan
    last: Arunachalam
  - first: Sergey
    last: Bravyi
  - first: Arkopal
    last: Dutt
year: 2024
abstract: "We show an improved inverse theorem for the Gowers-$3$ norm of
  $n$-qubit quantum states $|\\psi\\rangle$ which states that: for every
  $\\gamma\\geq 0$, if the $\\textsf{Gowers}(|\\psi \\rangle,3)^8 \\geq \\gamma$
  then the stabilizer fidelity of $|\\psi\\rangle$ is at least $\\gamma^C$ for
  some constant $C>1$. This implies a constant-sample polynomial-time tolerant
  testing algorithm for stabilizer states which accepts if an unknown state is
  $\\varepsilon_1$-close to a stabilizer state in fidelity and rejects when
  $|\\psi\\rangle$ is $\\varepsilon_2 \\leq \\varepsilon_1^C$-far from all
  stabilizer states, promised one of them is the case."
