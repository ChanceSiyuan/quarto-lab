year: 2023
abstract: We introduce systematic protocols to perform stabilizer testing for
  quantum states and gates. These protocols are based on quantum convolutions
  and swap-tests, realized by quantum circuits that implement the quantum
  convolution for both qubit and qudit systems. We also introduce ''magic
  entropy'' to quantify magic in quantum states and gates, in a way which may be
  measurable experimentally.
