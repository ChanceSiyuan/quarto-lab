item_type: preprint
title: Tolerant testing stabilizer states
authors:
  - first: Srinivasan
    last: Arunachalam
  - first: Arkopal
    last: Dutt
year: 2024
abstract: "We consider the following task: suppose an algorithm is given copies
  of an unknown $n$-qubit quantum state $|\\psi\\rangle$ promised $(i)$
  $|\\psi\\rangle$ is $\\varepsilon_1$-close to a stabilizer state in fidelity
  or $(ii)$ $|\\psi\\rangle$ is $\\varepsilon_2$-far from all stabilizer states,
  decide which is the case. We give a $\\textsf{poly}(1/\\varepsilon_1)$-sample
  and $n\\cdot \\textsf{poly}(1/\\varepsilon_1)$-time algorithm for this task
  for every $\\varepsilon_1>0$ and $\\varepsilon_2\\leq
  2^{-\\textsf{poly}(1/\\varepsilon_1)}$. Our proof includes a new definition of
  Gowers norm for quantum states, an inverse theorem for the Gowers-$3$ norm of
  states and new bounds on stabilizer covering for structured subsets of Paulis
  using results in additive combinatorics."
