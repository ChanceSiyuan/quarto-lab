item_type: preprint
title: A Simple Proof that Toffoli and Hadamard are Quantum Universal
authors:
  - first: Dorit
    last: Aharonov
year: 2003
abstract: Recently Shi [15] proved that Toﬀoli and Hadamard are universal for
  quantum computation. This is perhaps the simplest universal set of gates that
  one can hope for, conceptually; It shows that one only needs to add the
  Hadamard gate to make a ’classical’ set of gates quantum universal. In this
  note we give a few lines proof of this fact relying on Kitaev’s universal set
  of gates [11], and discuss the meaning of the result.
