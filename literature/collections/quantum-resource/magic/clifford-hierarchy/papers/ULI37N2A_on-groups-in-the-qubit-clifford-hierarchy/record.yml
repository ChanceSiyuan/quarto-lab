item_type: preprint
title: On Groups in the Qubit Clifford Hierarchy
authors:
  - first: Jonas T.
    last: Anderson
year: 2022
abstract: Here we study the unitary groups that can be constructed using
  elements from the qubit Clifford Hierarchy. We first provide a necessary and
  sufficient canonical form that semi-Clifford and generalized semi-Clifford
  elements must satisfy to be in the Clifford Hierarchy. Then we classify the
  groups that can be formed from such elements. Up to Clifford conjugation, we
  classify all such groups that can be constructed using generalized
  semi-Clifford elements in the Clifford Hierarchy. We discuss a possible minor
  exception to this classification in the appendix. This may not be a full
  classification of all groups in the qubit Clifford Hierarchy as it is not
  currently known if all elements in the Clifford Hierarchy must be generalized
  semi-Clifford. In addition to the diagonal gate groups found by Cui et al., we
  show that many non-isomorphic (to the diagonal gate groups) generalized
  symmetric groups are also contained in the Clifford Hierarchy. Finally, as an
  application of this classification, we examine restrictions on transversal
  gates given by the structure of the groups enumerated herein which may be of
  independent interest.
