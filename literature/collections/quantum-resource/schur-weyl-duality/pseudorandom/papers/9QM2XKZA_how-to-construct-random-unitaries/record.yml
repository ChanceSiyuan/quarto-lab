item_type: preprint
title: How to Construct Random Unitaries
authors:
  - first: Fermi
    last: Ma
  - first: Hsin-Yuan
    last: Huang
year: 2025
abstract: The existence of pseudorandom unitaries (PRUs)—efficient quantum
  circuits that are computationally indistinguishable from Haar-random
  unitaries—has been a central open question, with significant implications for
  cryptography, complexity theory, and fundamental physics. In this work, we
  close this question by proving that PRUs exist, assuming that any
  quantum-secure one-way function exists. We establish this result for both (1)
  the standard notion of PRUs, which are secure against any efficient adversary
  that makes queries to the unitary 𝑈 , and (2) a stronger notion of PRUs,
  which are secure even against adversaries that can query both the unitary 𝑈
  and its inverse 𝑈 †. In the process, we prove that any algorithm that makes
  queries to a Haar-random unitary can be efficiently simulated on a quantum
  computer, up to inverse-exponential trace distance.
