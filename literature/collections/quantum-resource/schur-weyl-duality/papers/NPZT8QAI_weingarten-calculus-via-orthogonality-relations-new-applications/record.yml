item_type: preprint
title: "Weingarten calculus via orthogonality relations: new applications"
authors:
  - first: Benoît
    last: Collins
  - first: Sho
    last: Matsumoto
year: 2017
abstract: "Weingarten calculus is a completely general and explicit method to
  compute the moments of the Haar measure on compact subgroups of matrix
  algebras. Particular cases of this calculus were initiated by theoretical
  physicists -- including Weingarten, after whom this calculus was coined by the
  first author, after investigating it systematically. Substantial progress was
  achieved subsequently by the second author and coworkers, based on
  representation theoretic and combinatorial techniques. All formulas of
  `Weingarten calculus' are in the spirit of Weingarten's seminal paper [W78].
  However, modern proofs are very different from Weingarten's initial ideas. In
  this paper, we revisit Weingarten's initial proof and we illustrate its power
  by uncovering two new important applications: (i) a uniform bound on the
  Weingarten function, that subsumes existing uniform bounds, and is optimal up
  to a polynomial factor, and (ii) an extension of Weingarten calculus to
  symmetric spaces and conceptual proofs of identities established by the second
  author."
