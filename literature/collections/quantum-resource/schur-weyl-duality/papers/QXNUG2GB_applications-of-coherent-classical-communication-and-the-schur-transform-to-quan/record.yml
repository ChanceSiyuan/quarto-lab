title: Applications of coherent classical communication and the Schur transform
  to quantum information theory
authors:
  - first: Aram Wettroth
    last: Harrow
year: null
abstract: Quantum mechanics has led not only to new physical theories, but also
  a new understanding of information and computation. Quantum information not
  only yields new methods for achieving classical tasks such as factoring and
  key distribution but also suggests a completely new set of quantum problems,
  such as sending quantum information over quantum channels or eﬃciently
  performing particular basis changes on a quantum computer. This thesis
  contributes two new, purely quantum, tools to quantum information
  theory—coherent classical communication in the ﬁrst half and an eﬃcient
  quantum circuit for the Schur transform in the second half.
