title: Learning and testing quantum states via probabilistic combinatorics and
  representation theory
authors:
  - first: Ryan
    last: O’Donnell
  - first: John
    last: Wright
year: 2021
abstract: In this survey, we give an introduction to the problem of learning and
  testing quantum states from multiple copies. Special attention is paid to the
  tasks of estimating the eigenvalues of an unknown state, testing whether a
  state is maximally mixed, and performing full quantum state tomography. We
  focus on the representation theory-based approached, developed in [ARS88,
  KW01, HM02, Har05, Key06, CM06, Chr06, CHW07, MW16, OW21, OW16, HHJ+17, OW17,
  BOW19, CLM+21, AISW19] and elsewhere. Examining this approach also leads to
  interesting new developments regarding the probabilistic combinatorics of
  longest increasing subsequences.
