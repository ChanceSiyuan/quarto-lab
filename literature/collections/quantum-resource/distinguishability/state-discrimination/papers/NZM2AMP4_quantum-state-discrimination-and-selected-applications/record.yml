title: Quantum state discrimination and selected applications
authors:
  - first: János A
    last: Bergou
year: 2007
abstract: Determining the state of a quantum system is a central task in quantum
  information processing since it encompasses the read-out problem. Very often
  the optimized state discrimination strategy is a generalized measurement
  (Positive Operator Valued Measure, POVM). Therefore, we begin with a brief
  introduction to the theory of generalized measurements and illustrate the
  power of the concept on examples relevant to applications in quantum
  cryptography.
