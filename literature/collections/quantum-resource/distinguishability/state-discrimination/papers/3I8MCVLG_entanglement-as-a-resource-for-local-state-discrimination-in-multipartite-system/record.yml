item_type: journalArticle
title: Entanglement as a resource for local state discrimination in multipartite
  systems
authors:
  - first: Somshubhro
    last: Bandyopadhyay
  - first: Saronath
    last: Halder
  - first: Michael
    last: Nathanson
year: 2016
abstract: We explore the question of using an entangled state as a universal
  resource for implementing quantum measurements by local operations and
  classical communication (LOCC). We show that for most systems consisting of
  three or more subsystems, there is no entangled state from the same space that
  can enable all measurements by LOCC. This is in direct contrast to the
  bipartite case, where a maximally entangled state is an universal resource.
  Our results are obtained showing an equivalence between the problem of local
  state transformation and that of entanglement-assisted local unambiguous state
  discrimination.
