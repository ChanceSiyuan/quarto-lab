title: Statistical Methods for Quantum State Verification and Fidelity Estimation
authors:
  - first: Xiao-Dong
    last: Yu
  - first: Jiangwei
    last: Shang
  - first: Otfried
    last: Gühne
year: 2022
abstract: The efficient and reliable certification of quantum states is
  essential for various quantum information processing tasks as well as for the
  general progress on the implementation of quantum technologies. In the last
  few years several methods have been introduced which use advanced statistical
  methods to certify quantum states in a resource-efficient manner. In this
  article we present a review of the recent progress in this field. We first
  explain how the verification and fidelity estimation of a quantum state can be
  discussed in the language of hypothesis testing. Then, we explain in detail
  various strategies for the verification of entangled states with local
  measurements or measurements assisted by local operations and classical
  communication. Finally, we discuss several extensions of the problem, such as
  the certification of quantum channels and the verification of entanglement.
