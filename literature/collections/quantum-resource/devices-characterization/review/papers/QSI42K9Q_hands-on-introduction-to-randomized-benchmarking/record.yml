year: 2024
abstract: The goal of this tutorial is to provide an overview of the main
  principles behind randomized benchmarking techniques. A newcomer to the field
  faces the challenge that a considerable amount of background knowledge is
  required to get familiar with the topic. Our purpose is to ease this process
  by providing a pedagogical introduction to randomized benchmarking. Every
  chapter is supplemented with an accompanying Python notebook, illustrating the
  essential steps of each protocol.
