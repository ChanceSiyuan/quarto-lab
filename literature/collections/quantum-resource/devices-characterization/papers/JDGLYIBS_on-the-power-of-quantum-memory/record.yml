item_type: journalArticle
title: On the Power of Quantum Memory
authors:
  - first: Robert
    last: Koenig
  - first: Ueli
    last: Maurer
  - first: Renato
    last: Renner
year: 2005
abstract: We address the question whether quantum memory is more powerful than
  classical memory. In particular, we consider a setting where information about
  a random n-bit string X is stored in s classical or quantum bits, for s < n,
  i.e., the stored information is bound to be only partial. Later, a randomly
  chosen predicate F about X has to be guessed using only the stored
  information. The maximum probability of correctly guessing F (X) is then
  compared for the cases where the storage device is classical or quantum
  mechanical, respectively. We show that, despite the fact that the measurement
  of quantum bits can depend arbitrarily on the predicate F , the quantum
  advantage is negligible already for small values of the difference n − s. Our
  setting generalizes the setting of Ambainis et al. who considered the problem
  of guessing an arbitrary bit (i.e., one of the n bits) of X.
