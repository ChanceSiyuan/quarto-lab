item_type: preprint
title: "Quantum Resources in Non-Abelian Lattice Gauge Theories:
  Nonstabilizerness, Multipartite Entanglement, and Fermionic Non-Gaussianity"
authors:
  - first: Gopal Chandra
    last: Santra
  - first: Julius
    last: Mildenberger
  - first: Edoardo
    last: Ballini
  - first: Alberto
    last: Bottarelli
  - first: Matteo M.
    last: Wauters
  - first: Philipp
    last: Hauke
year: 2025
abstract: Lattice gauge theories (LGTs) represent one of the most ambitious
  goals of quantum simulation. From a practical implementation perspective,
  non-Abelian theories present significantly tougher challenges than Abelian
  LGTs. However, it is unknown whether this is also reflected in increased
  values of quantum resources relating to the complexity of simulating quantum
  many-body models. Here, we compare three paradigmatic measures of quantum
  resources -- stabilizer Rényi entropy, generalized geometric measure of
  entanglement, and fermionic antiflatness -- for pure-gauge theories on a
  ladder with Abelian $\mathbb{Z}_N$ as well as non-Abelian $D_3$ and SU(2)
  gauge symmetries. We find that non-Abelian symmetries are not necessarily
  inherently harder to simulate than Abelian ones, but rather the required
  quantum resources depend nontrivially on the interplay between the group
  structure, superselection sector, and encoding of the gauge constraints. Our
  findings help indicate where quantum advantage could emerge in simulations of
  LGTs, both in NISQ and fault-tolerant eras.
