title: Tensor Network Simulation of compact one-dimensional lattice Quantum
  Chromodynamics at finite density
authors:
  - first: Pietro
    last: Silvi
  - first: Yannick
    last: Sauer
  - first: Ferdinand
    last: Tschirsich
  - first: Simone
    last: Montangero
year: 2019
abstract: "We perform a zero temperature analysis of a non-Abelian lattice gauge
  model corresponding to an SU(3) Yang Mills theory in 1+1D at low energies.
  Specifically, we characterize the model ground states via gauge-invariant
  Matrix Product States, identifying its phase diagram at finite density as a
  function of the matter-gauge interaction coupling, the quark filling, and
  their bare mass. Overall, we observe an extreme robustness of baryons: For
  positive free-field energy couplings, all detected phases exhibit colorless
  quasiparticles, a strong numerical hint that QCD does not deconfine in 1D.
  Additionally, we show that having access to finite-density properties, it is
  possible to study the stability of composite particles, including multi-baryon
  bound states, such as the deuteron."
