title: "Quantum spin liquids: a review"
authors:
  - first: Lucile
    last: Savary
  - first: Leon
    last: Balents
year: 2017
abstract: Quantum spin liquids may be considered ‘quantum disordered’ ground
  states of spin systems, in which zero-point fluctuations are so strong that
  they prevent conventional magnetic longrange order. More interestingly,
  quantum spin liquids are prototypical examples of ground states with massive
  many-body entanglement, which is of a degree sufficient to render these states
  distinct phases of matter. Their highly entangled nature imbues quantum spin
  liquids with unique physical aspects, such as non-local excitations,
  topological properties, and more. In this review, we discuss the nature of
  such phases and their properties based on paradigmatic models and general
  arguments, and introduce theoretical technology such as gauge theory and
  partons, which are conveniently used in the study of quantum spin liquids. An
  overview is given of the different types of quantum spin liquids and the
  models and theories used to describe them. We also provide a guide to the
  current status of experiments in relation to study quantum spin liquids, and
  to the diverse probes used therein.
