title: Mesons in a quantum Ising ladder
authors:
  - first: Yunjing
    last: Gao
  - first: Yunfeng
    last: Jiang
  - first: Jianda
    last: Wu
year: 2025
abstract: When two transverse-field Ising chains (TFICs) with magnetic order are
  coupled, the original free excitations become confined, giving rise to
  meson-like bound states. In this work, we study such bound states
  systematically. The mesons are characterized by their fermion number parity
  and chain-exchanging properties, which lead to distinct sets of mesonic
  states. The meson masses are determined by solving the Bethe-Salpter equation.
  An interesting observation is the additional degeneracy in the
  chain-exchanging odd sectors. Beyond the two particle approximation, we
  exploit the truncated free fermionic space approach to calculate the spectrum
  numerically. Corrections to the meson masses are obtained, and the degeneracy
  is further confirmed. The characterization and degeneracy can be connected to
  the situation when each chain is tuned to be quantum critical, where the
  system is described by the Ising$_h^2$ integrable model, a sine-Gordon theory
  with $\mathbb{Z}_2$ orbifold. Here we establish a clear correspondence between
  the particles in the bosonized form and their fermionic counterparts. Near
  this point, the stability of these particles is analyzed using the form factor
  perturbation scheme, where four particles are always present. Additionally, we
  calculate the evolution of the dominant dynamical structure factor for local
  spin operators, providing further insight into the low-energy excitations and
  their role in the system's behavior. The two-particle confinement framework as
  well as the parity classifications may inspire the study for other coupled
  bi-partite systems.
