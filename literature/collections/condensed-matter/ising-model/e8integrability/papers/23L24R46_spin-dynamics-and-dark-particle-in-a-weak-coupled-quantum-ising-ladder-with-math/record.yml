year: 2024
abstract: Emergent Ising$_h^2$ integrability is anticipated in a quantum Ising
  ladder composed of two weakly coupled, critical transverse field Ising chains.
  This integrable system is remarkable for including eight types of massive
  relativistic particles, with their scattering matrix and spectrum
  characterized by the $\mathcal{D}_8^{(1)}$ Lie algebra. In this article we
  delve into the zero-temperature spin dynamics of this integrable quantum Ising
  ladder. By computing the dynamical structure factors from analytical form
  factor approach, we clearly identify dispersive single-particle excitations of
  (anti-) soliton and breathers as well as their multi-particle continua in the
  spin dynamical spectrum. We show that the selection rule to the form factor,
  which is inherent in the intrinsic charge-parity $\mathcal{C}$ of the
  Ising$_h^2$ particles as well as the local spin operators, causes a
  significant result that $\mathcal{C}$-odd particles, termed as dark particles,
  cannot be directly excited from the ground state through any local or
  quasi-local operations. Furthermore, the lightest dark particle is proposed to
  be generated and controlled through resonant absorption-resonant emission
  processes. The long lifetime of dark particle suggests its potential as a
  stable qubit for advancing quantum information technology.
