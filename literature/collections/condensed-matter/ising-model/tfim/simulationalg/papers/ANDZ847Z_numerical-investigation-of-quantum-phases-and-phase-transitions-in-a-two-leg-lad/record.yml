abstract: >-
  Experiments on chains of Rydberg atoms appear as a playground to study quantum
  phase transitions in 1D. As a natural extension, we report a quantitative
  ground-state phase diagram of Rydberg atoms arranged in a two-leg ladder
  interacting via van der Waals potential. We address this problem numerically,
  using the density matrix renormalization group algorithm. Our results suggest
