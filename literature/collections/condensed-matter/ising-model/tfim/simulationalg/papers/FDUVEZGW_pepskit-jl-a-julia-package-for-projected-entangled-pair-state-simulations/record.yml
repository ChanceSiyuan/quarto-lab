year: 2026
abstract: We present PEPSKit.jl, a Julia package for simulating two-dimensional
  quantum many-body systems with infinite projected entangled-pair states
  (iPEPS). PEPSKit.jl builds on the TensorKit.jl package for tensor computations
  and provides high-level algorithms for iPEPS simulations that support both
  Abelian and non-Abelian symmetries, as well as fermionic systems. This work
  gives an overview of the main package features, which include support for
  ground-state, time-evolution, and finite-temperature simulations in systems
  with different physical symmetries and lattice geometries. These capabilities
  are illustrated through various examples and technical benchmarks.
