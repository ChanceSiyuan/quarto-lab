item_type: journalArticle
title: Fractional quantum Hall effect and nonabelian statistics
authors:
  - first: N.
    last: Read
  - first: G.
    last: Moore
year: 1992
abstract: It is argued that fractional quantum Hall effect wavefunctions can be
  interpreted as conformal blocks of two-dimensional conformal field theory.
  Fractional statistics can be extended to nonabelian statistics and examples
  can be constructed from conformal field theory. The Pfaffian state is related
  to the 2D Ising model and possesses fractionally charged excitations which are
  predicted to obey nonabelian statistics.
