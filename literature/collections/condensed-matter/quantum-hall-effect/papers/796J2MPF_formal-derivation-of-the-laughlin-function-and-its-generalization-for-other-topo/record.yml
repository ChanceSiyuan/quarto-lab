item_type: journalArticle
title: Formal derivation of the Laughlin function and its generalization for
  other topological phases of FQHE
authors:
  - first: Janusz E.
    last: Jacak
year: 2022
abstract: >-
  Abstract
              
                Using the braid symmetry we demonstrate the derivation of the Laughlin function for the main hierarchy 1/
                q
                of FQHE in the lowest Landau level of two-dimensional electron system with a mathematical rigour. This proves that the derivation of Laughlin function unavoidably requires some topological elements and cannot be completed within a local quantum mechanics, i.e., without global topological constraints imposed. The method shows the way for the generalization of this function onto other fractions from the general quantum Hall hierarchy. A generalization of the Laughlin function is here formulated.
