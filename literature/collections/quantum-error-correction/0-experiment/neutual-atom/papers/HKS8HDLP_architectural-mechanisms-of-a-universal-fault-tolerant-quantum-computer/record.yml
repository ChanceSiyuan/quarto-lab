abstract: Quantum error correction (QEC) is believed to be essential for the
  realization of large-scale quantum computers. However, due to the complexity
  of operating on the encoded `logical' qubits, understanding the physical
  principles for building fault-tolerant quantum devices and combining them into
  efficient architectures is an outstanding scientific challenge. Here we
  utilize reconfigurable arrays of up to 448 neutral atoms to implement all key
  elements of a universal, fault-tolerant quantum processing architecture and
  experimentally explore their underlying working mechanisms. We first employ
  surface codes to study how repeated QEC suppresses errors, demonstrating
  2.14(13)x below-threshold performance in a four-round characterization circuit
  by leveraging atom loss detection and machine learning decoding. We then
  investigate logical entanglement using transversal gates and lattice surgery,
  and extend it to universal logic through transversal teleportation with 3D
  [[15,1,3]] codes, enabling arbitrary-angle synthesis with logarithmic
  overhead. Finally, we develop mid-circuit qubit re-use, increasing
  experimental cycle rates by two orders of magnitude and enabling deep-circuit
  protocols with dozens of logical qubits and hundreds of logical teleportations
  with [[7,1,3]] and high-rate [[16,6,4]] codes while maintaining constant
  internal entropy. Our experiments reveal key principles for efficient
  architecture design, involving the interplay between quantum logic and entropy
  removal, judiciously using physical entanglement in logic gates and magic
  state generation, and leveraging teleportations for universality and physical
  qubit reset. These results establish foundations for scalable, universal
  error-corrected processing and its practical implementation with neutral atom
  systems.
