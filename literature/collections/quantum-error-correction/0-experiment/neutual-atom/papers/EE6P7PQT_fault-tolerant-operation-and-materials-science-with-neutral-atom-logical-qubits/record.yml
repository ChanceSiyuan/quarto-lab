year: 2024
abstract: We report on the fault-tolerant operation of logical qubits on a
  neutral atom quantum computer, with logical performance surpassing physical
  performance for multiple circuits including Bell states (12x error reduction),
  random circuits (15x), and a prototype Anderson Impurity Model ground state
  solver for materials science applications (up to 6x, non-fault-tolerantly).
  The logical qubits are implemented via the [[4, 2, 2]] code (C4). Our work
  constitutes the first complete realization of the benchmarking protocol
  proposed by Gottesman 2016 [1] demonstrating results consistent with
  fault-tolerance. In light of recent advances on applying concatenated C4/C6
  detection codes to achieve error correction with high code rates and
  thresholds, our work can be regarded as a building block towards a practical
  scheme for fault tolerant quantum computation. Our demonstration of a
  materials science application with logical qubits particularly demonstrates
  the immediate value of these techniques on current experiments.
