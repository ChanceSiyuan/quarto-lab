title: Effective fault-tolerant quantum computation with slow measurements
authors:
  - first: David P.
    last: DiVincenzo
  - first: Panos
    last: Aliferis
year: 2007
abstract: How important is fast measurement for fault-tolerant quantum
  computation? Using a combination of existing and new ideas, we argue that
  measurement times as long as even 1,000 gate times or more have a very minimal
  effect on the quantum accuracy threshold. This shows that slow measurement,
  which appears to be unavoidable in many implementations of quantum computing,
  poses no essential obstacle to scalability.
