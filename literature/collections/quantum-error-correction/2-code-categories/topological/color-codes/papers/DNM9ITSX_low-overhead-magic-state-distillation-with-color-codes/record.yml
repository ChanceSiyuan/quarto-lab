year: 2025
abstract: Fault-tolerant implementation of non-Clifford gates is a major
  challenge for achieving universal fault-tolerant quantum computing with
  quantum error-correcting codes. Magic state distillation is the most
  well-studied method for this but requires significant resources. Hence, it is
  crucial to tailor and optimize magic state distillation for specific codes
  from both logical- and physical-level perspectives. In this work, we perform
  such optimization for two-dimensional color codes, which are promising due to
  their higher encoding rates compared to surface codes, transversal
  implementation of Clifford gates, and efficient lattice surgery. We propose
  two carefully designed distillation schemes based on the 15-to-1 distillation
  circuit and lattice surgery, differing in their methods for handling faulty
  rotations. Our first scheme employs faulty T-measurement, achieving
  infidelities of $O(p^3)$ for physical noise strength $p$. To achieve lower
  infidelities, our second scheme integrates distillation with `cultivation' (a
  distillation-free approach to fault-tolerantly prepare magic states through
  transversal Clifford measurements). Our second scheme achieves significantly
  lower infidelities (e.g., $\sim 2 \times 10^{-16}$ at $p = 10^{-3}$),
  surpassing the capabilities of both cultivation and single-level distillation.
  Notably, to reach a given target infidelity, our schemes require approximately
  two orders of magnitude fewer resources than the previous best magic state
  distillation schemes for color codes.
