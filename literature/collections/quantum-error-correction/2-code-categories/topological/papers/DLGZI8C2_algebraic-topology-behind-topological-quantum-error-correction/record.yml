title: Algebraic Topology behind Topological Quantum Error Correction
authors:
  - first: Xiang
    last: Zou
  - first: Hoi-Kwong
    last: Lo
year: null
abstract: Quantum error correction (QEC) is crucial for achieving fault-tolerant
  quantum computation (FTQC) and secure quantum communication, while topological
  quantum error correction (TQEC) has the most experimental successes among the
  various QEC paradigms. In this paper, we develop a generalized theoretical
  framework of TQEC for future applications. We show that TQEC works for both
  orientable and non-orientable surfaces. Finally, we apply these principles to
  construct new codes and simulate the performance of TQEC codes on the Klein
  bottle K and evaluate their efficacy for QEC. This work proposes broader
  classes of codes and demonstrates their theoretical and practical potential,
  which is a step forward in achieving FTQC.
