item_type: preprint
title: Cleaner magic states with hook injection
authors:
  - first: Craig
    last: Gidney
year: 2023
abstract: In this paper, I show how an intentional hook error mechanism can be
  used as a control knob for injecting magic states into surface codes. The
  limitation, and benefit, of this approach is that it can only inject states in
  the XY or YZ plane of the Bloch sphere. This increases fidelity, because
  perturbations out of the target plane can be detected as errors. I use Monte
  Carlo sampling to show that this technique outperforms previous injection
  techniques, achieving lower error rates at smaller spacetime cost under
  digitized circuit noise.
