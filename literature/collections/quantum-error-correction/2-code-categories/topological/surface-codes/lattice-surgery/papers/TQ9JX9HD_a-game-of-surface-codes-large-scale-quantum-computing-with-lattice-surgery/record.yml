item_type: journalArticle
title: "A Game of Surface Codes: Large-Scale Quantum Computing with Lattice Surgery"
authors:
  - first: Daniel
    last: Litinski
year: 2019
abstract: Given a quantum gate circuit, how does one execute it in a
  fault-tolerant architecture with as little overhead as possible? In this
  paper, we discuss strategies for surface-code quantum computing on small,
  intermediate and large scales. They are strategies for space-time trade-offs,
  going from slow computations using few qubits to fast computations using many
  qubits. Our schemes are based on surface-code patches, which not only feature
  a low space cost compared to other surface-code schemes, but are also
  conceptually simple~--~simple enough that they can be described as a
  tile-based game with a small set of rules. Therefore, no knowledge of quantum
  error correction is necessary to understand the schemes in this paper, but
  only the concepts of qubits and measurements.
