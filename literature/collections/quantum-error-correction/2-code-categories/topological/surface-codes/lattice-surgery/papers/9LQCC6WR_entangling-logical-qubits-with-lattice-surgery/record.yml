year: 2021
abstract: Future quantum computers will require quantum error correction for
  faithful operation. The correction capabilities come with an overhead for
  performing fault-tolerant logical operations on the encoded qubits. One of the
  most resource efficient ways to implement logical operations is lattice
  surgery, where groups of physical qubits, arranged on lattices, can be merged
  and split to realize entangling gates and teleport logical information. Here,
  we report on the experimental realization of lattice surgery between two
  topologically encoded qubits in a 10-qubit ion trap quantum information
  processor. In particular, we demonstrate entanglement between two logical
  qubits and we implement logical state teleportation.
