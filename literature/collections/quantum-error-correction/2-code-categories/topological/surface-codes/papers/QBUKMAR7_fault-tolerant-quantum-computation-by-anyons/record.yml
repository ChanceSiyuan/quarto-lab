item_type: journalArticle
title: Fault-tolerant quantum computation by anyons
authors:
  - first: A. Yu
    last: Kitaev
year: 2003
abstract: A two-dimensional quantum system with anyonic excitations can be
  considered as a quantum computer. Unitary transformations can be performed by
  moving the excitations around each other. Measurements can be performed by
  joining excitations in pairs and observing the result of fusion. Such
  computation is fault-tolerant by its physical nature.
