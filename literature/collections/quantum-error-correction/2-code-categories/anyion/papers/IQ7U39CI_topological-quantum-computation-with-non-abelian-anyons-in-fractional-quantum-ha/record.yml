item_type: preprint
title: Topological Quantum Computation with Non-Abelian Anyons in Fractional
  Quantum Hall States
authors:
  - first: Lachezar S.
    last: Georgiev
year: 2016
abstract: We review the general strategy of topologically protected quantum
  information processing based on non-Abelian anyons, in which quantum
  information is encoded into the fusion channels of pairs of anyons and in
  fusion paths for multi-anyon states, realized in two-dimensional fractional
  quantum Hall systems. The quantum gates which are needed for the quantum
  information processing in these multi-qubit registers are implemented by
  exchange or braiding of the non-Abelian anyons that are at fixed positions in
  two-dimensional coordinate space. As an example we consider the Pfaffian
  topological quantum computer based on the fractional quantum Hall state with
  filling factor $\nu_H=5/2$. The elementary qubits are constructed by
  localizing Ising anyons on fractional quantum Hall antidots and various
  quantum gates, such as the Hadamard gate, phase gates and CNOT, are explicitly
  realized by braiding. We also discuss the appropriate experimental signatures
  which could eventually be used to detect non-Abelian anyons in Coulomb
  blockaded quantum Hall islands.
