title: The Not-So-Secret Fourth Parameter of Quantum Codes
authors:
  - first: Eric
    last: Kubischta
  - first: Ian
    last: Teixeira
year: 2024
abstract: The group of transversal gates is an invariant of quantum codes. With
  respect to this parameter, we demonstrate that non-additive codes can strictly
  outperform stabilizer codes, and often by large margins. We do this by
  constructing spin codes that corresponds to permutationally invariant
  multiqubit codes implementing generalized phase gates transversally. Of
  particular note, we construct codes that implement a transversal $ T $ gate
  using fewer qubits and with a better minimum distance than is possible with
  any stabilizer code.
