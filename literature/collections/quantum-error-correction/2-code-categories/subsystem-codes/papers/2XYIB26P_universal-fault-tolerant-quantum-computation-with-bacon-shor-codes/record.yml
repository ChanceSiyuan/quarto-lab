item_type: preprint
title: Universal fault-tolerant quantum computation with Bacon-Shor codes
authors:
  - first: Theodore J.
    last: Yoder
year: 2017
abstract: We present a fault-tolerant universal gate set consisting of Hadamard
  and controlled-controlled-Z (CCZ) on Bacon-Shor subsystem codes. Transversal
  non-Clifford gates on these codes are intriguing in that higher levels of the
  Clifford hierarchy become accessible as the code becomes more asymmetric. For
  instance, in an appropriate gauge, Bacon-Shor codes on an $m\times m^k$
  lattice have transversal $k$-qubit-controlled $Z$. Through a variety of
  tricks, including intermediate error-correction and non-Pauli recovery, we
  reduce the overhead required for fault-tolerant CCZ. We calculate
  pseudothresholds for our universal gate set on the smallest $3\times3$
  Bacon-Shor code and also compare our gates with magic-states within the
  framework of a proposed ion trap architecture.
