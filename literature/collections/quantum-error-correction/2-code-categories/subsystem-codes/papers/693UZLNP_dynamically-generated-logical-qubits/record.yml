title: Dynamically Generated Logical Qubits
authors:
  - first: Matthew B.
    last: Hastings
  - first: Jeongwan
    last: Haah
year: 2021
abstract: We present a quantum error correcting code with dynamically generated
  logical qubits. When viewed as a subsystem code, the code has no logical
  qubits. Nevertheless, our measurement patterns generate logical qubits,
  allowing the code to act as a fault-tolerant quantum memory. Our particular
  code gives a model very similar to the two-dimensional toric code, but each
  measurement is a two-qubit Pauli measurement.
