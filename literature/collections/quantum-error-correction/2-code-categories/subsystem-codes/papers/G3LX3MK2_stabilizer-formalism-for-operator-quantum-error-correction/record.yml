item_type: journalArticle
title: Stabilizer Formalism for Operator Quantum Error Correction
authors:
  - first: David
    last: Poulin
year: 2005
abstract: Operator quantum error correction is a recently developed theory that
  provides a generalized framework for active error correction and passive error
  avoiding schemes. In this paper, we describe these codes in the stabilizer
  formalism of standard quantum error correction theory. This is achieved by
  adding a "gauge" group to the standard stabilizer definition of a code that
  defines an equivalence class between encoded states. Gauge transformations
  leave the encoded information unchanged; their effect is absorbed by virtual
  gauge qubits that do not carry useful information. We illustrate the
  construction by identifying a gauge symmetry in Shor's 9-qubit code that
  allows us to remove 4 of its 8 stabilizer generators, leading to a simpler
  decoding procedure and a wider class of logical operations without affecting
  its essential properties. This opens the path to possible improvements of the
  error threshold of fault-tolerant quantum computing.
