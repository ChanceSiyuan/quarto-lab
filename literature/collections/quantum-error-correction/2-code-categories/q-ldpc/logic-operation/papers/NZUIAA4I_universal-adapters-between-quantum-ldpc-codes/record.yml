item_type: preprint
title: Universal adapters between quantum LDPC codes
authors:
  - first: Esha
    last: Swaroop
  - first: Tomas
    last: Jochym-O'Connor
  - first: Theodore J.
    last: Yoder
year: 2024
abstract: We propose the repetition code adapter as a way to perform joint
  logical Pauli measurements within a quantum low-density parity check (LDPC)
  codeblock or between separate such codeblocks. This adapter is universal in
  the sense that it works regardless of the LDPC codes involved and the Paulis
  being measured. The construction achieves joint logical Pauli measurement of
  $t$ weight $O(d)$ operators using $O(td\log^2d)$ additional qubits and checks
  and $O(d)$ time. We also show for some geometrically-local codes in fixed
  $D\ge2$ dimensions that only $O(td)$ additional qubits and checks are required
  instead. By extending the adapter in the case $t=2$, we construct a toric code
  adapter that uses $O(d^2)$ additional qubits and checks to perform targeted
  logical CNOT gates on arbitrary LDPC codes via Dehn twists. To obtain some of
  these results, we develop a novel weaker form of graph edge expansion.
