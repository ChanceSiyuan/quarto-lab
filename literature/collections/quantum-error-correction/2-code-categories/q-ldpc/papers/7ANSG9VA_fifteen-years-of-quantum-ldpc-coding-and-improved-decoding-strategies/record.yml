year: 2015
abstract: The near-capacity performance of classical low-density parity check
  (LDPC) codes and their efﬁcient iterative decoding makes quantum LDPC (QLPDC)
  codes a promising candidate for quantum error correction. In this paper, we
  present a comprehensive survey of QLDPC codes from the perspective of code
  design as well as in terms of their decoding algorithms. We also conceive a
  modiﬁed non-binary decoding algorithm for homogeneous
  Calderbank–Shor–Steane-type QLDPC codes, which is capable of alleviating the
  problems imposed by the unavoidable length-four cycles. Our modiﬁed decoder
  outperforms the stateof-the-art decoders in terms of their word error rate
  performance, despite imposing a reduced decoding complexity. Finally, we
  intricately amalgamate our modiﬁed decoder with the classic uniformly
  reweighted belief propagation for the sake of achieving an improved
  performance.
