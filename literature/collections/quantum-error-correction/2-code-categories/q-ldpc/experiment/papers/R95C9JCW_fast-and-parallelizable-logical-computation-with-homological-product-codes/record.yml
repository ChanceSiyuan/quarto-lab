year: 2024
abstract: Quantum error correction is necessary to perform large-scale quantum
  computation, but requires extremely large overheads in both space and time.
  High-rate quantum low-density-parity-check (qLDPC) codes promise a route to
  reduce qubit numbers, but performing computation while maintaining low space
  cost has required serialization of operations and extra time costs. In this
  work, we design fast and parallelizable logical gates for qLDPC codes, and
  demonstrate their utility for key algorithmic subroutines such as the quantum
  adder. Our gate gadgets utilize transversal logical CNOTs between a data qLDPC
  code and a suitably constructed ancilla code to perform parallel Pauli product
  measurements (PPMs) on the data logical qubits. For hypergraph product codes,
  we show that the ancilla can be constructed by simply modifying the base
  classical codes of the data code, achieving parallel PPMs on a subgrid of the
  logical qubits with a lower space-time cost than existing schemes for an
  important class of circuits. Generalizations to 3D and 4D homological product
  codes further feature fast PPMs in constant depth. While prior work on qLDPC
  codes has focused on individual logical gates, we initiate the study of
  fault-tolerant compilation with our expanded set of native qLDPC code
  operations, constructing algorithmic primitives for preparing $k$-qubit GHZ
  states and distilling/teleporting $k$ magic states with $O(1)$ space overhead
  in $O(1)$ and $O(\sqrt{k} \log k)$ logical cycles, respectively. We further
  generalize this to key algorithmic subroutines, demonstrating the efficient
  implementation of quantum adders using parallel operations. Our constructions
  are naturally compatible with reconfigurable architectures such as neutral
  atom arrays, paving the way to large-scale quantum computation with low space
  and time overheads.
