title: Bounds on the Average Binary Minimum Distance and the Maximum Likelihood
  Performance of Reed Solomon Codes
authors:
  - first: Mostafa
    last: El-Khamy
  - first: Robert J
    last: McEliece
  - first: Reed
    last: Solomon
year: null
abstract: In this paper, an average binary weight enumerator of Reed Solomon
  (RS) codes is derived assuming a binomial distribution of the bits in a
  non-zero symbol. Lower bounds on the average binary minimum distance are
  shown. The averaged binary image of the RS code is shown to be asymptotically
  good for suﬃciently high rates. These results are used to bound the maximum
  likelihood performance of RS codes, whose binary image is modulated using
  binary phase shift keying on AWGN channels, for both hard and soft decision
  decoding.
