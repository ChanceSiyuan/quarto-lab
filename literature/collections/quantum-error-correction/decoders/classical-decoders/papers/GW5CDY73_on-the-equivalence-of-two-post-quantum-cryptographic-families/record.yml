abstract: The Maximum Likelihood Decoding Problem (MLD) and the Multivariate
  Quadratic System Problem (MQ) are known to be NP-hard. In this paper we
  present a polynomial-time reduction from any instance of MLD to an instance of
  MQ, and viceversa.
