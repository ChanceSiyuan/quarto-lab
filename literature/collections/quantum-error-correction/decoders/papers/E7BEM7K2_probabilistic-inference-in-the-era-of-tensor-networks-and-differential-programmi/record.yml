title: Probabilistic Inference in the Era of Tensor Networks and Differential
  Programming
authors:
  - first: Martin
    last: Roa-Villescas
  - first: Xuanzhao
    last: Gao
  - first: Sander
    last: Stuijk
  - first: Henk
