item_type: journalArticle
title: "Blossom V: a new implementation of a minimum cost perfect matching algorithm"
authors:
  - first: Vladimir
    last: Kolmogorov
year: 2009
abstract: "We describe a new implementation of the Edmonds’s algorithm for
  computing a perfect matching of minimum cost, to which we refer as Blossom V.
  A key feature of our implementation is a combination of two ideas that were
  shown to be effective for this problem: the “variable dual updates” approach
  of Cook and Rohe (INFORMS J Comput 11(2):138–148, 1999) and the use of
  priority queues. We achieve this by maintaining an auxiliary graph whose nodes
  correspond to alternating trees in the Edmonds’s algorithm. While our use of
  priority queues does not improve the worst-case complexity, it appears to lead
  to an efﬁcient technique. In the majority of our tests Blossom V outperformed
  previous implementations of Cook and Rohe (INFORMS J Comput 11(2):138–148,
  1999) and Mehlhorn and Schäfer (J Algorithmics Exp (JEA) 7:4, 2002), sometimes
  by an order of magnitude. We also show that for large VLSI instances it is
  beneﬁcial to update duals by solving a linear program, contrary to a
  conjecture by Cook and Rohe."
