abstract: Quantum error correction is needed for future quantum computers.
  Classical error correcting codes are not suitable for this due to the nature
  of quantum mechanics. Therefore, new codes need to be developed. A promising
  candidate is the toric code, a surface code, because of its locality and its
  high error correcting capability and thresholds (the error probability below
  which increasing the size of the code decreases the failure rate). This thesis
  provides an introduction to quantum error correction and the stabilizer
  formalism, which is used to introduce the toric code. Several decoders are
  looked at, including the Minimum Weight Perfect Matching (MWPM) decoder and a
  recently developed decoder, the Union-Find (UF) decoder [1]. The UF decoder is
  useful because of its almost-linear time complexity, while only reducing the
  threshold by a marginal amount compared to the MWPM decoder. In this thesis,
  the time complexity of the weighted growth version of the UF decoder is
  analysed.
