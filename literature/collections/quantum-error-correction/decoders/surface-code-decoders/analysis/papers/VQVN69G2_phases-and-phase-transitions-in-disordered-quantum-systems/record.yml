title: Phases and phase transitions in disordered quantum systems
authors:
  - first: Thomas
    last: Vojta
year: 2013
abstract: These lecture notes give a pedagogical introduction to phase
  transitions in disordered quantum systems and to the exotic Griffiths phases
  induced in their vicinity. We first review some fundamental concepts in the
  physics of phase transitions. We then derive criteria governing under what
  conditions spatial disorder or randomness can change the properties of a phase
  transition. After introducing the strong-disorder renormalization group
  method, we discuss in detail some of the exotic phenomena arising at phase
  transitions in disordered quantum systems. These include infinite-randomness
  criticality, rare regions and quantum Griffiths singularities, as well as the
  smearing of phase transitions. We also present a number of experimental
  examples.
