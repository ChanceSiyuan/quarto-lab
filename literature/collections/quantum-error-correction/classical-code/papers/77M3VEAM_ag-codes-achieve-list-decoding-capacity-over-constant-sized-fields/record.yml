year: 2024
abstract: The recently-emerging field of higher order MDS codes has sought to
  unify a number of concepts in coding theory. Such areas captured by higher
  order MDS codes include maximally recoverable (MR) tensor codes, codes with
  optimal list-decoding guarantees, and codes with constrained generator
  matrices (as in the GM-MDS theorem). By proving these equivalences,
  Brakensiek-Gopi-Makam showed the existence of optimally list-decodable
  Reed-Solomon codes over exponential sized fields. Building on this, recent
  breakthroughs by Guo-Zhang and Alrabiah-Guruswami-Li have shown that randomly
  punctured Reed-Solomon codes achieve list-decoding capacity (which is a
  relaxation of optimal list-decodability) over linear size fields. We extend
  these works by developing a formal theory of relaxed higher order MDS codes.
  In particular, we show that there are two inequivalent relaxations which we
  call lower and upper relaxations. The lower relaxation is equivalent to
  relaxed optimal list-decodable codes and the upper relaxation is equivalent to
  relaxed MR tensor codes with a single parity check per column. We then
  generalize the techniques of GZ and AGL to show that both these relaxations
  can be constructed over constant size fields by randomly puncturing suitable
  algebraic-geometric codes. For this, we crucially use the generalized GM-MDS
  theorem for polynomial codes recently proved by Brakensiek-Dhar-Gopi. We
  obtain the following corollaries from our main result. First, randomly
  punctured AG codes of rate $R$ achieve list-decoding capacity with list size
  $O(1/\epsilon)$ and field size $\exp(O(1/\epsilon^2))$. Prior to this work, AG
  codes were not even known to achieve list-decoding capacity. Second, by
  randomly puncturing AG codes, we can construct relaxed MR tensor codes with a
  single parity check per column over constant-sized fields, whereas
  (non-relaxed) MR tensor codes require exponential field size.
