title: Opportunities and Challenges in Fault-Tolerant Quantum Computation
authors:
  - first: Daniel
    last: Gottesman
year: 2022
abstract: I will give an overview of what I see as some of the most important
  future directions in the theory of fault-tolerant quantum computation. In
  particular, I will give a brief summary of the major problems that need to be
  solved in fault tolerance based on low-density parity check codes and in
  hardware-specific fault tolerance. I will then conclude with a discussion of a
  possible new paradigm for designing fault-tolerant protocols based on a
  space-time picture of quantum circuits.
