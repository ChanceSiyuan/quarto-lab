item_type: preprint
title: Information Hierarchy in Many-Body Berry Phase
authors:
  - first: Kai
    last: Watanabe
year: 2026
abstract: "Many-body topology is a central concept in modern theories of solids,
  and identifying effective degrees of freedom that capture it is important both
  fundamentally and practically. This work studies the extent to which geometric
  information of an interacting many-body ground state can be inferred from a
  finite number of local correlations. Starting from the Resta formula, $
  z=\\left\\langle \\exp\\!\\left(\\frac{2πi}{L}\\hat X\\right)\\right\\rangle$,
  we view $\\log z$ as the cumulant generating function and establish a generic
  information hierarchy across cumulant orders. We show that, for an
  $N$-particle system, even complete knowledge of all density correlators up to
  order $N-1$ does not, in general, uniquely determine the Berry phase
  $γ=\\operatorname{Im}\\log z \\, (\\mathrm{mod}\\ 2π)$. In the thermodynamic
  limit, the statement becomes stronger: no finite set of local correlators
  suffices to determine the global holonomy. We also identify two exceptional
  yes-go cases in which the hierarchy is broken. First, for quasi-free models,
  all cumulants are determined by the particle two-point correlation function.
  Second, symmetry-enforced constraints can reduce the infinite cumulant sum
  entering $\\log z$ to finite information. The argument is analytic and does
  not rely on a specific microscopic Hamiltonian. Our results clarify a
  limitation of approaches based on local degrees of freedom for many-body
  holonomy and provide a minimal framework for distinguishing when global
  holonomies are encoded in local correlations and when they are not. We also
  comment on the possibility of analogous hierarchies in other contexts, such as
  the quantum marginal problem in quantum information theory and many-body
  scattering problems. Finally, we discuss implications for future numerical
  work, including machine-learning approaches to the search for topological
  phases."
