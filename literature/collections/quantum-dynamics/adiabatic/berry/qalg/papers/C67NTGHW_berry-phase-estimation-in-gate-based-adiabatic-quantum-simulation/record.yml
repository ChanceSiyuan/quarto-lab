title: Berry Phase Estimation in Gate-Based Adiabatic Quantum Simulation
authors:
  - first: Bruno
    last: Murta
  - first: G.
    last: Catarina
  - first: J.
    last: Fernandez-Rossier
year: 2020
abstract: Gate-based quantum computers can in principle simulate the adiabatic
  dynamics of a large class of Hamiltonians. Here we consider the cyclic
  adiabatic evolution of a parameter in the Hamiltonian. We propose a quantum
  algorithm to estimate the Berry phase and use it to classify the topological
  order of both single-particle and interacting models, highlighting the
  differences between the two. This algorithm is immediately extensible to any
  interacting topological system. Our results evidence the potential of
  near-term quantum hardware for the topological classification of quantum
  matter.
