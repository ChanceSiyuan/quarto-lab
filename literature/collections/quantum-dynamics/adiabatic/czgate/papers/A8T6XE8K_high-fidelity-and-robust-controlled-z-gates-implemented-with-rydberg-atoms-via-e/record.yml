item_type: journalArticle
title: High-fidelity and robust controlled-Z gates implemented with Rydberg
  atoms via echoing rapid adiabatic passage
authors:
  - first: Ming
    last: Xue
  - first: Shijie
    last: Xu
  - first: Xinwei
    last: Li
  - first: Xiangliang
    last: Li
year: 2024
abstract: High-fidelity and robust quantum gates are essential for quantum
  information processing, where neutral Rydberg atoms trapped in optical tweezer
  arrays serving as a versatile platform for the implementation. We propose a
  rapid adiabatic passage (RAP) scheme for achieving a high-fidelity
  controlled-Z (CZ) gate on a neutral atom Rydberg platform. Utilizing only
  global laser dressing, our scheme involves echoing two identical RAP pulses
  within the Rydberg blockade regime to realize a CZ gate and can be readily
  extended to a C$^k$Z gate with additional qubits. We predict a CZ gate with
  fidelity over 0.9995 using akali-atom parameters, and a CCZ gate with fidelity
  exceeding 0.999. Moreover, the direct utilization of echoing RAP pulses
  enables the implementation of a four-bit CCCZ gate at fidelity over 0.996
  without further optimization. The proposed scheme, remarkably robust to
  variations in driving fields and realistic decoherence effects, holds promise
  for future quantum information processing applications.
