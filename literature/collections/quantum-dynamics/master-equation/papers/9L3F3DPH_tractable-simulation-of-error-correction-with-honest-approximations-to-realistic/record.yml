year: 2014
abstract: In previous work, we proposed a method for leveraging efﬁcient
  classical simulation algorithms to aid in the analysis of large-scale fault
  tolerant circuits implemented on hypothetical quantum information processors.
  Here, we extend those results by numerically studying the efﬁcacy of this
  proposal as a tool for understanding the performance of an error-correction
  gadget implemented with fault models derived from physical simulations. Our
  approach is to approximate the arbitrary error maps that arise from realistic
  physical models with errors that are amenable to a particular classical
  simulation algorithm in an “honest” way; that is, such that we do not
  underestimate the faults introduced by our physical models. In all cases, our
  approximations provide an “honest representation” of the performance of the
  circuit composed of the original errors. This numerical evidence supports the
  use of our method as a way to understand the feasibility of an implementation
  of quantum information processing given a characterization of the underlying
  physical processes in experimentally accessible examples.
