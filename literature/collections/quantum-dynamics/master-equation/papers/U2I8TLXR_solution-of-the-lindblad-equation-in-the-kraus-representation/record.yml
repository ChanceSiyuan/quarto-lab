year: 2006
abstract: The so-called Lindblad equation, a typical master equation describing
  the dissipative quantum dynamics, is shown to be solvable for finite-level
  systems in a compact form without resort to writing it down as a set of
  equations among matrix elements. The solution is then naturally given in an
  operator form, known as the Kraus representation. Following a few simple
  examples, the general applicability of the method is clarified.
