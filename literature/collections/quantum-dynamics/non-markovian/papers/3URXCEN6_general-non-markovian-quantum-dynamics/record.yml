item_type: journalArticle
title: General Non-Markovian Quantum Dynamics
authors:
  - first: Vasily E.
    last: Tarasov
year: 2021
abstract: A general approach to the construction of non-Markovian quantum theory
  is proposed. Non-Markovian equations for quantum observables and states are
  suggested by using general fractional calculus. In the proposed approach, the
  non-locality in time is represented by operator kernels of the Sonin type. A
  wide class of the exactly solvable models of non-Markovian quantum dynamics is
  suggested. These models describe open (non-Hamiltonian) quantum systems with
  general form of nonlocality in time. To describe these systems, the Lindblad
  equations for quantum observable and states are generalized by taking into
  account a general form of nonlocality. The non-Markovian quantum dynamics is
  described by using integro-differential equations with general fractional
  derivatives and integrals with respect to time. The exact solutions of these
  equations are derived by using the operational calculus that is proposed by
  Yu. Luchko for general fractional differential equations. Properties of
  bi-positivity, complete positivity, dissipativity, and generalized
  dissipativity in general non-Markovian quantum dynamics are discussed.
  Examples of a quantum oscillator and two-level quantum system with a general
  form of nonlocality in time are suggested.
