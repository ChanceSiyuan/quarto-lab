year: 2024
abstract: >-
  We present a Floquet Schrieffer-Wolff transform (FSWT) to obtain effective
  Floquet Hamiltonians and micromotion operators of periodically driven
  many-body systems for any nonresonant driving frequency. The FSWT
  perturbatively eliminates the oscillatory components in the driven Hamiltonian
  by solving operator-valued Sylvester equations with systematic approximations.
  It goes beyond various high-frequency expansion methods commonly used in
  Floquet theory, as we demonstrate with the example of the driven Fermi-Hubbard
  model. In the limit of high driving frequencies, the FSWT Hamiltonian reduces
  to the widely used Floquet-Magnus result. We anticipate this method will be
  useful for designing Rydberg multiqubit gates, controlling correlated hopping
  in quantum simulations in optical lattices, and describing multiorbital and
  long-range interacting systems driven in-gap.
              
                
                
                  
                    Published by the American Physical Society
