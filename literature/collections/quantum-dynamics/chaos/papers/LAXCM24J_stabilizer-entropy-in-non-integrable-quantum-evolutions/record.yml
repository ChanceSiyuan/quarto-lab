item_type: preprint
title: Stabilizer entropy in non-integrable quantum evolutions
authors:
  - first: Jovan
    last: Odavić
  - first: Michele
    last: Viscardi
  - first: Alioscia
    last: Hamma
year: 2025
abstract: Entanglement and stabilizer entropy are both involved in the onset of
  complex behavior in quantum many-body systems. Their interplay is at the root
  of complexity of simulability, scrambling, thermalization and typicality. In
  this work, we study the dynamics of entanglement, stabilizer entropy, and a
  novel quantity assessing their interplay - called anti-flatness, after a
  quantum quench of a spin chain. We find that free-fermion theories show a gap
  in the long-time behavior of these resources compared to their random matrix
  theory value while non-integrable models saturate it.
