title: Thermodynamics of one-dimensional solvable models
authors:
  - first: Minoru
    last: Takahashi
year: 2005
abstract: Exactly solvable models are very important in physics. They are
  important not just from a theoretical point of view but also from the
  experimentalist's perspective because in such cases theoretical results and
  experimental results can be compared without ambiguity. This is a book about
  an important class of exactly solvable models in physics. The subject area is
  the Bethe-ansatz approach for a number of one-dimensional models, and the
  setting up of equations within this approach to determine the thermodynamics
  of these systems. It is a topic that crosses the boundaries between condensed
  matter physics, mathematics and field theory. The derivation and application
  of thermodynamic Bethe-ansatz equations for one-dimensional models are
  explained in detail. This technique is indispensable for physicists studying
  the low-temperature properties of one-dimensional substances. This book,
  written by one of the top physicists in this field, and the originator of much
  of the work in the subject, will be of great interest to theoretical condensed
  matter physicists
