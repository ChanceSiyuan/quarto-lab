project:
  type: website
  output-dir: _site

website:
  title: "Chance's Quantum Lab"
  navbar:
    left:
      - text: "Home Page"
        href: index.qmd
      - text: "Theory"
        href: theory/index.qmd
      # - text: "Topics"
      #   href: theory/Topics/index.qmd
      - text: "Experiment Notes"
        href: Experiments/index.qmd
      - text: "Workspace"       # <--- 新增这一行
        href: workspace/workspace.qmd
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername

  sidebar:
    - id: notes
      title: "Contents"
      contents:
        - section: "Quantum Complexity"
          contents:
            - notes/quantum_complexity/counting_complexity.qmd
            - notes/quantum_complexity/interactive_proof.qmd
        - section: "Quantum Learning Theory"
          contents:
            - notes/quantum_learning_theory/intro.qmd
        - section: "Shadow Tomography"
          contents:
            - notes/shadow_tomography/intro.qmd
            - notes/shadow_tomography/multicopy.qmd

    - id: lowerbounds
      title: "Lower Bounds Toolbox"
      contents:
        - theory/Topics/Lowerbounds/index.qmd
        - section: "Core Concepts"
          contents:
            - theory/Topics/Lowerbounds/lecam_method.qmd
            - theory/Topics/Lowerbounds/povm_restrictions.qmd
            - theory/Topics/Lowerbounds/adaptive_strategies.qmd
        - section: "Hard Instance Constructions"
          contents:
            - theory/Topics/Lowerbounds/operator_mixed.qmd
            - theory/Topics/Lowerbounds/haar_ensembles.qmd
        - section: "Simplification Techniques"
          contents:
            - theory/Topics/Lowerbounds/symmetric_strategies.qmd

    - id: shadow_tomography
      title: "Classical Shadow Tomography"
      contents:
        - theory/Topics/Shadow_tomography/index.qmd
        - section: "Foundations"
          contents:
            - theory/Topics/Shadow_tomography/intro.qmd
        - section: "Multi-Copy Strategies"
          contents:
            - theory/Topics/Shadow_tomography/3desgin_multi_local_shadow.qmd
            - theory/Topics/Shadow_tomography/multicopy.qmd
            - theory/Topics/Shadow_tomography/nonlocal_multicopy.qmd
        - section: "Lower Bounds"
          contents:
            - theory/Topics/Shadow_tomography/lowerbound.qmd

format:
  live-html:
    html-math-method: katex
    theme: cosmo      
    css: styles.css
    toc: true          
    code-copy: true       
    citations-hover: true
    pyodide:
      packages:
        - numpy
        - scipy
    filters:
      - tikz

editor: source 

bibliography: references.bib
csl: aps.csl  

crossref:
  custom:
    - kind: float
      key: lem
      reference-prefix: "Lemma"
      space-before-numbering: true
    - kind: float
      key: thm
      reference-prefix: "Theorem"
      space-before-numbering: true
    - kind: float
      key: def
      reference-prefix: "Definition"
      space-before-numbering: true

preview:
  port: 4200
  host: "0.0.0.0"
