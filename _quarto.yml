format:
  live-html:
    html-math-method: katex
    theme: 
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    citations-hover: true
    include-after-body: _includes/comment-github-link.html
    filters:
      - tikz
      - code-runner

comments:
  giscus:
    repo: "ChanceSiyuan/quarto-lab"
    repo-id: "R_kgDOREwORA"
    category: "General"
    category-id: "DIC_kwDOREwORM4C1teX"
    mapping: "pathname"
    reactions-enabled: true
    loading: lazy
    input-position: "bottom"
    theme: "preferred_color_scheme"

editor: source

bibliography: references.bib
csl: aps.csl  

crossref:
  custom:
    - kind: float
      key: lem
      reference-prefix: "Lemma"
      space-before-numbering: true
    - kind: float
      key: thm
      reference-prefix: "Theorem"
      space-before-numbering: true
    - kind: float
      key: def
      reference-prefix: "Definition"
      space-before-numbering: true
preview:
  port: 4200
  host: "0.0.0.0"
execute:
  freeze: auto