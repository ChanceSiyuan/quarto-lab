project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - theory/index.qmd
    - theory/**/*.qmd

website:
  title: "Chance's Quantum Lab"
  # 首页为项目根目录的 index.qmd（生成 _site/index.html，对应 /）
  navbar:
    left:
      - text: "Home Page"
        href: index.qmd
      - text: "Knowledge"
        href: theory/index.qmd
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername

format:
  html:
    html-math-method: katex
    theme: 
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    citations-hover: true
    include-after-body: _includes/comment-github-link.html

comments:
  giscus:
    repo: "ChanceSiyuan/quarto-lab"
    repo-id: "R_kgDOREwORA"
    category: "General"
    category-id: "DIC_kwDOREwORM4C1teX"
    mapping: "pathname"
    reactions-enabled: true
    loading: lazy
    input-position: "bottom"
    theme: "preferred_color_scheme"

editor: source

bibliography: references.bib
csl: aps.csl  

crossref:
  custom:
    - kind: float
      key: lem
      reference-prefix: "Lemma"
      space-before-numbering: true
    - kind: float
      key: thm
      reference-prefix: "Theorem"
      space-before-numbering: true
    - kind: float
      key: def
      reference-prefix: "Definition"
      space-before-numbering: true
preview:
  port: 4200
  host: "127.0.0.1"
execute:
  enabled: false
