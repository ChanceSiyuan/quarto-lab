project:
  type: website
  output-dir: _site

website:
  draft-mode: visible
  title: "Chance's Quantum Lab"
  # 首页为项目根目录的 index.qmd（生成 _site/index.html，对应 /）
  navbar:
    left:
      - text: "Home Page"
        href: index.qmd
      - text: "Theory"
        href: theory/index.qmd
      # - text: "Topics"
      #   href: theory/Topics/index.qmd
      - text: "Experiment Notes"
        href: Experiments/index.qmd
      - text: "Workspace"       # <--- 新增这一行
        href: workspace/workspace.qmd
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername

  sidebar:
    - id: notes
      title: "Contents"
      contents:
        - section: "Quantum Complexity"
          contents:
            - notes/quantum_complexity/counting_complexity.qmd
            - notes/quantum_complexity/interactive_proof.qmd
        - section: "Quantum Learning Theory"
          contents:
            - notes/quantum_learning_theory/intro.qmd
        - section: "Shadow Tomography"
          contents:
            - notes/shadow_tomography/intro.qmd
            - notes/shadow_tomography/multicopy.qmd

    - id: lowerbounds
      title: "Lower Bounds Toolbox"
      contents:
        - theory/Topics/Lowerbounds/index.qmd
        - section: "Core Concepts"
          contents:
            - theory/Topics/Lowerbounds/lecam_method.qmd
            - theory/Topics/Lowerbounds/povm_restrictions.qmd
            - theory/Topics/Lowerbounds/adaptive_strategies.qmd
        - section: "Hard Instance Constructions"
          contents:
            - theory/Topics/Lowerbounds/operator_mixed.qmd
            - theory/Topics/Lowerbounds/haar_ensembles.qmd

    - id: iqp
      title: "IQP Circuit Supremacy"
      contents:
        - theory/Topics/IQP/index.qmd
        - section: "Classical Simulation Theory"
          contents:
            - theory/Topics/IQP/classical_simulation.qmd
            - theory/Topics/IQP/hardness_proofs.qmd
        - section: "IQP Supremacy"
          contents:
            - theory/Topics/IQP/iqp_supremacy.qmd
        - section: "Experimental Realizations"
          contents:
            - theory/Topics/IQP/mbqc_iqp.qmd
            - theory/Topics/IQP/ft_iqp.qmd
        - section: "Noise & Simulation"
          contents:
            - theory/Topics/IQP/noise_simulation.qmd

    - id: shadow_tomography
      title: "Classical Shadow Tomography"
      contents:
        - theory/Topics/Shadow_tomography/index.qmd
        - section: "Foundations"
          contents:
            - theory/Topics/Shadow_tomography/intro.qmd
        - section: "Multi-Copy Strategies"
          contents:
            - theory/Topics/Shadow_tomography/3desgin_multi_local_shadow.qmd
            - theory/Topics/Shadow_tomography/3d2c_appli1.qmd
            - theory/Topics/Shadow_tomography/3d2c_appli2.qmd
            - theory/Topics/Shadow_tomography/multicopy.qmd
            - theory/Topics/Shadow_tomography/nonlocal_multicopy.qmd
        - section: "Lower Bounds"
          contents:
            - theory/Topics/Shadow_tomography/lowerbound.qmd

format:
  live-html:
    html-math-method: katex
    theme: 
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    citations-hover: true
    include-after-body: _includes/comment-github-link.html
    filters:
      - tikz
      - code-runner

comments:
  giscus:
    repo: "ChanceSiyuan/quarto-lab"
    repo-id: "R_kgDOREwORA"
    category: "General"
    category-id: "DIC_kwDOREwORM4C1teX"
    mapping: "pathname"
    reactions-enabled: true
    loading: lazy
    input-position: "bottom"
    theme: "preferred_color_scheme"

editor: source

bibliography: references.bib
csl: aps.csl  

crossref:
  custom:
    - kind: float
      key: lem
      reference-prefix: "Lemma"
      space-before-numbering: true
    - kind: float
      key: thm
      reference-prefix: "Theorem"
      space-before-numbering: true
    - kind: float
      key: def
      reference-prefix: "Definition"
      space-before-numbering: true
preview:
  port: 4200
  host: "0.0.0.0"
