project:
  type: website
website:
  title: Research Loop Knowledge
  site-path: /knowledge/
  search: true
format:
  html:
    toc: true
    css: research-loop.css
    header-includes: <script type="module" src="/knowledge/research-loop-tree.js"></script>
crossref:
  custom:
    - kind: float
      key: lem
      reference-prefix: Lemma
      space-before-numbering: true
    - kind: float
      key: thm
      reference-prefix: Theorem
      space-before-numbering: true
    - kind: float
      key: def
      reference-prefix: Definition
      space-before-numbering: true
execute:
  enabled: false
